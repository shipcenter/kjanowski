    <div class="actions"><label class="field" style="width:210px"><span>Osoba</span><select id="c-owner" data-act-change="c-owner">${opt('', 'Cały zespół', owner)}${opt('_none', 'Bez opiekuna', owner)}${team().map(m => opt(m.id, m.name + (m.id === me ? ' (Ty)' : ''), owner)).join('')}</select></label>
    <button class="btn primary" data-act="lead-new">${ICONS.plus}Dodaj lead</button></div></div>
    ${!me && team().length ? `<div class="callout" style="margin-bottom:16px">Wskaż, którą osobą z zespołu jesteś (zakładka „Zespół i ustawienia” → „To ja”), a ten widok i licznik w menu pokażą tylko Twoje kontakty.</div>` : ''}`;
  const row = l => {
    const time = l.nextTaskTime ? l.nextTaskTime : (l.nextTaskDate === t ? 'dziś' : fdateShort(l.nextTaskDate));
    return `<div class="contact-row"><span class="when ${dueCls(l.nextTaskDate)}">${esc(time)}</span>
      <div style="min-width:0"><a href="#lead-${l.id}"><b>${esc(l.name || '(bez nazwy)')}</b></a> ${modelPill(l)}<div class="small ink2">${esc(l.nextTask || 'Kontakt')}${l.nextTaskDate < t ? ` · <span class="overdue">od ${fdate(l.nextTaskDate)}</span>` : ''}</div>
      <div class="tiny muted">${esc([fmtPhone(l.phone), l.city, STAGES[stageIdx(l)].short, owner ? '' : memberName(l.ownerId)].filter(Boolean).join(' · '))}${l.presentationAt ? ' · prezentacja ' + fdateShort(l.presentationAt) : ''}</div></div>
      <div class="ctl">${l.phone ? `<button class="btn sm ghost" data-act="copy" data-text="${esc(l.phone)}">${ICONS.copy}Telefon</button>` : ''}<button class="btn sm" data-act="snooze" data-id="${l.id}" data-d="1">+1 dzień</button><button class="btn sm primary" data-act="call-log" data-id="${l.id}">Zapisz kontakt</button></div></div>`;
  };
  S.ui.cExpand = S.ui.cExpand || {};
  const groupsHtml = groups.map(([n, tone, list], gi) => { if (!list.length) return ''; const lim = gi < 2 || S.ui.cExpand[gi] ? list.length : 6; return `<div class="card daygroup"><h3>${n} <span class="pill ${tone}">${list.length}</span></h3>${list.slice(0, lim).map(row).join('')}${list.length > lim ? `<button class="btn sm ghost" data-act="c-expand" data-i="${gi}">Pokaż wszystkie (${list.length})</button>` : ''}</div>`; }).join('');
  const newCard = `<div class="card"><div class="cardhead"><h2>Do pierwszego kontaktu</h2><p>${newOnes.length} nowych</p></div>
    ${newOnes.length ? newOnes.map(l => `<div class="contact-row"><span class="when ${l.createdTs && Date.now() - new Date(l.createdTs) > 864e5 ? 'overdue' : 'today'}">${fdateShort(l.createdAt)}</span><div style="min-width:0"><a href="#lead-${l.id}"><b>${esc(l.name)}</b></a> ${modelPill(l)}<div class="tiny muted">${esc([l.phone, l.email, l.city, SOURCE_MAP[l.source]?.n].filter(Boolean).join(' · '))}</div></div>
      <div class="ctl">${l.phone ? `<button class="btn sm ghost" data-act="copy" data-text="${esc(l.phone)}">${ICONS.copy}Telefon</button>` : ''}<button class="btn sm primary" data-act="call-log" data-id="${l.id}">Pierwsza rozmowa</button></div></div>`).join('') : '<p class="muted small">Wszyscy nowi kandydaci mają już za sobą pierwszą rozmowę.</p>'}</div>`;
  const trainings = leadsArr().filter(byOwner).filter(l => l.trainingStart && (l.trainingEnd || l.trainingStart) >= t).sort((a2, b2) => a2.trainingStart.localeCompare(b2.trainingStart));
  const wonNoTraining = leadsArr().filter(byOwner).filter(l => isWon(l) && !l.trainingStart);
  const trainCard = (trainings.length || wonNoTraining.length) ? `<div class="card"><div class="cardhead"><h2>Szkolenia w centrali</h2><p>${trainings.length}</p></div>
    ${wonNoTraining.map(l => `<div class="contact-row"><span class="when overdue">brak</span><div style="min-width:0"><a href="#lead-${l.id}"><b>${esc(l.name)}</b></a><div class="tiny muted">Umowa podpisana – zaplanuj 3-dniowe szkolenie</div></div><div class="ctl"><button class="btn sm primary" data-act="train-plan" data-id="${l.id}">Od poniedziałku</button></div></div>`).join('')}
    ${trainings.map(l => `<div class="contact-row"><span class="when ${dueCls(l.trainingStart)}">${fdateShort(l.trainingStart)}</span><div style="min-width:0"><a href="#lead-${l.id}"><b>${esc(l.name)}</b></a> ${modelPill(l)}<div class="tiny muted">${fdate(l.trainingStart)} – ${fdate(l.trainingEnd || trainingEnd(l.trainingStart))} · centrala</div></div><div></div></div>`).join('')}</div>` : '';
  const meetCard = `<div class="card"><div class="cardhead"><h2>Spotkania – 7 dni</h2><p>${meetings.length}</p></div>${meetings.length ? meetings.map(l => `<div class="contact-row"><span class="when ${dueCls(l.meetingAt)}">${fdateShort(l.meetingAt)}</span><div style="min-width:0"><a href="#lead-${l.id}"><b>${esc(l.name)}</b></a><div class="tiny muted">${fdt(l.meetingAt)} · ${esc(l.meetingType || '')} ${esc(l.meetingPlace || '')}</div></div><div></div></div>`).join('') : '<p class="muted small">Brak zaplanowanych spotkań.</p>'}</div>`;
  const noNextCard = noNext.length ? `<div class="card"><div class="cardhead"><h2>Bez zaplanowanego kontaktu</h2><p>${noNext.length}</p></div><p class="note" style="margin-bottom:6px">Aktywni kandydaci po pierwszej rozmowie, którym nikt nie ustawił kolejnego kontaktu.</p>${noNext.slice(0, 15).map(l => `<div class="contact-row"><span class="when muted">—</span><div style="min-width:0"><a href="#lead-${l.id}"><b>${esc(l.name)}</b></a> ${modelPill(l)}<div class="tiny muted">ostatni kontakt ${fdateShort(lastContact(l) || l.createdAt)}</div></div><div class="ctl"><button class="btn sm" data-act="snooze" data-id="${l.id}" data-d="1">Na jutro</button></div></div>`).join('')}</div>` : '';
  const smsCard = pendingSms.length ? `<div class="card"><div class="cardhead"><h2>SMS w kolejce</h2><p>${pendingSms.length}</p></div>${smsGatewayOn() ? '' : '<p class="note" style="margin-bottom:6px">Bramka SMS nie jest podłączona. Skopiuj treść i wyślij ręcznie albo poczekaj na podłączenie.</p>'}${pendingSms.map(x => `<div class="contact-row"><span class="when ${x.kind === 'przypomnienie' ? 'due' : ''}">${x.kind === 'przypomnienie' ? 'teraz' : fdateShort(x.createdTs)}</span><div style="min-width:0"><a href="#lead-${x.leadId}"><b>${esc(x.leadName)}</b></a> <span class="mono small">${esc(x.phone)}</span>${x.kind === 'przypomnienie' ? ' <span class="pill warn">przypomnienie o ' + ((REMIND_TOPICS[x.topic || 'spotkanie'] || REMIND_TOPICS.spotkanie).n) + ' ' + esc(fdt(x.eventAt || x.meetingAt)) + '</span>' : ''}<div class="tiny muted">${esc(x.text)}</div></div><div class="ctl"><button class="btn sm ghost" data-act="copy" data-text="${esc(x.text)}">${ICONS.copy}Treść</button><button class="btn sm" data-act="sms-done" data-id="${x.id}">Wysłany ręcznie</button><button class="iconbtn" data-act="sms-cancel" data-id="${x.id}" aria-label="Anuluj">${ICONS.x}</button></div></div>`).join('')}</div>` : '';

  return head + `<div class="split"><div class="stack">${groupsHtml}${empty}</div><div class="stack">${delCard}${newCard}${trainCard}${smsCard}${meetCard}${noNextCard}</div></div>`;

/* mail z prezentacją / kalkulatorem: gotowa wiadomość + zapis wysłania */
function openMailModal(l, tplKey, opts = {}) {
  const t = TEMPLATES[tplKey]; if (!t) return;
  const out = t.f(msgContext(l, l.form));
  const isPres = tplKey === 'email_prezentacja';
  const isConf = tplKey === 'email_potwierdzenie';
  const again = tplKey === 'email_umowa_wglad' ? !!l.contractPreviewAt : isConf ? !!l.meetingConfirmedAt : isPres ? !!l.presentationAt : !!l.calcSentAt;
  const mailto = () => `mailto:${encodeURIComponent(l.email || '')}?subject=${encodeURIComponent($('#ml-subj').value)}&body=${encodeURIComponent($('#ml-body').value)}`;
  openModal(`<div class="mh"><h2>${esc(again ? 'Wyślij ponownie: ' + t.n.toLowerCase() : t.n)} – ${esc(l.name)}</h2><button class="iconbtn" data-act="modal-close" aria-label="Zamknij">${ICONS.x}</button></div>
    <div class="mb">
      ${again ? `<p class="callout">${tplKey === 'email_umowa_wglad' ? 'Umowa do wglądu była już wysłana ' + fdate(l.contractPreviewAt) : isConf ? 'Potwierdzenie spotkania było już wysłane ' + fdate(l.meetingConfirmedAt) : (isPres ? 'Prezentacja była już wysłana ' + fdate(l.presentationAt) : 'Kalkulator był już wysłany ' + fdate(l.calcSentAt))}.</p>` : ''}

        <label class="field full"><span>Temat</span><input type="text" id="ml-subj" value="${esc(out.subject || '')}"></label>
        <label class="field full"><span>Treść</span><textarea id="ml-body" rows="14">${esc(out.body)}</textarea></label>
      </div>
      <div class="row"><button type="button" class="btn sm primary" id="ml-copy-html">${ICONS.copy}Kopiuj e-mail z formatowaniem</button><button type="button" class="btn sm" id="ml-copy-subj">${ICONS.copy}Kopiuj temat</button><button type="button" class="btn sm" id="ml-copy-body">${ICONS.copy}Kopiuj sam tekst</button><a class="btn sm" id="ml-open" href="#" target="_blank" rel="noopener">${ICONS.email}Otwórz w programie pocztowym</a></div>
      ${tplKey === 'email_umowa_wglad' ? `<div class="row"><span class="small muted">Załączniki do pobrania:</span>${contractFilesFor(l).map(f => `<button type="button" class="btn sm" data-act="contract-pdf" data-file="${f.id}">${ICONS.file}${esc(f.n)}</button>`).join('')}</div>` : ''}
      ${emailPreviewBlock('ml-prev')}
      <p class="note">„Kopiuj e-mail z formatowaniem” kopiuje treść z klikalnymi linkami i firmową stopką – w Thunderbirdzie utwórz nową wiadomość, wpisz temat i wklej (Ctrl+V). Panel nie wysyła maili sam – wyślij wiadomość ze skrzynki ${esc(offer().email)}, dołącz ${tplKey === 'email_umowa_wglad' ? 'wzór umowy (PDF – przyciski wyżej), jeśli w treści nie ma linku do niej,' : isConf ? 'ewentualnie zaproszenie z kalendarza,' : 'prezentację, jeśli nie ma linku,'} i kliknij „Zapisz jako wysłany”.${(isPres && !offer().linkPrezentacja) ? ' Link do prezentacji możesz ustawić w „Zespół i ustawienia”.' : ''}</p>
    </div>
    <div class="mf"><button class="btn" data-act="modal-close">Anuluj</button><button class="btn ${mailOn() ? '' : 'primary'}" id="ml-save">${mailOn() ? 'Wysłane ręcznie – zapisz' : 'Zapisz jako wysłany'}</button>${mailOn() ? `<button class="btn primary" id="ml-send">${ICONS.email}Wyślij teraz</button>` : ''}</div>`, { wide: true });
  const refreshLink = () => { const a = $('#ml-open'); if (a) a.href = mailto().replace(encodeURIComponent(l.email || ''), encodeURIComponent($('#ml-to').value)); };
  const refreshPrev = () => { const pv = $('#ml-prev'); if (pv) pv.innerHTML = emailHtml($('#ml-body').value, l, true); };
  refreshLink(); refreshPrev();
  ['ml-to', 'ml-subj', 'ml-body'].forEach(id => { $('#' + id).oninput = () => { refreshLink(); refreshPrev(); }; });

  $('#ml-copy-subj').onclick = () => copyText($('#ml-subj').value);
  $('#ml-copy-body').onclick = () => copyText($('#ml-body').value);
  const doSave = () => {
    const cur = D().leads[l.id]; if (!cur) return closeModal();
    const by = myMemberId() || cur.ownerId || '';
    const hist = (cur.history || []).slice();
    hist.push(histEntry('email', `${again ? 'Ponownie wysłano' : 'Wysłano'}: ${t.n.toLowerCase()} – „${$('#ml-subj').value}”`, { by, result: 'Wysłano materiały' }));
    const p = { history: hist, updatedTs: new Date().toISOString() };
    const to = $('#ml-to').value.trim();
    if (to && to !== cur.email) p.email = to;
    if (isConf) { p.meetingConfirmedAt = todayISO(); }
    else if (tplKey === 'email_umowa_wglad') { p.contractPreviewAt = todayISO(); if (!cur.nextTaskDate || cur.nextTaskDate <= todayISO()) { p.nextTask = 'Telefon – pytania do umowy'; p.nextTaskDate = isoDate(addDays(new Date(), 3)); } }
    else if (isPres) { if (!cur.presentationAt) p.presentationAt = todayISO(); p.presentationSends = (cur.presentationSends || (cur.presentationAt ? 1 : 0)) + 1; p.presentationLastAt = todayISO(); }
    else { if (!cur.calcSentAt) p.calcSentAt = todayISO(); p.calcLastAt = todayISO(); }
    if (tplKey !== 'email_umowa_wglad' && !isConf && (!cur.nextTaskDate || cur.nextTaskDate <= todayISO())) { p.nextTask = isPres ? 'Telefon po prezentacji' : 'Telefon – omówić konfigurację z kalkulatora'; p.nextTaskDate = isoDate(addDays(new Date(), 3)); }
    if (cur.status === 'do_kontaktu') p.status = 'w_kontakcie';
    patch('leads', l.id, p);
    closeModal();
    toast('Zapisano wysłanie maila' + (p.nextTaskDate ? ' · kolejny kontakt ' + fdate(p.nextTaskDate) : ''));
    if (opts.chain && opts.chain.length) setTimeout(() => { const c2 = D().leads[l.id]; if (c2) openMailModal(c2, opts.chain[0], { chain: opts.chain.slice(1) }); }, 250);
  };
  $('#ml-save').onclick = doSave;
  const sendBtn = $('#ml-send');
  if (sendBtn) sendBtn.onclick = async () => {
    const to = $('#ml-to').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(to)) { toast('Wpisz poprawny adres odbiorcy.', 'bad'); return; }
    sendBtn.disabled = true; sendBtn.textContent = 'Wysyłam…';
    try {
      const atts = [];
      if (tplKey === 'email_umowa_wglad') { const hasLink = modelOf(l) === 'shippoint' ? offer().linkUmowaPartner : offer().linkUmowaFranczyza; if (!hasLink) for (const f of contractFilesFor(l)) { const a = await contractAttachment(f.id); if (a) atts.push(a); } }
      const r = await mailCall('mail_send', { to, subject: $('#ml-subj').value, html: emailHtml($('#ml-body').value, l, false), text: $('#ml-body').value, attachments: atts });
      if (r && r.rejected && r.rejected.length) throw { code: 'local', message: 'Serwer odrzucił adres: ' + r.rejected.join(', ') };
      mailRefresh(); doSave();
      toast('Wysłano e-mail do ' + to + (atts.length ? ' (z załącznikami: ' + atts.map(a => a.filename).join(', ') + ')' : ''));
    } catch (e) { toast(e && e.code === 'local' ? e.message : mailErr(e), 'bad'); sendBtn.disabled = false; sendBtn.textContent = 'Wyślij teraz'; }
  };
}

/* „Wyślij SMS do klienta” */
function openSmsCompose(l) {
  if (!l.phone) { toast('Brak numeru telefonu kandydata.', 'bad'); return; }
  const tpls = Object.entries(TEMPLATES).filter(([k, t]) => t.kind === 'SMS');
  const gw = smsGatewayOn();
  openModal(`<div class="mh"><h2>SMS do: ${esc(l.name)}</h2><button class="iconbtn" data-act="modal-close" aria-label="Zamknij">${ICONS.x}</button></div>
    <div class="mb"><div class="formgrid">
      <div class="field"><span>Numer</span><b class="mono">${esc(fmtPhone(l.phone))}</b></div>
      <label class="field span2"><span>Szablon</span><select id="sc-tpl"><option value="">— własna treść —</option>${tpls.map(([k, t]) => `<option value="${k}">${esc(t.grp + ': ' + t.n)}</option>`).join('')}</select></label>
      <label class="field full"><span>Treść</span><textarea id="sc-text" rows="5" placeholder="Dzień dobry, …"></textarea><span class="hint" id="sc-info"></span></label>

    </div>

    <div class="mf"><button class="btn" data-act="modal-close">Anuluj</button><button class="btn" id="sc-copy">${ICONS.copy}Kopiuj treść</button><button class="btn primary" id="sc-send">${ICONS.sms}${gw ? 'Wyślij SMS' : 'Dodaj do kolejki'}</button></div>`);
  const final = () => { const t = $('#sc-text').value.trim(); return $('#sc-strip').checked ? stripPL(t) : t; };
  const upd = () => { const i = smsInfo(final()); $('#sc-info').textContent = `${i.len} znaków · ${i.parts} SMS${i.gsm ? '' : ' · znaki spoza GSM'}`; };
  $('#sc-tpl').onchange = () => { const k = $('#sc-tpl').value; if (k) { $('#sc-text').value = TEMPLATES[k].f(msgContext(l, l.form)).body; upd(); } };
  $('#sc-text').oninput = upd; $('#sc-strip').onchange = upd; upd();
  $('#sc-copy').onclick = () => copyText(final());
  $('#sc-send').onclick = async () => {
    const text = final(); if (!text) { toast('Wpisz treść SMS-a.', 'bad'); return; }
    const btn = $('#sc-send'); btn.disabled = true;
    const id = uid('sms');
    put('sms', id, { leadId: l.id, leadName: l.name || '', phone: fmtPhone(l.phone), text, ownerId: l.ownerId || '', status: 'oczekuje', kind: 'reczny', createdTs: new Date().toISOString(), createdBy: myMemberId() || '' });
    const cur = D().leads[l.id];
    if (cur) { const hist = (cur.history || []).slice(); hist.push(histEntry('sms', 'SMS: ' + text, { by: myMemberId() || cur.ownerId || '' })); patch('leads', l.id, { history: hist, updatedTs: new Date().toISOString() }); }
    let ok = false;
    if (gw) ok = await deliverSms(id);
    closeModal();
    toast(gw ? (ok ? 'Wysłano SMS do ' + fmtPhone(l.phone) : 'Nie udało się wysłać SMS-a – szczegóły w karcie leada') : 'SMS dodany do kolejki – wyślij go z „Kontaktów”');
  };
}

function msgContext(l, form) {

  btn.disabled = true; const label = btn.innerHTML; btn.innerHTML = 'Claude pisze…';

  scheduleRender();
}

}

/* zwykły tekst wiadomości → HTML (akapity, listy, linki) + stopka */
function emailHtml(text, l, preview = false) {
  let body = String(text || '').replace(/\r/g, '');
  let closing = 'Pozdrawiam';
  const cut = body.search(/\n\s*\n(Pozdrawiam|Z pozdrowieniami|Pozdrawiamy)[^\n]*\n[\s\S]*$/);
  if (cut >= 0) { closing = body.slice(cut).trim().split('\n')[0].trim(); body = body.slice(0, cut); }
  const blocks = body.split(/\n\s*\n/);
  const P = `margin:0 0 14px 0;${A}font-size:14px;line-height:22px;color:#111827;`;
  const html = blocks.map(b => {
    const lines = b.split('\n').filter(x => x.trim() !== '');
    if (!lines.length) return '';
    const out = []; let list = null, listType = '';
    const flush = () => { if (list) { out.push(`<${listType} style="margin:0 0 14px 0;padding-left:22px;${A}font-size:14px;line-height:22px;color:#111827;">${list.join('')}</${listType}>`); list = null; } };
    const para = [];
    const flushPara = () => { if (para.length) { out.push(`<p style="${P}">${para.join('<br>')}</p>`); para.length = 0; } };
    lines.forEach(ln => {
      const bullet = ln.match(/^\s*[•\-–]\s+(.*)$/), num = ln.match(/^\s*\d+[.)]\s+(.*)$/);
      if (bullet || num) {
        flushPara();
        const t = bullet ? 'ul' : 'ol';
        if (!list || listType !== t) { flush(); list = []; listType = t; }
        list.push(`<li style="margin:0 0 4px 0;">${linkify(esc((bullet || num)[1]))}</li>`);
      } else { flush(); para.push(linkify(esc(ln))); }
    });
    flushPara(); flush();
    return out.join('');
  }).join('');
  return `<div style="${A}font-size:14px;line-height:22px;color:#111827;max-width:600px;">${html}<p style="${P}margin-bottom:18px;">${esc(closing)}</p>${signatureHtml(senderOf(l), preview)}</div>`;
}

/* kopiowanie jako sformatowany e-mail (HTML + zwykły tekst) */
async function copyEmailHtml(html, plain) {
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([plain], { type: 'text/plain' }) })]);
      toast('Skopiowano e-mail z formatowaniem – wklej go w nowej wiadomości (Ctrl+V)');
      return;
    }
    throw new Error('no ClipboardItem');
  } catch (e) {
    const box = document.createElement('div');
    box.contentEditable = 'true';
    box.style.cssText = 'position:fixed;left:-10000px;top:0;width:640px;background:#fff';
    box.innerHTML = html;
    document.body.appendChild(box);
    const range = document.createRange(); range.selectNodeContents(box);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    sel.removeAllRanges(); box.remove();
    if (ok) toast('Skopiowano e-mail z formatowaniem – wklej go w nowej wiadomości (Ctrl+V)');
    else copyText(plain);
  }
}

const regSleep = ms => new Promise(r => setTimeout(r, ms));
const REG_FATAL = ['server_not_connected', 'not_granted', 'capability_disabled', 'capability_removed', 'not_in_manifest', 'cancelled', 'approval_required', 'blocked_by_policy'];

function mcpText(res) {
  if (!res) return '';
  if (typeof res.payload === 'string') return res.payload;
  const blocks = (res.content || []).filter(b => b && b.type === 'text' && typeof b.text === 'string').map(b => b.text);
  if (blocks.length) return blocks.join('\n');
  if (res.payload != null) { try { return JSON.stringify(res.payload); } catch (e) { } }
  return '';
}
function mcpTabId(res) {
  const p = res && (res.structuredContent || res.payload);
  if (p && typeof p === 'object') { const v = p.tabId ?? p.tab_id ?? (p.tab && p.tab.id); if (v != null) return v; }
  const m = mcpText(res).match(/tab\s*_?id["'\s:=]*["']?([A-Za-z0-9-]+)/i);
  return m ? (/^\d+$/.test(m[1]) ? +m[1] : m[1]) : null;
}
async function browserOpen(url) {
  if (REG.tabId != null) {
    try { await S.mcp.callTool(BROWSER, 'navigate', { url, tabId: REG.tabId }, { cache: false }); return; }
    catch (e) { if (REG_FATAL.includes(e && e.code)) throw e; REG.tabId = null; }
  }
  const r = await S.mcp.callTool(BROWSER, 'preview_start', { url }, { cache: false });
  REG.tabId = mcpTabId(r);
}
async function browserText(url, { until, timeout = 15000 } = {}) {
  await browserOpen(url);
  const t0 = Date.now();
  await regSleep(900);
  for (;;) {
    const r = await S.mcp.callTool(BROWSER, 'get_page_text', REG.tabId != null ? { tabId: REG.tabId } : {}, { cache: false });
    const text = mcpText(r);
    if (!until || until(text) || Date.now() - t0 > timeout) return text;
    await regSleep(1500);
  }
}

/* KRS: pełniejszy odczyt odpisu (adres, e-mail, www, zarząd) */
function krsDetails(od) {
  const d1 = (od.dane || {}).dzial1 || {}, d2 = (od.dane || {}).dzial2 || {};
  const sa = d1.siedzibaIAdres || {};
  const rep = (d2.reprezentacja || {}).sklad || [];
  const people = rep.map(p => {
    const im = p.imiona || {}, nz = p.nazwisko || {};
    const name = [im.imie, im.imieDrugie, nz.nazwiskoICzlon, nz.nazwiskoIICzlon].filter(Boolean).join(' ');
    return name ? name + (p.funkcjaWOrganie ? ' – ' + p.funkcjaWOrganie : '') : '';
  }).filter(x => x && !/\*{3}/.test(x));
  const cap = (d1.kapital || {}).wysokoscKapitaluZakladowego;
  return {
    email: String(sa.adresPocztyElektronicznej || '').toLowerCase(),
    www: sa.adresStronyInternetowej || '',
    representatives: people,
    capital: cap ? [cap.wartosc, cap.waluta].filter(Boolean).join(' ') : ''
  };
}

/* łączenie danych z kilku rejestrów (pierwsze niepuste wygrywa) */
function mergeCompany(...parts) {
  const list = parts.filter(Boolean);
  if (!list.length) return null;
  const out = {};
  list.forEach(p => Object.entries(p).forEach(([k, v]) => {
    if (k === 'source') return;
    if (out[k] == null || out[k] === '' || (Array.isArray(out[k]) && !out[k].length)) out[k] = v;
  }));
  out.source = [...new Set(list.map(p => p.source).filter(Boolean))].join(' + ');
  out.at = todayISO();
  return out;
}

async function registryLookup(nip, onStep = () => { }) {
  const d = nipDigits(nip);
  if (REG.cache[d]) return REG.cache[d];
  let wl = null, krs = null, ceidg = null;
  onStep('Biała lista VAT');
  try {
    const t = await browserText(`https://wl-api.mf.gov.pl/api/search/nip/${d}?date=${todayISO()}`, { until: x => /"result"|"code"|"message"/.test(x) });
    wl = parseWhiteList(t);
  } catch (e) { if (REG_FATAL.includes(e && e.code)) throw e; }
  if (wl && wl.krs) {
    onStep('KRS');
    for (const rej of ['P', 'S']) {
      try {
        const t = await browserText(`https://api-krs.ms.gov.pl/api/krs/OdpisAktualny/${wl.krs}?rejestr=${rej}&format=json`, { until: x => /"odpis"|"kod"|"error"|"status"/i.test(x) });
        krs = parseWhiteList(t);
      } catch (e) { if (REG_FATAL.includes(e && e.code)) throw e; }
      if (krs) break;
    }
  }
  if (!krs && (!wl || !wl.form)) {
    onStep('CEIDG / biznes.gov.pl');
    try {
      const t = await browserText(`https://www.biznes.gov.pl/pl/wyszukiwarka-firm/?searchType=advanced&nip=${d}`,
        { until: x => x.includes(d) || /nie znaleziono|brak wynik/i.test(x), timeout: 20000 });
      if (t && t.includes(d)) ceidg = await extractCompanyWithClaude(t);
    } catch (e) { if (REG_FATAL.includes(e && e.code)) throw e; }
  }
  const c = mergeCompany(krs, wl, ceidg);
  if (c && !c.nip) c.nip = d;
  if (c) REG.cache[d] = c;
  return c;
}

function regErrMsg(e) {
  const code = e && e.code;
  if (code === 'server_not_connected' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed')
    return 'Automatyczne pobieranie działa, gdy panel jest otwarty w aplikacji Claude na komputerze. Tutaj użyj „Dane firmy z rejestru” w karcie kandydata.';
  if (code === 'not_in_manifest' || code === 'approval_required' || code === 'cancelled')
    return 'Brak zgody na użycie przeglądarki Claude. Zezwól w oknie, które się pojawi (albo w uprawnieniach panelu) i wpisz NIP ponownie.';
  if (code === 'tool_error') return 'Przeglądarka nie otworzyła rejestru: ' + String(e.message || '').slice(0, 140);
  return 'Nie udało się pobrać danych z rejestrów' + (code ? ' (' + code + ')' : '') + '.';
}

/* wpisuje dane z rejestru w puste pola formularza */
function fillFromCompany(prefix, c) {
  const set = (id, v) => { const el = $('#' + prefix + '-' + id); if (el && v && !el.value.trim()) { el.value = v; el.classList.add('autofilled'); } };
  set('company', c.name);
  set('phone', c.phone);
  set('email', c.email);
  set('name', c.owner);
  const box = $('#' + prefix + '-companybox');
  if (box) box.innerHTML = companyKv(c);
}
function companyKv(c) {
  if (!c) return '';
  const row = (k, v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : '';
  return `<dl class="kv">${row('Nazwa', esc(c.name || ''))}${row('Adres', esc(c.address || ''))}${row('NIP', esc(nipFmt(c.nip || '')))}${row('REGON', esc(c.regon || ''))}${row('KRS', esc(c.krs || ''))}${row('Forma', esc(c.form || ''))}
    ${c.statusVat ? `<dt>Status VAT</dt><dd><span class="pill ${c.statusVat === 'Czynny' ? 'good' : 'warn'}">${esc(c.statusVat)}</span></dd>` : ''}${row('Status', esc(c.status || ''))}${row('Od', esc(c.startDate || c.registrationLegalDate || ''))}${row('PKD', esc(c.pkd || ''))}
    ${row('Telefon', esc(c.phone || ''))}${row('E-mail', esc(c.email || ''))}${row('WWW', esc(c.www || ''))}${row('Kapitał', esc(c.capital || ''))}
    ${c.representatives && c.representatives.length ? `<dt>Reprezentacja</dt><dd>${c.representatives.map(esc).join('<br>')}</dd>` : ''}
    ${row('Źródło', esc((c.source || '') + (c.at ? ' · ' + fdate(c.at) : '')))}</dl>`;
}

/* zapis danych firmy w istniejącym leadzie */
function applyCompanyToLead(id, c) {
  const cur = D().leads[id]; if (!cur || !c) return;
  const p = { companyData: c, updatedTs: new Date().toISOString() };
  if (!cur.company && c.name) p.company = c.name;
  if (!cur.phone && c.phone) p.phone = c.phone;
  if (!cur.email && c.email) p.email = c.email;
  const hist = (cur.history || []).slice(); hist.push(histEntry('system', 'Pobrano dane firmy (' + c.source + '): ' + c.name)); p.history = hist;
  patch('leads', id, p);
}

/* reakcja na wpisanie NIP-u (formularz nowego leada „lf” albo karta kandydata „le”) */
async function autoNip(prefix, leadId, force = false) {
  const inp = $('#' + prefix + '-nip'); if (!inp) return;
  const d = nipDigits(inp.value);
  const st = $('#' + prefix + '-nip-st');
  const say = (t, cls = '') => { const el = $('#' + prefix + '-nip-st'); if (el) { el.className = 'hint ' + cls; el.textContent = t; } };
  if (d.length !== 10) { if (st) say(''); return; }
  if (!nipValid(d)) { say('Błędny NIP – sprawdź cyfry', 'overdue'); return; }
  if (leadId && !force) { const l = D().leads[leadId]; if (l && l.companyData && nipDigits(l.companyData.nip) === d) { say('NIP poprawny · dane firmy pobrane'); return; } }
  if (!S.mcp) { say('NIP poprawny. Dane firmy pobiorą się same, gdy panel jest otwarty w aplikacji Claude na komputerze.'); return; }
  if (REG.busy[d]) return;
  REG.busy[d] = true;
  say('Pobieram dane firmy z rejestrów…');
  try {
    const c = await registryLookup(d, s => say('Pobieram dane firmy: ' + s + '…'));
    if (nipDigits(($('#' + prefix + '-nip') || {}).value) !== d) return;
    if (!c) { say('Nie znaleziono firmy z tym NIP-em w rejestrach (może to nowa działalność).', 'warn'); return; }
    REG.pending[prefix] = c;
    if (leadId) applyCompanyToLead(leadId, c);
    else fillFromCompany(prefix, c);
    say('Uzupełniono z rejestru: ' + c.name, 'good');
  } catch (e) {
    REG.lastErr = regErrMsg(e);
    say(REG.lastErr, 'overdue');
  } finally { REG.busy[d] = false; }
}

/* ===== Poczta: korespondencja z kandydatami, wysyłka ze stopką HTML, import zgłoszeń =====
   Wszystko idzie przez konektor „ShipCenter Poczta” (mostek pocztowy na serwerze ShipCenter,
   panel/mail-bridge). Bez konektora panel działa jak dotąd: e-mail można skopiować z formatowaniem. */

const MAIL_SERVER = 'ShipCenter Poczta';
const MAIL = { avail: null, checking: false, err: '', cache: {}, loading: {}, syncing: false, syncMsg: '', timer: null, filter: 'all' };

async function mailInit() {
  if (!S.mcp || MAIL.checking || MAIL.avail !== null) return;
  MAIL.checking = true;
  try {
    const r = await S.mcp.listTools(MAIL_SERVER);
    const sv = (r.servers || []).find(s => s.server === MAIL_SERVER);
    MAIL.avail = !!(sv && (sv.tools || []).length);
  } catch (e) { MAIL.avail = false; MAIL.err = (e && e.code) || ''; }
  MAIL.checking = false; scheduleRender();
  if (MAIL.avail) {
    mailCall('mail_status', {}).then(st => { MAIL.status = st; MAIL.sms = !!(st && st.sms && st.sms.configured); scheduleRender(); }).catch(() => { });
    setTimeout(() => syncInquiries(false), 1500);
    MAIL.timer = setInterval(() => { if (!document.hidden) syncInquiries(false); }, 5 * 60000);
  }
}
const mailOn = () => MAIL.avail === true;

async function mailCall(tool, input) {
  const r = await S.mcp.callTool(MAIL_SERVER, tool, input || {}, { cache: false });
  let p = r && r.payload;
  if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { } }
  return p;
}
function mailErr(e) {
  const c = e && e.code;
  if (c === 'server_not_connected' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') return 'Poczta nie jest podłączona – brak konektora „ShipCenter Poczta” w claude.ai.';
  if (c === 'not_in_manifest' || c === 'approval_required') return 'Brak zgody na użycie poczty przez panel – zezwól w okienku claude.ai i spróbuj ponownie.';
  if (c === 'needs_reauth') return 'Połącz ponownie konektor „ShipCenter Poczta” w ustawieniach claude.ai.';
  if (c === 'tool_error') return 'Serwer poczty: ' + String((e && e.message) || '').slice(0, 220);
  if (c === 'server_unavailable') return 'Serwer poczty chwilowo nie odpowiada – spróbuj za chwilę.';
  return 'Błąd poczty' + (c ? ' (' + c + ')' : '') + (e && e.message ? ': ' + String(e.message).slice(0, 160) : '');
}

const leadByEmail = email => { const e = String(email || '').toLowerCase().trim(); return e ? leadsArr().find(l => (l.email || '').toLowerCase().trim() === e) : null; };
const mailPeer = m => (m.folder === 'Sent' ? (m.to || [])[0] : (m.from || [])[0]) || { name: '', address: '' };
function hashStr(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }

/* ---------- lista wiadomości (cache per adres) ---------- */
function mailListFor(key) {
  const c = MAIL.cache[key];
  if (!mailOn()) return null;
  if (!c && !MAIL.loading[key]) loadMailList(key);
  return c || null;
}
async function loadMailList(key) {
  MAIL.loading[key] = true; scheduleRender();
  try {
    const address = key.startsWith('addr:') ? key.slice(5) : '';
    const r = await mailCall('mail_list', { address, folder: 'all', limit: address ? 50 : 60 });
    MAIL.cache[key] = { items: (r && r.items) || [], at: new Date().toISOString() };
  } catch (e) { MAIL.cache[key] = { items: [], err: mailErr(e), at: new Date().toISOString() }; }
  MAIL.loading[key] = false; scheduleRender();
}
function mailRefresh(key) { if (key) delete MAIL.cache[key]; else MAIL.cache = {}; scheduleRender(); }

function mailRows(items, { showLead = true } = {}) {
  if (!items.length) return '<p class="muted small">Brak wiadomości.</p>';
  return items.map(m => {
    const peer = mailPeer(m); const l = leadByEmail(peer.address);
    const out = m.folder === 'Sent';
    return `<div class="contact-row mailrow ${!out && !m.seen ? 'unread' : ''}" data-act="mail-open" data-folder="${m.folder}" data-uid="${m.uid}" data-lead="${l ? l.id : ''}" style="cursor:pointer">
      <span class="when">${fdateShort(m.date)}</span>
      <div style="min-width:0"><span class="pill ${out ? '' : 'good'}">${out ? '→ wysłana' : '← odebrana'}</span> <b>${esc(peer.name || peer.address || '—')}</b>${showLead && l ? ` <a href="#lead-${l.id}" class="tiny">${esc(l.name)}</a>` : ''}
        <div class="small ink2" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.hasAttachments ? '📎 ' : ''}${esc(m.subject || '(bez tematu)')}</div></div>
      <div class="tiny muted">${new Date(m.date).toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' })}</div></div>`;
  }).join('');
}

/* ---------- widok „Poczta” (#poczta, #poczta-<idLeada>) ---------- */
function viewMail(leadId) {
  const l = leadId ? D().leads[leadId] : null;
  const key = l && l.email ? 'addr:' + l.email.toLowerCase().trim() : 'all';
  const st = settings().mailSync || {};
  const head = `<div class="viewhead"><div class="grow"><span class="eyebrow">Skrzynka franczyza@shipcenter.pl</span><h1>${l ? 'Korespondencja: ' + esc(l.name) : 'Poczta'}</h1>
    <p>${l ? (l.email ? esc(l.email) + ' · <a href="#lead-' + l.id + '">karta leada</a> · <a href="#poczta">cała skrzynka</a>' : 'Kandydat nie ma adresu e-mail – uzupełnij go w karcie leada.') : `Wysyłka ze stopką firmową, kopie w „Wysłanych”. ${st.at ? 'Zgłoszenia z formularzy sprawdzone ' + fdt(st.at.slice(0, 16)) + '.' : ''}`}</p></div>
    <div class="actions">${mailOn() ? `<button class="btn" data-act="mail-refresh" data-key="${esc(key)}">Odśwież</button>${l ? '' : `<button class="btn" data-act="mail-sync" ${MAIL.syncing ? 'disabled' : ''}>${MAIL.syncing ? 'Sprawdzam…' : 'Pobierz zgłoszenia'}</button>`}` : ''}
    <button class="btn primary" data-act="mail-compose" data-id="${l ? l.id : ''}">${ICONS.email}${l ? 'Napisz do klienta' : 'Nowa wiadomość'}</button></div></div>`;
  if (!mailOn()) {
    return head + `<div class="card"><div class="cardhead"><h2>Poczta nie jest jeszcze podłączona</h2><p>${MAIL.checking ? 'sprawdzam…' : ''}</p></div>
      <div class="stack" style="gap:8px">
      <p class="small">Żeby czytać i wysyłać maile z franczyza@shipcenter.pl bezpośrednio w panelu, na serwerze ShipCenter musi działać mostek pocztowy (instrukcja dla programisty: <span class="mono">panel/mail-bridge/README.md</span> w repozytorium), a w claude.ai trzeba dodać konektor o nazwie <b>„${MAIL_SERVER}”</b>.</p>
      <p class="small">Do tego czasu „Nowa wiadomość” i „Napisz do klienta” przygotują e-mail ze stopką – skopiujesz go z formatowaniem do Thunderbirda.</p>
      <p class="tiny muted">Działa tylko w aplikacji / stronie claude.ai, w której konektor jest podłączony.</p></div></div>`;
  }
  const c = mailListFor(key);
  let items = c ? c.items : [];
  if (!l && MAIL.filter === 'leads') items = items.filter(m => leadByEmail(mailPeer(m).address));
  if (!l && MAIL.filter === 'in') items = items.filter(m => m.folder === 'INBOX');
  if (!l && MAIL.filter === 'out') items = items.filter(m => m.folder === 'Sent');
  const filters = l ? '' : `<div class="row" style="margin-bottom:10px">${[['all', 'Wszystkie'], ['in', 'Odebrane'], ['out', 'Wysłane'], ['leads', 'Tylko kandydaci']].map(([k, n]) => `<button class="btn sm ${MAIL.filter === k ? 'primary' : 'ghost'}" data-act="mail-filter" data-k="${k}">${n}</button>`).join('')}</div>`;
  return head + `${MAIL.syncMsg ? `<p class="note" style="margin-bottom:10px">${esc(MAIL.syncMsg)}</p>` : ''}<div class="card">${filters}
    ${!c ? '<p class="muted small">Wczytuję wiadomości…</p>' : c.err ? `<p class="note overdue">${esc(c.err)}</p>` : mailRows(items, { showLead: !l })}</div>`;
}

/* karta „Korespondencja e-mail” w widoku leada */
function leadMailCard(l) {
  const btns = `<button class="btn sm" data-act="mail-compose" data-id="${l.id}">${ICONS.email}Napisz e-mail</button><a class="btn sm" href="#poczta-${l.id}">${ICONS.inbox}Koresponduj z klientem</a>`;
  if (!mailOn()) return `<div class="card"><div class="cardhead"><h2>Korespondencja e-mail</h2><p>${l.email ? esc(l.email) : 'brak e-maila'}</p></div><div class="row">${btns}</div><p class="tiny muted" style="margin-top:8px">Po podłączeniu poczty zobaczysz tu maile od kandydata i odpowiesz prosto z panelu.</p></div>`;
  if (!l.email) return `<div class="card"><div class="cardhead"><h2>Korespondencja e-mail</h2></div><p class="note">Uzupełnij adres e-mail kandydata, żeby zobaczyć korespondencję.</p></div>`;
  const c = mailListFor('addr:' + l.email.toLowerCase().trim());

    ${!c ? '<p class="muted small">Wczytuję…</p>' : c.err ? `<p class="note overdue">${esc(c.err)}</p>` : mailRows(c.items.slice(0, 5), { showLead: false })}
    <div class="row" style="margin-top:10px">${btns}</div></div>`;
}

/* ---------- czytanie wiadomości ---------- */
async function openMailReader(folder, uid) {
  openModal(`<div class="mh"><h2>Wiadomość</h2><button class="iconbtn" data-act="modal-close" aria-label="Zamknij">${ICONS.x}</button></div><div class="mb"><p class="muted">Wczytuję…</p></div>`, { wide: true });
  let m;
  try { m = await mailCall('mail_get', { folder, uid: +uid }); } catch (e) { $('#modal .mb').innerHTML = `<p class="note overdue">${esc(mailErr(e))}</p>`; return; }
  const peer = folder === 'Sent' ? (m.to || [])[0] : ((m.replyTo || [])[0] || (m.from || [])[0]);
  const l = leadByEmail(peer && peer.address);
  const who = a => (a || []).map(x => x.name ? `${esc(x.name)} &lt;${esc(x.address)}&gt;` : esc(x.address)).join(', ');
  openModal(`<div class="mh"><h2>${esc(m.subject || '(bez tematu)')}</h2><button class="iconbtn" data-act="modal-close" aria-label="Zamknij">${ICONS.x}</button></div>
    <div class="mb">
      <dl class="kv"><dt>Od</dt><dd>${who(m.from)}</dd><dt>Do</dt><dd>${who(m.to)}</dd>${(m.cc || []).length ? `<dt>DW</dt><dd>${who(m.cc)}</dd>` : ''}<dt>Data</dt><dd>${fdt(m.date.slice(0, 16))}</dd>${l ? `<dt>Kandydat</dt><dd><a href="#lead-${l.id}" data-act="modal-close">${esc(l.name)}</a></dd>` : ''}</dl>
      ${(m.attachments || []).length ? `<div class="row" style="margin:10px 0">${m.attachments.map(a => `<button class="btn sm" data-act="mail-att" data-folder="${folder}" data-uid="${m.uid}" data-i="${a.index}">📎 ${esc(a.filename)} <span class="tiny muted">${Math.max(1, Math.round(a.size / 1024))} kB</span></button>`).join('')}</div>` : ''}
      <div id="mr-text" style="white-space:pre-wrap;font-size:.92rem;line-height:1.55;border-top:1px solid var(--line);padding-top:12px;margin-top:10px;max-height:52vh;overflow:auto">${linkifyText(m.text || '')}</div>
      ${m.html ? `<details class="adv" style="margin-top:10px"><summary>Pokaż oryginalny wygląd (HTML)</summary><iframe sandbox="" referrerpolicy="no-referrer" style="width:100%;height:60vh;border:1px solid var(--line);border-radius:8px;background:#fff" srcdoc="${esc(m.html)}"></iframe></details>` : ''}

const toB64 = buf => { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };

async function syncInquiries(manual) {
  if (!mailOn() || MAIL.syncing || S.demo) return;
  if (isLoading() || S.mode !== 'live') { setTimeout(() => syncInquiries(manual), 4000); return; }
  MAIL.syncing = true; scheduleRender();
  try {
    const st = settings().mailSync || {};
    let r = await mailCall('inquiries_fetch', { since_uid: st.lastUid || 0, days: st.lastUid ? 60 : 7 });
    if (st.uidValidity && r.uidValidity && r.uidValidity !== st.uidValidity) r = await mailCall('inquiries_fetch', { since_uid: 0, days: 14 });
    const now = new Date().toISOString();
    let created = 0, merged = 0;
    for (const it of (r.items || [])) {
      const id = 'm' + hashStr(it.messageId || ('uid' + it.uid + it.date));
      if (D().leads[id]) continue;
      const dup = findDuplicate({ email: it.email, phone: it.phone });
      if (dup) {
        if (!(dup.inquiryIds || []).includes(id)) {
          const hist = (dup.history || []).slice();
          hist.push(histEntry('system', `Ponowne zgłoszenie z formularza (${modelName(it.kind)}) – ${fdate((it.date || now).slice(0, 10))}`));
          patch('leads', dup.id, { history: hist, inquiryIds: [...(dup.inquiryIds || []), id], updatedTs: now });
          merged++;
        }
        continue;
      }
      const day = (it.date || now).slice(0, 10);
      const lead = newLead({ ownerId: team().length === 1 ? team()[0].id : '', name: it.name || it.email || 'Zgłoszenie z formularza', phone: fmtPhone(it.phone || ''), email: it.email || '', city: it.city || '', model: it.kind, source: 'www', notes: it.note || '', nextTask: 'Pierwsza rozmowa telefoniczna', nextTaskDate: todayISO() });
      Object.assign(lead, { id, createdAt: day, createdTs: it.date || now, sourceMsgId: it.messageId || '', inquiryIds: [id], autoPresentationAt: it.autoPresentation ? day : '' });
      lead.history = [histEntry('system', `Zgłoszenie z formularza shipcenter.pl (${modelName(it.kind)}) – pobrane automatycznie z poczty${it.autoPresentation ? '; formularz wysłał kandydatowi prezentację' : ''}`)];
      put('leads', id, lead);
      created++;
    }
    saveSettings({ mailSync: { lastUid: r.lastUid || st.lastUid || 0, uidValidity: r.uidValidity || '', at: now } });
    MAIL.syncMsg = '';
    if (created || merged) toast(`Poczta: ${created ? 'nowe zgłoszenia ' + created : ''}${created && merged ? ', ' : ''}${merged ? 'ponowne ' + merged : ''}`);
    else if (manual) toast('Brak nowych zgłoszeń');
  } catch (e) {
    MAIL.syncMsg = 'Import zgłoszeń: ' + mailErr(e);
    if (manual) toast(MAIL.syncMsg, 'bad');
  }
  MAIL.syncing = false; scheduleRender();
}

/* ===== Analiza lokalizacji: popyt, przepustowość, konkurencja, rachunek, raport ===== */

const LOC_TYPES = {
  ulica: { n: 'Ulica handlowa / centrum', ind: 1.15, biz: 1.0 },
  osiedle: { n: 'Osiedle mieszkaniowe', ind: 1.0, biz: 0.8 },

  biznes: { n: 'Strefa biznesowa / przemysłowa', ind: 0.75, biz: 1.45 },
  wezel: { n: 'Dworzec / węzeł komunikacyjny', ind: 1.1, biz: 0.9 }
};
const COMP_TYPES = {
  epaka: { n: 'Punkt Epaka.pl', w: 1.0 },
  pakersi: { n: 'Punkt Pakersi', w: 1.0 },
  sc: { n: 'Inny punkt ShipCenter', w: 1.2 },
  // dawne typy – nie są liczone jako konkurencja
  multi: { n: 'Inny punkt (nie liczony)', w: 0, legacy: true }, poczta: { n: 'Poczta (nie liczona)', w: 0, legacy: true }, kurier: { n: 'Oddział kuriera (nie liczony)', w: 0, legacy: true },
  pudo: { n: 'Punkt odbioru (nie liczony)', w: 0, legacy: true }, paczkopunkt: { n: 'PaczkoPunkt (nie liczony)', w: 0, legacy: true }, automat: { n: 'Paczkomat (nie liczony)', w: 0, legacy: true }
};
const LOC_DEFAULTS = {
  name: '', leadId: '', address: '', city: '', region: '', cityPop: 60000, catchment: 12000, type: 'ulica', traffic: 2000, visibility: 3, parking: 'ograniczony',
  firms: 40, area: 30, storage: 8, rent: 2500, media: 450, stations: 1, staff: 0, ownerWorks: true, staffCost: 0, hours: 9, days: 5,
  competitors: [],
  rev: { parcels: null, pickups: 300, stamps: 30, print: 20, packing: 80 },
  a: { indivRate: 0.25, capture: 0.06, bizShare: 0.15, bizAvg: 60, minPerParcel: 4, storagePerM2: 20, fitout: 3000, other: 400,
    pParcel: 25, pPickup: 1.2, pStamp: 47, pPrint: 120, pPacking: 25, mParcel: 36, mPickup: 90, mStamp: 50, mPrint: 40, mPacking: 50 }
};
/* Przychód jak w kalkulatorze shipcenter.pl/franczyza/prezentacja: liczba × średnia cena */
const REV_ITEMS = [
  { k: 'parcels', n: 'Przesyłki', d: 'Krajowe, zagraniczne i paletowe', p: 'pParcel', m: 'mParcel', max: 3000, step: 10 },
  { k: 'pickups', n: 'Wydania paczek', d: 'Paczki odbierane przez klientów w punkcie', p: 'pPickup', m: 'mPickup', max: 1000, step: 10 },
  { k: 'stamps', n: 'Pieczątki', d: 'Liczba sprzedanych pieczątek', p: 'pStamp', m: 'mStamp', max: 100, step: 1 },
  { k: 'print', n: 'Poligrafia', d: 'Liczba zamówień poligraficznych', p: 'pPrint', m: 'mPrint', max: 120, step: 1 },
  { k: 'packing', n: 'Pakowanie i materiały', d: 'Liczba usług lub zakupów materiałów', p: 'pPacking', m: 'mPacking', max: 300, step: 1 }
];
const COMP_CAP = { automat: 1.0, pudo: 1.0, paczkopunkt: 0.6, poczta: 1.2, kurier: 0.8 };
const decay = d => d <= 300 ? 1 : d <= 800 ? 0.7 : d <= 1500 ? 0.45 : d <= 3000 ? 0.2 : 0;

function analyzeLocation(x) {
  const L = { ...LOC_DEFAULTS, ...x, a: { ...LOC_DEFAULTS.a, ...(x.a || {}) }, rev: { ...LOC_DEFAULTS.rev, ...(x.rev || {}) } };
  const a = L.a;
  const o = offer();
  const lt = LOC_TYPES[L.type] || LOC_TYPES.ulica;
  const pop = +L.catchment > 0 ? +L.catchment : (+L.cityPop || 0) * 0.15;
  const trafficF = 0.75 + 0.25 * Math.min(2, (+L.traffic || 0) / 2000);
  const visF = 0.85 + 0.075 * ((+L.visibility || 3) - 1);
  const parkF = ({ brak: 0.9, ograniczony: 1.0, dobry: 1.1 })[L.parking] || 1;
  const comps = (L.competitors || []).filter(c => c && (+c.dist >= 0));
  let scConflict = null;
  const byType = {};
  const compRows = comps.map(c => {
    const t = COMP_TYPES[c.type] || COMP_TYPES.multi;
    const contrib = t.w * decay(+c.dist || 0) * ((+c.strength || 3) / 3);
    byType[c.type] = (byType[c.type] || 0) + contrib;
    if (c.type === 'sc' && +c.dist < o.ochrona * 1000) scConflict = c;
    return { ...c, tn: t.n, contrib };
  });
  const ci = Object.entries(byType).reduce((s2, [k, v]) => s2 + (COMP_CAP[k] != null ? Math.min(COMP_CAP[k], v) : v), 0);
  const compF = 1 / (1 + 0.4 * ci);
  const indiv = pop * a.indivRate * a.capture * lt.ind * trafficF * visF * compF;
  const biz = (+L.firms || 0) * a.bizShare * a.bizAvg * lt.biz * parkF * Math.sqrt(compF);
  const base = indiv + biz;
  const demand = { indiv, biz, base, low: base * 0.7, high: base * 1.3, peak: base * 1.35 };
  // przepustowość
  const daysM = (+L.days || 5) * 4.33;
  const people = Math.max(1, Math.min(+L.stations || 1, (+L.staff || 0) + (L.ownerWorks ? 1 : 0) || 1));
  const perHour = 60 / Math.max(1, a.minPerParcel) * 0.7;
  const serviceCap = people * (+L.hours || 8) * daysM * perHour;
  const storageCap = (+L.storage || 0) * a.storagePerM2 * daysM;
  const capacity = Math.max(1, storageCap > 0 ? Math.min(serviceCap, storageCap) : serviceCap);
  const P = L.rev.parcels != null && L.rev.parcels !== '' ? Math.max(0, +L.rev.parcels) : Math.round(base);
  const pickupLoad = (+L.rev.pickups || 0) * 0.4;
  const util = (P + pickupLoad) / capacity;
  const utilPeak = (P * 1.35 + pickupLoad) / capacity;
  const bottleneck = storageCap > 0 && storageCap < serviceCap ? 'zaplecze (miejsce na paczki)' : 'obsługa przy ladzie';
  // rachunek: przychód jak w kalkulatorze ShipCenter, koszt usług wg marż z założeń
  const scen = mult => {
    const lines = REV_ITEMS.map(it => { const n = (it.k === 'parcels' ? P : (+L.rev[it.k] || 0)) * mult; const rev = n * (+a[it.p] || 0); return { k: it.k, n: it.n, count: n, revenue: rev, cogs: rev * (1 - clamp((+a[it.m] || 0) / 100, 0, 1)) }; });
    const parcels = lines[0].count;
    const revenue = sum(lines, l => l.revenue), cogs = sum(lines, l => l.cogs);
    const fee = parcels >= o.progRabatu ? 0 : o.oplataMies;
    const p24 = lines[0].revenue * o.prowizjaP24 / 100;
    const staff = (+L.staff || 0) * (+L.staffCost || 0);
    const fixed = (+L.rent || 0) + (+L.media || 0) + staff + fee + p24 + (+a.other || 0);
    return { parcels, lines, revenue, cogs, fee, p24, staff, fixed, costs: cogs + fixed, margin: revenue - cogs, profit: revenue - cogs - fixed };
  };
  const fin = { low: scen(0.7), base: scen(1), high: scen(1.3) };
  const startup = o.licencja + (+a.fitout || 0);
  const payback = fin.base.profit > 0 ? startup / fin.base.profit : null;
  const fixedNoFee = (+L.rent || 0) + (+L.media || 0) + (+L.staff || 0) * (+L.staffCost || 0) + (+a.other || 0) + o.oplataMies;
  const extrasMargin = sum(fin.base.lines.slice(1), l => l.revenue - l.cogs);
  const unit = (+a.pParcel || 0) * ((+a.mParcel || 0) / 100) - (+a.pParcel || 0) * o.prowizjaP24 / 100;
  const breakEven = unit > 0 ? Math.max(0, (fixedNoFee - extrasMargin) / unit) : null;
  // ocena
  const sDemand = clamp(P / 800 * 100, 0, 100);
  const sComp = clamp(compF * 100, 0, 100);
  const siteProd = (lt.ind * 0.6 + lt.biz * 0.4) * trafficF * visF * parkF;
  const sSite = clamp((siteProd - 0.7) / 0.7 * 100, 0, 100);
  const sEcon = clamp(50 + fin.base.profit / (fin.base.profit >= 0 ? 50 : 40), 0, 100);
  const sCap = util <= 0.85 && util >= 0.35 ? 100 : util > 0.85 ? clamp(100 - (util - 0.85) * 200, 0, 100) : clamp(40 + util / 0.35 * 60, 0, 100);
  let score = Math.round(0.3 * sDemand + 0.2 * sComp + 0.2 * sSite + 0.2 * sEcon + 0.1 * sCap);
  const flags = [];
  if (scConflict) { flags.push({ k: 'bad', t: `W odległości ${fmt(+scConflict.dist)} m działa już punkt ShipCenter${scConflict.name ? ' (' + scConflict.name + (scConflict.address ? ', ' + scConflict.address : '') + ')' : ''}. Sieć zakłada ochronę ${o.ochrona} km między punktami (OWU § 6 ust. 4) – lokalizacja wymaga decyzji centrali.` }); score = Math.min(score, 35); }
  if (P < o.minPaczek) flags.push({ k: 'bad', t: `Przyjęta liczba przesyłek (${fmt(P)}) jest poniżej minimum ${o.minPaczek} paczek miesięcznie z umowy.` });
  if (P >= o.progRabatu) flags.push({ k: 'good', t: `Ponad ${o.progRabatu} przesyłek miesięcznie – opłata miesięczna ${o.oplataMies} zł spada do 0 zł.` });
  if (utilPeak > 1) flags.push({ k: 'warn', t: `W szczycie sezonu (listopad–grudzień) obciążenie sięga ${pct(utilPeak)} przepustowości – wąskie gardło: ${bottleneck}. Zaplanuj dodatkową osobę lub większe zaplecze.` });
  else if (util < 0.35) flags.push({ k: 'warn', t: `Wykorzystanie przepustowości tylko ${pct(util)} – lokal lub obsada może być przewymiarowana względem popytu.` });
  if (fin.base.profit < 0) flags.push({ k: 'warn', t: `W scenariuszu bazowym koszty przewyższają przychód o ${zl(-fin.base.profit)} miesięcznie. Próg rentowności: ok. ${fmt(breakEven)} paczek.` });
  if (ci > 1.2) flags.push({ k: 'warn', t: `Blisko działają punkty Epaka.pl / Pakersi (indeks ${fmt(ci, 2)}) – kluczowe będzie wyróżnienie się obsługą i pozyskanie klientów biznesowych.` });
  const grade = score >= 75 ? 'A' : score >= 60 ? 'B' : score >= 45 ? 'C' : 'D';
  const gradeText = { A: 'Rekomendowana', B: 'Dobra – warunkowo', C: 'Do weryfikacji', D: 'Nie rekomendowana' }[grade];
  return { L, P, pop, trafficF, visF, parkF, lt, ci, compF, compRows, compCount: compRows.filter(c => +c.dist <= 3000).length, demand, capacity, serviceCap, storageCap, util, utilPeak, bottleneck, people, fin, startup, payback, breakEven, subs: { sDemand, sComp, sSite, sEcon, sCap }, score, grade, gradeText, flags, scConflict };
}

function capacityBars(r) {
  const max = Math.max(r.capacity, r.demand.high, r.demand.peak) * 1.05;
  const row = (n, v, col, tip) => `<div class="subbar" data-tip="${esc(tip)}"><span class="small">${n}</span><div class="track" style="height:12px"><i style="width:${clamp(v / max * 100, 0, 100)}%;background:var(${col})"></i></div><span class="small num">${fmt(v)}</span></div>`;
  return `<div class="subbars" style="margin-bottom:10px">${row('Popyt – zakres', r.demand.high, '--s1', `Zakres popytu ${fmt(r.demand.low)}–${fmt(r.demand.high)}`)}${row('Popyt – bazowy', r.demand.base, '--s1', 'Scenariusz bazowy')}${row('Szczyt sezonu', r.demand.peak, '--s2', 'Listopad–grudzień: +35%')}${row('Przepustowość', r.capacity, '--s3', 'Maksymalna liczba nadań przy obecnej obsadzie i zapleczu')}</div>`;
}

function compRadar(r, forReport = false) {
  const size = 300, c = size / 2, R = c - 18;
  const rings = [300, 800, 1500, 3000];
  const rad = d => Math.sqrt(Math.min(d, 3000) / 3000) * R;
  const col = forReport ? { s1: '#2a78d6', ink: '#0f1b2d', muted: '#6f7c91', grid: '#dce2eb', acc: '#e2691a', bad: '#d03b3b' } : null;
  const v = k => forReport ? col[k] : `var(--${k === 'ink' ? 'ink' : k === 'muted' ? 'muted' : k === 'grid' ? 'line' : k === 'acc' ? 'accent' : k === 'bad' ? 'bad' : 's1'})`;
  const typeColor = { multi: forReport ? '#eb6834' : 'var(--s2)', sc: v('bad'), poczta: forReport ? '#6250d6' : 'var(--s7)', kurier: forReport ? '#1baf7a' : 'var(--s3)', pudo: forReport ? '#e87ba4' : 'var(--s5)', paczkopunkt: forReport ? '#eda100' : 'var(--s4)', automat: forReport ? '#2a78d6' : 'var(--s1)' };
  let s = `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="Mapa odległości konkurencji" style="max-width:340px;margin:0 auto;display:block">`;
  rings.forEach(d => { const q = rad(d) * 0.7071; s += `<circle cx="${c}" cy="${c}" r="${rad(d)}" fill="none" stroke="${v('grid')}" stroke-width="1"/><text x="${c + q + 2}" y="${c + q + 9}" style="fill:${v('muted')};font-size:9px;font-family:monospace">${d >= 1000 ? fmt(d / 1000, 1) + ' km' : d + ' m'}</text>`; });
  r.compRows.forEach((cp, i) => {
    const ang = i * 2.39996 - Math.PI / 2;
    const rr = rad(+cp.dist || 0);
    const x = c + Math.cos(ang) * rr, y = c + Math.sin(ang) * rr;
    s += `<circle cx="${x}" cy="${y}" r="${4 + (+cp.strength || 3)}" fill="${typeColor[cp.type] || v('s1')}" stroke="${forReport ? '#fff' : 'var(--surface)'}" stroke-width="2" ${forReport ? '' : `data-tip="${esc((cp.name || cp.tn) + ' · ' + cp.tn + ' · ' + fmt(+cp.dist) + ' m · siła ' + (cp.strength || 3))}"`}/>`;
  });
  s += `<rect x="${c - 8}" y="${c - 8}" width="16" height="16" rx="3" fill="${v('acc')}" stroke="${forReport ? '#fff' : 'var(--surface)'}" stroke-width="2"/></svg>`;
  const used = [...new Set(r.compRows.map(x => x.type))];
  const legend = `<div class="legend" style="justify-content:center"><span><i style="background:${v('acc')}"></i>Lokal</span>${used.map(t => `<span><i style="background:${typeColor[t]};border-radius:50%"></i>${esc(COMP_TYPES[t]?.n || t)}</span>`).join('')}</div>`;
  if (forReport) return { svg: s, legend: `<p style="font-size:11px;color:#44526a;text-align:center;margin:6px 0 0">■ lokal · ${used.map(t => `<span style="color:${typeColor[t]}">●</span> ${esc(COMP_TYPES[t]?.n || t)}`).join(' · ')}</p>` };
  return r.compRows.length ? s + legend : `<p class="muted small">Dodaj punkty konkurencji, aby zobaczyć mapę odległości.</p>`;
}

/* zapis pól analizy */
function onLocInput(el) {
  const id = S.route.id; const x = D().locations[id]; if (!x) return;
  const nx = clone(x);
  if (el.dataset.loc) {
    const k = el.dataset.loc; let v = el.value;
    if (el.type === 'number') v = el.value === '' ? '' : +el.value;
    if (v === 'true') v = true; else if (v === 'false') v = false;
    nx[k] = v;
    if ((k === 'address' || k === 'city') && x[k] !== v) { nx.postalVerified = false; }
    if (k === 'postalCode') nx.postalVerified = false;
  } else if (el.dataset.locA) { nx.a = { ...(nx.a || {}), [el.dataset.locA]: +el.value || 0 }; }
  else if (el.dataset.comp != null) {
    const i = +el.dataset.comp; const comps = (nx.competitors || []).slice();
    comps[i] = { ...comps[i], [el.dataset.k]: el.type === 'number' || el.dataset.k === 'strength' ? +el.value : el.value }; nx.competitors = comps;
  }
  nx.updatedTs = new Date().toISOString();
  D().locations[id] = nx;
  debounce('loc-render', () => scheduleRender(), 300);
  debounce('loc-save-' + id, () => { const cur = D().locations[id]; if (cur) put('locations', id, cur); }, 900);
}

function reportHTML(x, r, standalone = true) {
  const o = offer();

  const L = r.L;
  const gradeCol = { A: '#0ca30c', B: '#2a78d6', C: '#c98500', D: '#d03b3b' }[r.grade];
  const radar = compRadar(r, true);
  const owner = l && l.ownerId ? D().team[l.ownerId] : null;
  const row = (k, v) => `<tr><td>${k}</td><td class="r">${v}</td></tr>`;

Dane: ${reportSummaryText(x, r)}
Typ lokalizacji: ${r.lt.n}; ruch pieszy ${x.traffic} os./dzień; widoczność ${x.visibility}/5; parking ${x.parking}; firmy wysyłające w 3 km: ${x.firms}; czynsz ${x.rent} zł; obsada: ${r.people} os.; zaplecze ${x.storage} m²; przychód bazowy ${Math.round(r.fin.base.revenue)} zł/mies. (przesyłki ${r.P}, wydania ${r.L.rev.pickups}, pieczątki ${r.L.rev.stamps}, poligrafia ${r.L.rev.print}, pakowanie ${r.L.rev.packing}).
Konkurenci: ${r.compRows.map(c => `${c.tn} ${c.dist} m (siła ${c.strength || 3})`).join('; ') || 'brak danych'}.`;
  btn.disabled = true; btn.textContent = 'Claude pisze…';
  try {
    const res = await S.sample(prompt, { modelTier: 'default' });
    await patch('locations', id, { aiComment: (res.text || '').trim(), updatedTs: new Date().toISOString() });

  }
  btn.disabled = false; scheduleRender();

const PDF_LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];
let pdfLibsPromise = null;
function loadPdfLibs() {
  if (window.html2canvas && window.jspdf) return Promise.resolve();
  if (!pdfLibsPromise) pdfLibsPromise = PDF_LIBS.reduce((p, src) => p.then(() => new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = () => rej(new Error('Nie udało się wczytać biblioteki PDF')); document.head.appendChild(sc); })), Promise.resolve()).catch(e => { pdfLibsPromise = null; throw e; });
  return pdfLibsPromise;
}
async function reportPdfBytes(x) {
  await loadPdfLibs();
  const r = analyzeLocation(x);
  const { css, body } = reportHTML(x, r, false);
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-10000px;top:0;width:820px;background:#fff;z-index:-1';
  host.innerHTML = `<style>${css} .rpt .pg{padding:28px 30px}</style>${body}`;
  document.body.appendChild(host);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const root = host.querySelector('.rpt');
    const scale = 2;
    const canvas = await window.html2canvas(root, { scale, backgroundColor: '#ffffff', logging: false });
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: true });
    const pageW = 210, pageH = 297, margin = 10;
    const pxPerMm = canvas.width / (pageW - 2 * margin);
    const pagePx = Math.floor((pageH - 2 * margin) * pxPerMm);
    const top0 = root.getBoundingClientRect().top;
    const breaks = [...root.querySelectorAll('h2, tr, .flag, .kpis, .two, ol, .foot, .comment, p')].map(el => Math.round((el.getBoundingClientRect().top - top0) * scale)).filter(v => v > 0).sort((a, b) => a - b);
    const heads = [...root.querySelectorAll('h2')].map(el => Math.round((el.getBoundingClientRect().top - top0) * scale) - 6);
    let y = 0, first = true;
    while (y < canvas.height - 4) {
      let end = Math.min(y + pagePx, canvas.height);
      if (end < canvas.height) {
        const cand = breaks.filter(b => b > y + pagePx * 0.5 && b <= end); if (cand.length) end = cand[cand.length - 1];
        const orphan = heads.filter(h => h > y + pagePx * 0.4 && h < end && end - h < 70 * scale); if (orphan.length) end = orphan[0];
      }
      const slice = document.createElement('canvas');
      slice.width = canvas.width; slice.height = end - y;
      const ctx = slice.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, slice.width, slice.height);
      ctx.drawImage(canvas, 0, y, canvas.width, end - y, 0, 0, canvas.width, end - y);
      if (!first) pdf.addPage();
      pdf.addImage(slice.toDataURL('image/jpeg', 0.9), 'JPEG', margin, margin, pageW - 2 * margin, (end - y) / pxPerMm);
      first = false; y = end;
    }
    const n = pdf.getNumberOfPages();
    for (let i = 1; i <= n; i++) { pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(140); pdf.text(`${i} / ${n}`, pageW - margin, pageH - 4, { align: 'right' }); }
    return pdf.output('arraybuffer');
  } finally { host.remove(); }
}
const reportFileName = x => `Raport-lokalizacji-ShipCenter-${slug(x.city || x.name)}.pdf`;
async function downloadReportPdf(id, btn) {
  const x = D().locations[id]; if (!x) return;
  const label = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Tworzę PDF…'; }
  try { const bytes = await reportPdfBytes(x); await offerDownload(reportFileName(x), bytes); }
  catch (e) { toast('Nie udało się utworzyć PDF: ' + (e && e.message || 'błąd') + '. Możesz pobrać wersję HTML.', 'bad'); }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = label; } }
}

const normKey = s => String(s || '').toLowerCase().trim().replace(/\s+/g, ' ');
function guessField(header) {
  const h = normKey(header);
  let best = '';
  for (const f of LEAD_FIELDS) if (f.keys.includes(h)) { best = f.k; break; }
  if (!best) for (const f of LEAD_FIELDS) if (f.keys.some(k => k.length > 3 && h.includes(k))) { best = f.k; break; }
  return best;
}
function matchSource(v) {
  const s = normKey(v);
  if (!s) return '';
  if (/(fb|facebook|instagram|meta|ig)/.test(s)) return 'meta';
  if (/(google|adwords|gads)/.test(s)) return 'google';
  if (/(portal|franczyz|franchis)/.test(s)) return 'portale';
  if (/linkedin/.test(s)) return 'linkedin';
  if (/(polec|referr)/.test(s)) return 'polecenia';
  if (/(targi|event|expo)/.test(s)) return 'targi';
  if (/(www|strona|seo|organic|site)/.test(s)) return 'www';
  if (/webinar/.test(s)) return 'webinar';
  if (/(outbound|cold|telefon)/.test(s)) return 'outbound';
  const exact = SOURCES.find(x => normKey(x.n) === s || x.k === s);
  return exact ? exact.k : 'inne';
}
function matchRegion(v) {
  const s = normKey(v).replace(/^woj\.?\s*/, '').replace('województwo ', '');
  return REGIONS.find(r => r === s) || REGIONS.find(r => r.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace('ł', 'l') === s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace('ł', 'l')) || '';
}
function parseDateLoose(v) {
  if (v == null || v === '') return '';
  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return isoDate(d); }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/); if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  const d = new Date(s); return isNaN(d) ? '' : isoDate(d);
}
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const firstLine = text.split(/\r?\n/)[0] || '';
  const delim = [';', '\t', ','].map(d => [d, firstLine.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

function setImportTable(rows, name) {
  if (!rows.length || rows.length < 2) { toast('Plik nie zawiera wierszy z danymi (potrzebny nagłówek i min. 1 wiersz).', 'bad'); return; }
  IMP.headers = rows[0].map(h => String(h ?? '').trim());
  IMP.rows = rows.slice(1);
  IMP.fileName = name;
  IMP.map = {};
  const used = new Set();
  IMP.headers.forEach((h, i) => { const g = guessField(h); if (g && !used.has(g)) { IMP.map[i] = g; used.add(g); } });
  renderImport();
}
function readImportFile(file) {
  const name = file.name || 'plik';
  const isX = /\.xlsx?$/i.test(name);
  const reader = new FileReader();
  reader.onerror = () => toast('Nie udało się odczytać pliku.', 'bad');
  reader.onload = () => {
    try {
      if (isX) {
        if (!window.XLSX) { toast('Biblioteka XLSX nie wczytała się – zapisz plik jako CSV.', 'bad'); return; }
        const wb = XLSX.read(new Uint8Array(reader.result), { type: 'array', cellDates: false });
        const ws = wb.Sheets[wb.SheetNames[0]];
        setImportTable(XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' }), name);
      } else {
        let text = reader.result;
        if (text.includes('\uFFFD')) { const r2 = new FileReader(); r2.onload = () => setImportTable(parseCSV(r2.result), name); r2.readAsText(file, 'windows-1250'); return; }
        setImportTable(parseCSV(text), name);
      }
    } catch (e) { toast('Błąd odczytu pliku: ' + e.message, 'bad'); }
  };
  if (isX) reader.readAsArrayBuffer(file); else reader.readAsText(file, 'utf-8');
}
function buildImportRows() {
  const src = ($('#imp-src') || {}).value || IMP.defSource || 'meta';
  const owner = ($('#imp-owner') || {}).value ?? IMP.defOwner ?? '';
  const region = ($('#imp-region') || {}).value ?? IMP.defRegion ?? '';
  return IMP.rows.map(r => {
    const o = {};
    Object.entries(IMP.map).forEach(([i, k]) => { if (k) { const v = r[i]; if (v !== '' && v != null) o[k] = o[k] ? o[k] + ' ' + v : v; } });
    const name = [o.name, o.lastName].filter(Boolean).join(' ').trim();
    const ownerId = o.owner ? (team().find(m => normKey(m.name) === normKey(o.owner) || normKey(m.name).startsWith(normKey(o.owner)))?.id || owner) : owner;
    const status = o.status ? (STATUSES.find(s => normKey(s.n) === normKey(o.status) || s.k === normKey(o.status))?.k || 'do_kontaktu') : 'do_kontaktu';
    return {
      name, company: String(o.company || '').trim(), phone: fmtPhone(String(o.phone || '').replace(/^p:/, '').trim()), email: String(o.email || '').trim(),
      city: String(o.city || '').trim(), region: matchRegion(o.region) || region, source: matchSource(o.source) || src, ownerId,
      model: /ship\s*-?\s*point|partner|point/i.test(String(o.model || '')) ? 'shippoint' : 'franczyza',
      capital: String(o.capital || '').replace(/[^\d]/g, ''), notes: String(o.notes || '').trim(), createdAt: parseDateLoose(o.createdAt) || todayISO(), status
    };
  }).filter(r => r.name || r.phone || r.email);
}
async function runImport(btn) {
  const rows = buildImportRows();
  const skip = (($('#imp-dups') || {}).value || 'skip') === 'skip';
  const pool = leadsArr();
  const batchSeen = [];
  const items = [];
  rows.forEach(r => {
    if (skip && (findDuplicate(r, pool) || findDuplicate(r, batchSeen))) return;
    batchSeen.push(r);
    const lead = newLead({ ...r, name: r.name || r.email || r.phone, nextTaskDate: todayISO() });
    lead.stageDates = r.status === 'pozyskany' ? { umowa: r.createdAt } : {};
    lead.history = [histEntry('system', 'Import z pliku: ' + (IMP.fileName || 'wklejone dane'))];
    items.push(lead);
  });
  if (!items.length) { toast('Brak nowych leadów do zaimportowania.', 'bad'); return; }
  btn.disabled = true;
  const prog = $('#imp-progress');
  const res = await putMany('leads', items, (d, n) => { if (prog) prog.textContent = `Zapisywanie: ${d} / ${n}`; });
  closeModal();
  toast(`Zaimportowano ${res.done - res.failed} leadów${res.failed ? ', błędy: ' + res.failed : ''}`);
  go('leady');
}

function toCSV(rows) {

function autoAssign() {
  const members = team();
  const loads = Object.fromEntries(members.map(m => [m.id, leadsArr().filter(l => l.ownerId === m.id && isOpen(l)).length]));
  let n = 0;
  leadsArr().filter(l => !l.ownerId && isOpen(l)).forEach(l => {
    const cands = members.filter(m => (m.regions || []).includes(l.region));
    if (!cands.length) return;
    const m = cands.sort((a, b) => loads[a.id] - loads[b.id])[0];
    loads[m.id]++; n++;
    const hist = (l.history || []).slice(); hist.push(histEntry('system', 'Automatyczne przypisanie wg regionu: ' + m.name));
    patch('leads', l.id, { ownerId: m.id, history: hist });
  });
  toast(n ? `Przypisano ${n} leadów` : 'Brak leadów do przypisania (sprawdź regiony osób i leadów).', n ? '' : 'bad');
}

function buildDemo() {
  const d = emptyData();
  const rnd = (() => { let x = 7; return () => (x = (x * 16807) % 2147483647) / 2147483647; })();
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const people = [['Przykład: Marta Zielińska', 'Centrala – dyrektor rozwoju', ['śląskie', 'opolskie', 'małopolskie']], ['Przykład: Paweł Nowicki', 'Opiekun regionalny', ['mazowieckie', 'łódzkie', 'podlaskie', 'lubelskie']], ['Przykład: Tomasz Wrona', 'Opiekun regionalny', ['wielkopolskie', 'dolnośląskie', 'pomorskie', 'kujawsko-pomorskie', 'podkarpackie', 'świętokrzyskie']]];
  people.forEach(([name, role, regions], i) => { const id = 'demo-m' + i; d.team[id] = { id, name, role, regions, phone: '+48 600 000 0' + pad(i + 10), email: `demo${i + 1}@example.com`, userId: i === 0 && S.userId ? S.userId : '' }; });
  const memberIds = Object.keys(d.team);
  d.settings = { goal: 2.5, offer: { ...(settings().offer || {}) } };
  const cities = [['Rybnik', 'śląskie'], ['Opole', 'opolskie'], ['Płock', 'mazowieckie'], ['Radom', 'mazowieckie'], ['Łódź', 'łódzkie'], ['Białystok', 'podlaskie'], ['Tarnów', 'małopolskie'], ['Rzeszów', 'podkarpackie'], ['Kielce', 'świętokrzyskie'], ['Kalisz', 'wielkopolskie'], ['Legnica', 'dolnośląskie'], ['Słupsk', 'pomorskie'], ['Toruń', 'kujawsko-pomorskie'], ['Gliwice', 'śląskie'], ['Lublin', 'lubelskie']];
  const first = ['Anna', 'Piotr', 'Katarzyna', 'Michał', 'Agnieszka', 'Krzysztof', 'Magdalena', 'Łukasz', 'Joanna', 'Marcin', 'Natalia', 'Adam', 'Karolina', 'Jakub', 'Monika', 'Grzegorz'];
  const last = ['Kowalczyk', 'Wiśniewski', 'Lewandowska', 'Dąbrowski', 'Mazur', 'Kaczmarek', 'Zając', 'Pawlak', 'Michalska', 'Sikora', 'Baran', 'Wróbel', 'Górska', 'Jabłoński'];
  const srcW = ['google', 'google', 'google', 'google', 'www', 'www', 'meta', 'portale', 'polecenia', 'inne'];
  const conv = [0.78, 0.65, 0.4, 0.4];
  const t = todayISO();
  for (let i = 0; i < 120; i++) {
    const age = Math.floor(Math.pow(rnd(), 0.9) * 75);
    const created = addDays(new Date(), -age);
    let st = 0; while (st < NS - 1 && rnd() < conv[st] && age > st * 9) st++;
    const [city, region] = pick(cities);
    const owner = rnd() < 0.06 ? '' : (Object.values(d.team).find(m => m.regions.includes(region)) || {}).id || pick(memberIds);
    const lost = st < NS - 1 && age > 20 && rnd() < 0.35;
    const sd = {}; if (st >= 3) sd.spotkanie = isoDate(addDays(created, Math.min(age, 8 + Math.round(rnd() * 10)))); if (st >= 4) sd.umowa = isoDate(addDays(created, Math.min(age, 20 + Math.round(rnd() * 20))));
    const fn = pick(first), ln = pick(last);
    const model = rnd() < 0.72 ? 'franczyza' : 'shippoint';
    const status = st === 4 ? 'pozyskany' : lost ? 'utracony' : st === 0 ? (age > 2 ? 'proba' : 'do_kontaktu') : st === 3 && rnd() < 0.4 ? 'umowione' : pick(['w_kontakcie', 'czeka', 'w_kontakcie', 'wstrzymany']);
    const firstCallAt = st >= 1 ? isoDate(addDays(created, Math.min(age, rnd() < 0.75 ? 0 : 2))) : '';
    const presentationAt = st >= 2 ? isoDate(addDays(parseD(firstCallAt || isoDate(created)), Math.min(age, 1))) : '';
    const hist = [histEntry('system', 'Zapytanie z formularza: ' + (model === 'shippoint' ? 'Ship Point' : 'franczyza') + ' (dane przykładowe)')];
    hist[0].at = isoDate(created) + 'T09:00';
    if (firstCallAt) hist.push({ id: uid('h'), at: firstCallAt + 'T10:30', type: 'tel', text: 'Pierwsza rozmowa – omówiony pakiet SMART, pytania o lokal.', result: 'Rozmowa przeprowadzona', by: owner });
    if (presentationAt) hist.push({ id: uid('h'), at: presentationAt + 'T11:00', type: 'email', text: 'Wysłano prezentację', result: 'Wysłano materiały', by: owner });
    if (sd.spotkanie) hist.push({ id: uid('h'), at: sd.spotkanie + 'T13:15', type: 'spotkanie', text: 'Spotkanie online – pytania o lokal i konkurencję paczkomatów.', result: 'Spotkanie odbyte', by: owner });
    if (sd.umowa) hist.push({ id: uid('h'), at: sd.umowa + 'T12:00', type: 'notatka', text: 'Umowa podpisana.', result: 'Inne', by: owner });
    const id = 'demo-l' + pad(i);
    const open = !['pozyskany', 'utracony'].includes(status);
    const nt = open && (st > 0 || rnd() < 0.5) && rnd() < 0.9 ? isoDate(addDays(new Date(), Math.floor(rnd() * 11) - 3)) : '';
    d.leads[id] = { id, name: `${fn} ${ln}`, company: model === 'shippoint' ? `${ln} – sklep` : '', phone: '+48 5' + String(10000000 + Math.floor(rnd() * 89999999)), email: `${fn}.${ln}`.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ł/g, 'l') + '@example.com', city, region, source: pick(srcW), ownerId: owner, status, capital: String(20000 + Math.floor(rnd() * 8) * 10000), model, pkg: model === 'franczyza' && st >= 2 ? pick(['smart', 'flex', '']) : '', hasPremises: pick(['ma', 'szuka', '']), form: 'panstwo',
      nextTask: nt ? (presentationAt ? 'Telefon po prezentacji' : firstCallAt ? 'Umówić spotkanie' : 'Pierwsza rozmowa telefoniczna') : '', nextTaskDate: nt, nextTaskTime: nt && rnd() < 0.4 ? pick(['09:30', '11:00', '13:00', '15:30']) : '', firstCallAt, presentationAt,
      meetingAt: st === 3 && status === 'umowione' ? isoDate(addDays(new Date(), Math.floor(rnd() * 6))) + 'T1' + Math.floor(rnd() * 6) + ':00' : '', meetingType: 'online', meetingPlace: '', notes: '', lostReason: lost ? pick(LOST_REASONS) : '', handoffs: [], history: hist, stageDates: sd, createdAt: isoDate(created), createdTs: created.toISOString(), updatedTs: created.toISOString() };
    if (firstCallAt && rnd() < 0.6 && age < 30) { const sid = uid('sms'); d.sms[sid] = { leadId: id, leadName: `${fn} ${ln}`, phone: d.leads[id].phone, text: smsThanksText(d.leads[id]), ownerId: owner, status: age < 1 ? 'oczekuje' : 'wyslany', createdTs: firstCallAt + 'T10:35:00.000Z', id: sid }; }
  }
  for (let k = 0; k < 75; k++) { const dt = isoDate(addDays(new Date(), -k)); const cost = Math.round(380 + rnd() * 260); const clicks = Math.round(cost / (3.5 + rnd() * 2)); d.ads['demo-' + dt] = { id: 'demo-' + dt, date: dt, campaign: 'Franczyza – Search (przykład)', cost, clicks, impressions: clicks * Math.round(14 + rnd() * 10), conversions: Math.round(rnd() * 3 * 10) / 10 }; }
  const l0 = Object.values(d.leads).find(l => stageIdx(l) === 3) || Object.values(d.leads)[0];
  const loc = { ...clone(LOC_DEFAULTS), id: 'demo-loc1', name: `${l0.city} – ul. Przykładowa 12`, leadId: l0.id, address: 'ul. Przykładowa 12', city: l0.city, region: l0.region, cityPop: 135000, catchment: 15000, traffic: 2600, visibility: 4, parking: 'ograniczony', firms: 55, rent: 2600, createdAt: t,
    competitors: [{ name: 'Punkt Epaka – sklep papierniczy (przykład)', type: 'epaka', dist: 650, strength: 3 }, { name: 'Pakersi – ul. Przykładowa 3 (przykład)', type: 'pakersi', dist: 1900, strength: 4 }] };
  d.locations[loc.id] = loc;
  return d;
}

function handleAction(act, el, e) {

  switch (act) {
    case 'modal-bg': if (e.target === el) closeModal(); return;
    case 'modal-close': closeModal(); return;
    case 'demo-on': store.demo = buildDemo(); S.demo = true; S.ui.cOwner = null; closeModal(); toast('Włączono podgląd na danych przykładowych'); go('centrala'); return;
    case 'demo-off': S.demo = false; store.demo = null; S.ui.cOwner = null; S.selected.clear(); toast('Wróciłeś do prawdziwych danych'); go('centrala'); return;
    case 'lead-new': openLeadModal(); return;
    case 'import-open': openImport(); return;
    case 'export-xlsx': exportXLSX(false); return;
    case 'export-xlsx-leads': exportXLSX(true); return;
    case 'export-csv': exportCSV(); return;
    case 'filters-clear': S.f = { ...S.f, source: '', owner: '', region: '', status: '', q: '', ids: null, idsLabel: '' }; scheduleRender(); return;

    case 'leads-view': S.leadsView = el.dataset.v; scheduleRender(); return;
