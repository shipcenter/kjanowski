<title>Panel franczyzy Ship Center</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy app bar with tabbed nav, single working column (max 1320px), cards only for distinct tools.
   Vernacular: waybill / parcel label – mono codes, tape-orange accent, blue-grey neutrals. */
/* Layout: white app bar like shipcenter.pl, single working column (max 1320px), rounded white cards on gray-50.
   Brand (from shipcenter.pl/franczyza/kalkulator): Poppins, orange #ea580c, Tailwind gray scale, orange-50 washes. */
:root {
  --bg: #f9fafb;
  --surface: #ffffff;
  --surface-2: #f3f4f6;
  --surface-3: #e5e7eb;
  --ink: #111827;
  --ink-2: #4b5563;
  --muted: #6b7280;
  --line: #e5e7eb;
  --line-2: #d1d5db;
  --hdr-bg: #ffffff;
  --hdr-ink: #111827;
  --hdr-muted: #6b7280;
  --accent: #ea580c;
  --accent-ink: #c2410c;
  --accent-wash: #fff7ed;
  --accent-line: #fed7aa;
  --focus: #f97316;
  --s1: #ea580c; --s2: #2a78d6; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --plan: #d1d5db;
  --good: #16a34a; --good-ink: #15803d; --good-wash: #f0fdf4;
  --warn: #f59e0b; --warn-ink: #b45309; --warn-wash: #fffbeb;
  --bad: #dc2626; --bad-ink: #b91c1c; --bad-wash: #fef2f2;
  --grid: #eef0f3;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 10px 30px rgba(15, 23, 42, .06);
  --f-display: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f19; --surface: #111827; --surface-2: #1a2333; --surface-3: #263042;
    --ink: #f3f4f6; --ink-2: #d1d5db; --muted: #9ca3af; --line: #253044; --line-2: #374151;
    --hdr-bg: #111827; --hdr-ink: #f3f4f6; --hdr-muted: #9ca3af;
    --accent: #f97316; --accent-ink: #fb923c; --accent-wash: #2a1608; --accent-line: #7c2d12; --focus: #fb923c;
    --s1: #f97316; --s2: #3987e5; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --plan: #4b5563;
    --good: #22c55e; --good-ink: #4ade80; --good-wash: #0f2a19; --warn-ink: #fbbf24; --warn-wash: #2d2410;
    --bad-ink: #f87171; --bad-wash: #3a1414; --grid: #1f2937;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f19; --surface: #111827; --surface-2: #1a2333; --surface-3: #263042;
  --ink: #f3f4f6; --ink-2: #d1d5db; --muted: #9ca3af; --line: #253044; --line-2: #374151;
  --hdr-bg: #111827; --hdr-ink: #f3f4f6; --hdr-muted: #9ca3af;
  --accent: #f97316; --accent-ink: #fb923c; --accent-wash: #2a1608; --accent-line: #7c2d12; --focus: #fb923c;
  --s1: #f97316; --s2: #3987e5; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --plan: #4b5563;
  --good: #22c55e; --good-ink: #4ade80; --good-wash: #0f2a19; --warn-ink: #fbbf24; --warn-wash: #2d2410;
  --bad-ink: #f87171; --bad-wash: #3a1414; --grid: #1f2937;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--hdr-bg); }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.65rem; font-weight: 700; letter-spacing: -.02em; }
h2 { font-size: 1.08rem; font-weight: 600; letter-spacing: -.01em; }
h3 { font-size: .95rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--focus); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: .82rem; }
.tiny { font-size: .74rem; }
.eyebrow { font-family: var(--f-body); font-weight: 600; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* App bar */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--hdr-bg); color: var(--hdr-ink); border-bottom: 1px solid var(--line); }
.appbar .wrap { display: flex; flex-direction: column; gap: 4px; padding-block: 12px 0; }
.brandrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { display: none; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; letter-spacing: -.03em; white-space: nowrap; color: var(--hdr-ink); }
.brand-name b { color: var(--accent); font-weight: 700; }
.brand-sub { font-size: .66rem; font-weight: 600; color: var(--accent-ink); background: var(--accent-wash); border-radius: 999px; padding: 3px 10px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
.brandrow .spacer { flex: 1; }
.syncstate { font-size: .74rem; color: var(--hdr-muted); display: flex; align-items: center; gap: 6px; }
.syncstate .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hdr-muted); }
.syncstate.ok .dot { background: #3fc23f; }
.syncstate.busy .dot { background: var(--warn); }
.syncstate.off .dot { background: var(--bad); }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; }
.nav::-webkit-scrollbar { display: none; }
.nav a { color: var(--hdr-muted); text-decoration: none; padding: 10px 12px 12px; font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent; font-size: .88rem; display: inline-flex; gap: 6px; align-items: center; }
.nav a .badge { background: var(--accent); color: #fff; border-radius: 999px; font-size: .68rem; font-weight: 600; padding: 1px 7px; line-height: 1.5; }
.nav a:hover { color: var(--hdr-ink); }
.nav a.on { color: var(--hdr-ink); border-bottom-color: var(--accent); }


/* Banners */
.banner { padding-block: 9px; font-size: .86rem; }
.banner .wrap { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner.demo { background: var(--accent-wash); color: var(--accent-ink); border-bottom: 1px solid var(--line); }
.banner.local { background: var(--warn-wash); color: var(--warn-ink); border-bottom: 1px solid var(--line); }
.banner.ro { background: var(--surface-2); color: var(--ink-2); border-bottom: 1px solid var(--line); }

main { padding-block: 20px 64px; }
.viewhead { display: flex; align-items: flex-end; gap: 12px 20px; flex-wrap: wrap; margin-bottom: 16px; }
.viewhead .grow { flex: 1; min-width: 220px; }
.viewhead p { color: var(--ink-2); margin-top: 4px; max-width: 70ch; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Buttons & inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: .87rem; line-height: 1.2; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; box-shadow: 0 1px 2px rgba(234, 88, 12, .25); }
.btn.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--bad-ink); border-color: var(--line-2); }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: .8rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; flex: none; }
.iconbtn { border: none; background: transparent; cursor: pointer; padding: 4px; border-radius: 4px; color: var(--muted); line-height: 0; }
.iconbtn:hover { background: var(--surface-2); color: var(--ink); }
.iconbtn svg { width: 16px; height: 16px; }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: .76rem; color: var(--ink-2); font-weight: 500; }
.field .hint { font-size: .72rem; color: var(--muted); }
.field .hint.good { color: var(--good, #15803d); font-weight: 600; }
.field .hint.warn { color: var(--warn, #b45309); }
input.autofilled { background: color-mix(in srgb, var(--good, #15803d) 8%, var(--bg-input, #fff)); }
input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date], input[type=datetime-local], input[type=time], input[type=search], input[type=url], select, textarea {
  width: 100%; min-width: 0; border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: .86rem; color: var(--ink);
}
textarea { resize: vertical; min-height: 70px; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
.formgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.formgrid .span2 { grid-column: span 2; }
.formgrid .full { grid-column: 1 / -1; }
@media (max-width: 520px) { .formgrid .span2 { grid-column: 1 / -1; } }

/* Surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; box-shadow: 0 1px 2px rgba(16, 24, 40, .04); }
.card.flat { box-shadow: none; }
.card > .cardhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card > .cardhead p { color: var(--muted); font-size: .8rem; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.sep { height: 1px; background: var(--line); margin: 12px 0; }
.split { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 960px) { .split { grid-template-columns: minmax(0, 1fr); } }
.split-side { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 960px) { .split-side { grid-template-columns: minmax(0, 1fr); } }

/* Filter bar */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin-bottom: 16px; }
.filters .field { width: 160px; flex: 1 1 140px; }
.filters .field.search { flex: 2 1 200px; width: auto; }
.filters .clear { align-self: flex-end; }
.activefilters { font-size: .78rem; color: var(--accent-ink); }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 178px), 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; box-shadow: 0 1px 2px rgba(16, 24, 40, .04); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .label { font-size: .78rem; color: var(--ink-2); }
.kpi .value { font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .value small { font-size: .9rem; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
.kpi .sub { font-size: .76rem; color: var(--muted); }
.kpi .meter { height: 6px; border-radius: 3px; background: var(--surface-3); margin-top: 6px; overflow: hidden; }
.kpi .meter i { display: block; height: 100%; border-radius: 3px; background: var(--s1); }
.kpi.hl { border-color: var(--accent-line); background: linear-gradient(180deg, var(--accent-wash), var(--surface) 70%); }
.delta { font-size: .76rem; font-weight: 600; }
.delta.up { color: var(--good-ink); }
.delta.down { color: var(--bad-ink); }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: .74rem; font-weight: 500; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; border: 1px solid transparent; }
.pill .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.pill.good { background: var(--good-wash); color: var(--good-ink); }
.pill.warn { background: var(--warn-wash); color: var(--warn-ink); }
.pill.bad { background: var(--bad-wash); color: var(--bad-ink); }
.pill.acc { background: var(--accent-wash); color: var(--accent-ink); }
.pill.outline { background: transparent; border-color: var(--line-2); }
.code { font-family: var(--f-mono); font-size: .74rem; color: var(--muted); letter-spacing: .02em; }
.stagebar { display: inline-flex; gap: 2px; vertical-align: middle; }
.stagebar i { width: 9px; height: 6px; border-radius: 1px; background: var(--surface-3); }
.stagebar i.on { background: var(--s1); }
.stagebar.won i.on { background: var(--good); }
.stagebar.lost i.on { background: var(--muted); }

/* Tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.t { width: 100%; border-collapse: collapse; font-size: .85rem; }
table.t th { text-align: left; font-weight: 600; font-size: .74rem; color: var(--ink-2); padding: 9px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
table.t th.sortable { cursor: pointer; user-select: none; }
table.t th.sortable:hover { color: var(--ink); }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: none; }
table.t tbody tr:hover td { background: var(--surface-2); }
table.t td.r, table.t th.r { text-align: right; font-variant-numeric: tabular-nums; }
table.t tr.click { cursor: pointer; }
table.t tfoot td { font-weight: 600; background: var(--surface-2); border-top: 1px solid var(--line-2); }
.cellname { display: flex; flex-direction: column; min-width: 160px; }
.cellname b { font-weight: 600; }
.overdue { color: var(--bad-ink); font-weight: 600; }
.today { color: var(--accent-ink); font-weight: 600; }
.bar-inline { display: flex; align-items: center; gap: 6px; min-width: 110px; }
.bar-inline .track { flex: 1; height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; position: relative; }
.bar-inline .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--s1); }
.bar-inline .track b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink-2); }

/* Kanban */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 8px; }
.kcol { background: var(--surface-2); border-radius: var(--r); padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 160px; border: 1px solid var(--line); }
.kcol.drop { outline: 2px dashed var(--focus); outline-offset: -2px; }
.kcol h3 { font-size: .82rem; display: flex; justify-content: space-between; padding: 2px 4px; }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; cursor: grab; display: flex; flex-direction: column; gap: 4px; font-size: .82rem; }
.kcard:hover { border-color: var(--line-2); }
.kcard b { font-weight: 600; }
.kcard .row { gap: 4px; }

/* Lead view */
.leadhead { display: flex; gap: 12px 24px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 14px; }
.leadhead .who { flex: 1; min-width: 240px; }
.leadhead h1 { font-size: 1.7rem; }
.stepper { display: flex; gap: 0; overflow-x: auto; margin-bottom: 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.stepper button { flex: 1 0 auto; border: none; background: transparent; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; border-right: 1px solid var(--line); min-width: 120px; text-align: left; }
.stepper button:last-child { border-right: none; }
.stepper button .n { font-family: var(--f-mono); font-size: .68rem; color: var(--muted); }
.stepper button .t { font-weight: 600; font-size: .82rem; }
.stepper button .d { font-size: .7rem; color: var(--muted); }
.stepper button.done { background: var(--surface-2); }
.stepper button.done .n { color: var(--s1); }
.stepper button.cur { background: var(--accent); color: #fff; }
.stepper button.cur .n, .stepper button.cur .d { color: rgba(255, 255, 255, .8); }
.stepper button.won.cur { background: var(--good); color: #fff; }
.stepper button:hover:not(.cur) { background: var(--surface-3); }
.timeline { display: flex; flex-direction: column; gap: 0; }
.tl-item { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.tl-item:last-child { border-bottom: none; }
.tl-ic { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-2); }
.tl-ic svg { width: 14px; height: 14px; }
.tl-item .meta { font-size: .74rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.tl-item .body { white-space: pre-wrap; word-break: break-word; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: .86rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; word-break: break-word; }

/* Message output */
.msgout { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 14px; white-space: pre-wrap; font-size: .88rem; line-height: 1.55; max-height: 560px; overflow: auto; word-break: break-word; }
.msgout .ph { background: var(--warn-wash); color: var(--warn-ink); border-radius: 3px; padding: 0 3px; }
.tplist { display: flex; flex-direction: column; gap: 2px; }
.tplist button { text-align: left; border: none; background: transparent; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: .86rem; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
.tplist button:hover { background: var(--surface-2); color: var(--ink); }
.tplist button.on { background: var(--accent-wash); color: var(--accent-ink); font-weight: 600; }
.tplist .grp { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 4px; }

/* Roadmap */
.gantt { position: relative; display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 2px; margin: 8px 0 4px; }
.gantt .ph { height: 30px; border-radius: 4px; display: flex; align-items: center; padding: 0 8px; font-size: .74rem; font-weight: 600; color: #fff; overflow: hidden; white-space: nowrap; }
.gantt .now { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--accent); }
.gantt .now::after { content: "dziś"; position: absolute; top: -16px; left: -10px; font-family: var(--f-mono); font-size: .66rem; color: var(--accent-ink); }
.weekticks { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 2px; font-family: var(--f-mono); font-size: .66rem; color: var(--muted); }
.weekgroup { border-top: 1px solid var(--line); padding: 12px 0; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; }

/* zapis wielu dokumentów (import) z ograniczoną równoległością */
async function putMany(col, items, onProgress) {
  let done = 0, failed = 0;
  const queue = items.slice();
  const worker = async () => {
    while (queue.length) {
      const it = queue.shift();
      try { await put(col, it.id, it); } catch (e) { failed++; }
      done++; onProgress && onProgress(done, items.length);
      if (S.readonly) { queue.length = 0; }
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  return { done, failed };
}

/* ---------- model planu ---------- */
function cumConv(conv) { const p = [1]; for (let i = 0; i < NS - 1; i++) p.push(p[i] * (+conv[i] || 0)); return p; }
function winProbFrom(idx, conv) { let p = 1; for (let i = idx; i < NS - 1; i++) p *= (+conv[i] || 0); return p; }
function lagWeights(days, n = 6) {
  days = Math.max(1, +days || 60);
  const sd = Math.max(7, days * 0.45);
  const cdf = x => 0.5 * (1 + erf((x - days) / (sd * Math.SQRT2)));
  const w = [];
  for (let k = 0; k < n; k++) w.push(cdf(30 * (k + 1)) - cdf(30 * k));
  w[0] += cdf(0);
  return w;
}
function computePlan(plan) {
  const budget = +plan.budget || 0;
  const conv = (plan.conv && plan.conv.length === NS - 1) ? plan.conv.map(Number) : DEFAULT_CONV;
  const rows = SOURCES.map(s => {
    const share = +((plan.mix || {})[s.k]) || 0;
    const cpl = +((plan.cpl || {})[s.k]) || s.cpl;
    const spend = budget * share / 100;
    return { k: s.k, n: s.n, share, cpl, spend, leads: cpl > 0 ? spend / cpl : 0 };
  });
  const mixSum = sum(rows, r => r.share);
  const leads = sum(rows, r => r.leads);
  const p = cumConv(conv);
  const overall = p[NS - 1];
  const points = leads * overall;
  const cplBlend = leads > 0 ? budget / leads : null;
  const cac = points > 0 ? budget / points : null;
  const target = +plan.target || 0;
  const reqLeads = overall > 0 ? target / overall : null;
  const reqBudget = reqLeads && cplBlend ? reqLeads * cplBlend : null;
  const cycle = +plan.cycleDays || 60;
  const wWin = lagWeights(cycle), wMeet = lagWeights(cycle * 0.3), wLoc = lagWeights(cycle * 0.55);
  const ramp = [0.8, 1, 1];
  const months = [0, 1, 2].map(m => {
    let pts = 0, meet = 0, loc = 0;
    for (let j = 0; j <= m; j++) {
      const L = leads * ramp[j];
      pts += L * overall * wWin[m - j]; meet += L * p[3] * wMeet[m - j]; loc += L * p[2] * wLoc[m - j];
    }
    return { leads: leads * ramp[m], meetings: meet, analyses: loc, points: pts, spend: budget };
  });
  return { rows, mixSum, leads, p, overall, points, cplBlend, cac, target, reqLeads, reqBudget, months, conv, budget, cycle, stageCounts: p.map(x => x * leads) };
}
function planWindows(plan) {
  const s = parseD(plan.startDate) || parseD(todayISO());
  return [0, 1, 2].map(m => [addDays(s, m * 30), addDays(s, (m + 1) * 30)]);
}

/* ---------- metryki wykonania ---------- */
function actualsFor(leads, spend, a, b) {
  return {
    leads: leads.filter(l => inRange(l.createdAt, a, b)).length,
    meetings: leads.filter(l => inRange(stageDatesOf(l).spotkanie, a, b)).length,
    analyses: leads.filter(l => inRange(stageDatesOf(l).lokalizacja, a, b)).length,
    points: leads.filter(l => inRange(stageDatesOf(l).umowa, a, b)).length,
    spend: sum(spend.filter(x => inRange(x.date, a, b)), x => x.amount)
  };
}
function funnelOf(cohort) {
  const reached = STAGES.map((s, i) => cohort.filter(l => stageIdx(l) >= i).length);
  const conv = reached.slice(0, NS - 1).map((r, i) => r > 0 ? reached[i + 1] / r : null);
  return { reached, conv };
}
function filteredSpend(f = S.f) {
  return Object.values(D().spend).filter(x => !f.source || x.source === f.source);
}
/* prognoza: lejek otwartych leadów + nowe leady z planu */
function forecast(plan, leads, lpm = null) {
  const c = computePlan(plan);
  if (lpm != null) c.leads = lpm;
  const buckets = [0, 0, 0];
  const pipeByStage = STAGES.map(() => ({ n: 0, exp: 0 }));
  leads.filter(isOpen).forEach(l => {
    const i = stageIdx(l);
    if (i >= NS - 1) return;
    const pw = winProbFrom(i, c.conv);
    const progress = i / (NS - 1);
    const remaining = Math.max(10, c.cycle * (1 - progress * 0.9));
    const w = lagWeights(remaining, 3);
    w.forEach((x, k) => { buckets[k] += pw * x; });
    pipeByStage[i].n++; pipeByStage[i].exp += pw * sum(w);
  });
  const wWin = lagWeights(c.cycle, 3);
  const fromNew = [0, 0, 0];
  for (let m = 0; m < 3; m++) for (let j = 0; j <= m; j++) fromNew[m] += c.leads * c.overall * wWin[m - j];
  return { pipeline: buckets, fromNew, total: buckets.map((x, i) => x + fromNew[i]), pipeByStage };
}

function addWorkDays(iso, n) { let d = parseD(iso); if (!d) return ''; let k = 0; while (k < n) { d = addDays(d, 1); const wd = d.getDay(); if (wd !== 0 && wd !== 6) k++; } return isoDate(d); }

const smartPriceOf = l => (l && +l.smartPrice > 0) ? +l.smartPrice : (+offer().licencja || 0);
function flexCalc(ids, smartOverride) {
  const items = FLEX_ITEMS.filter(it => (ids || []).includes(it.id));

}

/* ---------- wykresy (SVG) ---------- */
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
/* kolumny + linia planu; data: [{label, value, tip}] */
function columnChart(data, { planValue = null, height = 190, color = '--s1', planLabel = 'Plan', valueFmt = v => fmt(v) } = {}) {
  const W = 640, H = height, L = 34, R = 10, T = 16, B = 26;
  const maxV = niceMax(Math.max(1, ...data.map(d => d.value), planValue || 0));
  const iw = W - L - R, ih = H - T - B;
  const bw = Math.min(24, iw / data.length * 0.62);
  const x = i => L + iw / data.length * (i + 0.5);
  const y = v => T + ih - (v / maxV) * ih;
  const ticks = [0, maxV / 2, maxV];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wykres kolumnowy">`;
  ticks.forEach(t => { s += `<line class="gridl" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${fmt(t, t < 10 && t % 1 ? 1 : 0)}</text>`; });
  data.forEach((d, i) => {
    const h = Math.max(0, ih - (y(d.value) - T));
    const bx = x(i) - bw / 2, by = y(d.value);
    if (d.value > 0) s += `<path d="M${bx},${T + ih} V${by + 4} Q${bx},${by} ${bx + 4},${by} H${bx + bw - 4} Q${bx + bw},${by} ${bx + bw},${by + 4} V${T + ih} Z" fill="var(${d.color || color})"/>`;
    s += `<rect x="${x(i) - iw / data.length / 2}" y="${T}" width="${iw / data.length}" height="${ih}" fill="transparent" data-tip="${esc(d.tip || (d.label + ': ' + valueFmt(d.value)))}"/>`;
    if (data.length <= 16 && (i % Math.ceil(data.length / 13) === 0)) s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(d.label)}</text>`;
  });
  s += `<line class="base" x1="${L}" x2="${W - R}" y1="${T + ih}" y2="${T + ih}"/>`;
  if (planValue != null && planValue > 0) {
    s += `<line x1="${L}" x2="${W - R}" y1="${y(planValue)}" y2="${y(planValue)}" stroke="var(--ink-2)" stroke-width="2"/>`;
    s += `<text class="lbl" x="${W - R}" y="${y(planValue) - 5}" text-anchor="end">${esc(planLabel)}: ${valueFmt(planValue)}</text>`;
  }
  return `<div class="chart">${s}</svg></div>`;
}
/* grupowane kolumny plan vs wykonanie dla M1..M3 */
function planActualChart(groups, { height = 180 } = {}) {
  const W = 640, H = height, L = 34, R = 10, T = 14, B = 26;
  const maxV = niceMax(Math.max(1, ...groups.flatMap(g => [g.plan, g.actual])));
  const iw = W - L - R, ih = H - T - B, gw = iw / groups.length, bw = Math.min(24, gw * 0.28);
  const y = v => T + ih - (v / maxV) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Plan a wykonanie">`;
  [0, maxV / 2, maxV].forEach(t => { s += `<line class="gridl" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${fmt(t, t % 1 ? 1 : 0)}</text>`; });
  const bar = (bx, v, col) => v > 0 ? `<path d="M${bx},${T + ih} V${y(v) + Math.min(4, ih - (y(v) - T))} Q${bx},${y(v)} ${bx + 4},${y(v)} H${bx + bw - 4} Q${bx + bw},${y(v)} ${bx + bw},${y(v) + 4} V${T + ih} Z" fill="var(${col})"/>` : '';
  groups.forEach((g, i) => {
    const cx = L + gw * (i + 0.5);
    s += bar(cx - bw - 1, g.plan, '--plan') + bar(cx + 1, g.actual, '--s1');
    s += `<text class="val" x="${cx - bw / 2 - 1}" y="${y(g.plan) - 4}" text-anchor="middle">${fmt(g.plan, g.plan < 10 ? 1 : 0)}</text>`;
    s += `<text class="val" x="${cx + bw / 2 + 1}" y="${y(g.actual) - 4}" text-anchor="middle">${fmt(g.actual)}</text>`;
    s += `<rect x="${cx - gw / 2}" y="${T}" width="${gw}" height="${ih}" fill="transparent" data-tip="${esc(g.label + ' – plan: ' + fmt(g.plan, 1) + ', wykonanie: ' + fmt(g.actual))}"/>`;
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(g.label)}</text>`;
  });
  s += `<line class="base" x1="${L}" x2="${W - R}" y1="${T + ih}" y2="${T + ih}"/></svg>`;
  return `<div class="chart">${s}</div><div class="legend"><span><i style="background:var(--plan)"></i>Plan</span><span><i style="background:var(--s1)"></i>Wykonanie</span></div>`;
}
function inlineBar(value, max, planMark = null, color = '--s1') {
  const w = max > 0 ? clamp(value / max * 100, 0, 100) : 0;
  const pm = planMark != null && max > 0 ? `<b style="left:${clamp(planMark / max * 100, 0, 100)}%"></b>` : '';
  return `<div class="track"><i style="width:${w}%;background:var(${color})"></i>${pm}</div>`;
}

/* tooltip dla [data-tip] */
let tipEl = null;
document.addEventListener('pointermove', e => {

  if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'tip'; document.body.appendChild(tipEl); }

});

function adsRows(a, b) { return Object.values(D().ads || {}).filter(x => inRange(x.date, a, b)); }

function viewDashboard() {
  if (isLoading()) return `<div class="skeleton">Wczytywanie danych zespołu…</div>`;
  const plan = activePlan();
  const conv = (plan.conv && plan.conv.length === NS - 1) ? plan.conv : DEFAULT_CONV;
  const all = leadsArr();
  const leads = filterLeads(all);
  const [a, b, plabel] = periodRange(S.f.period, plan);
  const isAll = S.f.period === 'all';
  const days = isAll ? null : Math.max(1, daysBetween(a, b));
  const cohort = leads.filter(l => inRange(l.createdAt, a, b));
  const won = leads.filter(l => inRange(stageDatesOf(l).umowa, a, b)).length;
  const fr = cohort.filter(l => modelOf(l) === 'franczyza').length, sp = cohort.length - fr;
  const fun = funnelOf(cohort);
  const overallAct = fun.reached[0] > 0 ? fun.reached[NS - 1] / fun.reached[0] : null;
  const fastCall = cohort.filter(l => l.firstCallAt && daysBetween(parseD(l.createdAt), parseD(l.firstCallAt)) <= 1).length;
  const called = cohort.filter(l => l.firstCallAt).length;
  const pres = leads.filter(l => inRange(l.presentationAt, a, b)).length;
  const ads = adsRows(a, b);
  const adsCost = sum(ads, x => x.cost), adsConv = sum(ads, x => x.conversions);
  const gLeads = cohort.filter(l => l.source === 'google').length;
  const last60 = all.filter(l => inRange(l.createdAt, addDays(new Date(), -60), addDays(new Date(), 1))).length / 2;
  const fc = forecast(plan, leads, last60);
  const head = `<div class="viewhead"><div class="grow"><span class="eyebrow">Widok centrali</span><h1>Pozyskiwanie franczyzobiorców</h1>
    <p>Cel: <b>${fmt(goal(), 1)} nowych punktów miesięcznie</b> · okres: ${esc(plabel)}</p></div>
    <div class="actions"><button class="btn" data-act="export-xlsx">${ICONS.down}Eksport XLSX</button><button class="btn primary" data-act="lead-new">${ICONS.plus}Dodaj lead</button></div></div>`;
  if (!all.length) return head + emptyLeadsState() + adsCard(a, b, plabel, 0);

  const kpis = `<div class="kpis">
    ${kpi('Nowe leady', fmt(cohort.length), `franczyza ${fr} · Ship Point ${sp}`)}
    ${kpi('Pierwsza rozmowa do 24 h', cohort.length ? pct(fastCall / cohort.length) : '—', `rozmowy: ${called} z ${cohort.length}`, cohort.length ? fastCall / cohort.length : null)}
    ${kpi('Wysłane prezentacje', fmt(pres), plabel)}
    ${kpi('Konwersja lead → umowa', overallAct == null ? '—' : pct(overallAct, 1), `kohorta ${fmt(fun.reached[0])} leadów`)}
    ${kpi('Nowe punkty (umowy)', fmt(won), isAll ? `cel: ${fmt(goal(), 1)} / mies.` : `cel na okres: ${fmt(goal() * days / 30, 1)}`, !isAll && goal() > 0 ? won / (goal() * days / 30) : null, true)}
    ${kpi('Google Ads – koszt leada', ads.length && gLeads ? zl(adsCost / gLeads) : '—', ads.length ? `wydano ${zl(adsCost)} · ${gLeads} leadów z Google` : 'nie podłączono Google Ads')}
  </div>`;

  const maxR = Math.max(1, fun.reached[0]);
  const funnel = `<div class="card"><div class="cardhead"><h2>Lejek i konwersja między etapami</h2><p>Leady pozyskane: ${esc(plabel)}</p></div>
    <div class="funnel">${STAGES.map((s, i) => {
      const r = fun.reached[i]; const w = r / maxR * 100;
      const cv = i > 0 ? fun.conv[i - 1] : null;
      return `<div class="frow" data-tip="${esc(s.n + ': ' + r + ' leadów' + (cv != null ? ' · konwersja z poprzedniego etapu ' + pct(cv) : ''))}">
        <span class="fl">${esc(s.n)}</span>
        <div class="ftrack"><div class="fbar ${i === NS - 1 ? 'won' : ''}" style="width:${w}%"></div><span class="fnum" style="${w > 82 ? `right:calc(${100 - w}% + 8px);color:#fff` : `left:calc(${w}% + 6px)`}">${fmt(r)}</span></div>
        <span class="fconv">${i === 0 ? '<span class="muted">100%</span>' : `<b>${cv == null ? '—' : pct(cv)}</b>`}</span></div>`;
    }).join('')}</div>
    <p class="note" style="margin-top:8px">Etapy ustawiają się same: zapis pierwszej rozmowy, wysłanie prezentacji, odbyte spotkanie i status „Pozyskany”. Procent to odsetek leadów z poprzedniego etapu, które doszły dalej.</p></div>`;

  const t = todayISO(), tomorrow = isoDate(addDays(new Date(), 1));
  const open = leads.filter(isOpen);
  const al = [];
  const noContact = open.filter(l => !l.firstCallAt && l.status === 'do_kontaktu' && l.createdTs && (Date.now() - new Date(l.createdTs)) > 864e5);
  if (noContact.length) al.push(['bad', `${noContact.length} nowych leadów czeka na pierwszą rozmowę dłużej niż 24 h`, noContact]);
  const overdue = open.filter(l => l.nextTaskDate && l.nextTaskDate < t);
  if (overdue.length) al.push(['bad', `${overdue.length} leadów ma zaległy kontakt`, overdue]);
  const noOwner = open.filter(l => !l.ownerId);
  if (noOwner.length) al.push(['warn', `${noOwner.length} aktywnych leadów nie ma opiekuna`, noOwner]);
  const noNext = open.filter(l => l.firstCallAt && !l.nextTaskDate);
  if (noNext.length) al.push(['warn', `${noNext.length} leadów po rozmowie nie ma zaplanowanego kolejnego kontaktu`, noNext]);
  const noTraining = leads.filter(l => isWon(l) && !l.trainingStart);
  if (noTraining.length) al.push(['warn', `${noTraining.length} podpisanych umów bez zaplanowanego szkolenia w centrali`, noTraining]);
  const presNoFollow = open.filter(l => l.presentationAt && daysBetween(parseD(l.presentationAt), new Date()) > 5 && (lastContact(l) || '').slice(0, 10) <= l.presentationAt);
  if (presNoFollow.length) al.push(['warn', `${presNoFollow.length} kandydatów dostało prezentację ponad 5 dni temu i nie było telefonu`, presNoFollow]);
  const meetSoon = open.filter(l => l.meetingAt && (l.meetingAt.slice(0, 10) === t || l.meetingAt.slice(0, 10) === tomorrow));
  if (meetSoon.length) al.push(['info', `Spotkania dziś i jutro: ${meetSoon.map(l => esc(l.name) + ' (' + fdt(l.meetingAt) + ')').join(', ')}`, meetSoon]);
  const pendingSms = Object.values(D().sms || {}).filter(x => x.status === 'oczekuje').length;
  if (pendingSms) al.push(['info', `${pendingSms} SMS czeka w kolejce na wysłanie`, []]);
  S.ui.alertLists = al.map(x => x[2].map(l => l.id));
  const alerts = `<div class="card"><div class="cardhead"><h2>Wymaga uwagi</h2><p>${al.length ? 'Kliknij, aby zobaczyć listę' : ''}</p></div>
    ${al.length ? `<div class="alerts">${al.map(([k, txt, list], i) => `<div class="alert ${k}"><span class="ic">${k === 'info' ? 'i' : '!'}</span><div>${list.length ? `<a data-act="alert-list" data-i="${i}">${txt}</a>` : `<a href="#kontakty">${txt}</a>`}</div></div>`).join('')}</div>` : `<p class="muted">Wszystkie leady mają opiekuna, zaplanowany kontakt i świeżą rozmowę.</p>`}</div>`;

  const wk0 = mondayOf(new Date());
  const weeks = Array.from({ length: 13 }, (_, i) => addDays(wk0, (i - 12) * 7));
  const wdata = weeks.map(w => { const ls = leads.filter(l => inRange(l.createdAt, w, addDays(w, 7))); const f = ls.filter(l => modelOf(l) === 'franczyza').length; return { label: fdateShort(isoDate(w)), value: ls.length, tip: `Tydzień od ${fdate(isoDate(w))}: ${ls.length} leadów (franczyza ${f}, Ship Point ${ls.length - f})` }; });
  const weekly = `<div class="card"><div class="cardhead"><h2>Nowe leady tygodniowo</h2><p>Ostatnie 13 tygodni</p></div>${columnChart(wdata, { valueFmt: v => fmt(v) })}</div>`;

  const fmax = Math.max(1, ...fc.total, goal());
  const fcCard = `<div class="card"><div class="cardhead"><h2>Prognoza nowych punktów</h2><p>Otwarte leady × szansa z etapu + napływ ${fmt(last60)} leadów / mies.</p></div>
    <div class="subbars">${['0–30 dni', '31–60 dni', '61–90 dni'].map((lab, i) => `<div class="subbar" data-tip="${esc(lab + ': z obecnych leadów ' + fmt(fc.pipeline[i], 1) + ', z nowych ' + fmt(fc.fromNew[i], 1))}"><span class="small">${lab}</span><div class="track" style="display:flex;gap:2px;background:transparent"><i style="width:${fc.pipeline[i] / fmax * 100}%;background:var(--s1)"></i><i style="width:${fc.fromNew[i] / fmax * 100}%;background:var(--s2)"></i></div><span class="small num"><b>${fmt(fc.total[i], 1)}</b></span></div>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--s1)"></i>Z obecnych leadów</span><span><i style="background:var(--s2)"></i>Z nowych leadów</span></div>
    <div class="sep"></div>
    <div class="tablewrap"><table class="t"><thead><tr><th>Etap</th><th class="r">Otwarte leady</th><th class="r">Szansa na umowę</th><th class="r">Oczekiwane punkty</th></tr></thead><tbody>
    ${STAGES.slice(0, -1).map((s, i) => `<tr><td>${esc(s.n)}</td><td class="r">${fc.pipeByStage[i].n}</td><td class="r muted">${pct(winProbFrom(i, conv), 1)}</td><td class="r">${fmt(fc.pipeByStage[i].exp, 1)}</td></tr>`).join('')}
    </tbody></table></div><p class="note" style="margin-top:6px">Szanse z etapów to założenia (konwersje i cykl ok. ${fmt(plan.cycleDays || 60)} dni) – po zebraniu danych można je zastąpić rzeczywistymi.</p></div>`;

  const srcRows = SOURCES.map((s, i) => {
    const inP = leads.filter(l => l.source === s.k && inRange(l.createdAt, a, b));
    const w = leads.filter(l => l.source === s.k && inRange(stageDatesOf(l).umowa, a, b)).length;
    const cost = s.k === 'google' && ads.length ? adsCost : null;
    return { s, i, leads: inP.length, calls: inP.filter(l => l.firstCallAt).length, meet: inP.filter(l => stageIdx(l) >= 3).length, won: w, cost, cpl: cost != null && inP.length ? cost / inP.length : null };
  }).filter(r => r.leads || r.won);
  const maxSrc = Math.max(1, ...srcRows.map(r => r.leads));
  const sources = `<div class="card"><div class="cardhead"><h2>Źródła leadów</h2><p>${esc(plabel)}</p></div>
    ${srcRows.length ? `<div class="tablewrap"><table class="t"><thead><tr><th>Źródło</th><th>Leady</th><th class="r">Rozmowy</th><th class="r">Spotkania</th><th class="r">Umowy</th><th class="r">Koszt</th><th class="r">Koszt leada</th></tr></thead><tbody>
    ${srcRows.sort((x, y) => y.leads - x.leads).map(r => `<tr class="click" data-act="filter-source" data-k="${r.s.k}"><td>${sourcePill(r.s.k)}</td><td><div class="bar-inline">${inlineBar(r.leads, maxSrc, null, SERIES[r.i % 8])}<span class="num small">${r.leads}</span></div></td><td class="r">${r.calls}</td><td class="r">${r.meet}</td><td class="r">${r.won}</td><td class="r">${r.cost != null ? zl(r.cost) : '—'}</td><td class="r">${zl(r.cpl)}</td></tr>`).join('')}
    </tbody></table></div><p class="note" style="margin-top:8px">Kliknij źródło, aby przefiltrować widok. Koszt pokazuje się dla Google Ads po podłączeniu kampanii.</p>` : `<p class="muted">Brak leadów w wybranym okresie.</p>`}</div>`;

  const owners = [...team(), { id: '', name: 'Bez opiekuna' }].map(m => {
    const ls = leads.filter(l => (l.ownerId || '') === m.id);
    const op = ls.filter(isOpen);
    return { m, total: ls.length, open: op.length, overdue: op.filter(l => l.nextTaskDate && l.nextTaskDate < t).length, today: op.filter(l => l.nextTaskDate === t).length,
      pres: ls.filter(l => inRange(l.presentationAt, a, b)).length, won: ls.filter(l => inRange(stageDatesOf(l).umowa, a, b)).length,
      stale: op.filter(l => { const lc = lastContact(l) || l.createdAt; return lc && daysBetween(parseD(lc), new Date()) > 7; }).length };
  }).filter(r => r.total);
  const ownersCard = `<div class="card"><div class="cardhead"><h2>Opiekunowie</h2><p>Obciążenie i wyniki</p></div>
    ${owners.length ? `<div class="tablewrap"><table class="t"><thead><tr><th>Opiekun</th><th class="r">Aktywne</th><th class="r">Na dziś</th><th class="r">Zaległe</th><th class="r">Bez kontaktu 7+ dni</th><th class="r">Prezentacje</th><th class="r">Umowy</th></tr></thead><tbody>
    ${owners.map(r => `<tr class="click" data-act="filter-owner" data-k="${r.m.id || '_none'}"><td>${esc(r.m.name)}</td><td class="r">${r.open}</td><td class="r ${r.today ? 'today' : ''}">${r.today}</td><td class="r ${r.overdue ? 'overdue' : ''}">${r.overdue}</td><td class="r">${r.stale}</td><td class="r">${r.pres}</td><td class="r"><b>${r.won}</b></td></tr>`).join('')}
    </tbody></table></div>` : `<p class="muted">Dodaj osoby w zakładce „Zespół i ustawienia” i przypisz im leady.</p>`}</div>`;

  const regs = REGIONS.map(r => ({ r, n: cohort.filter(l => l.region === r).length, w: leads.filter(l => l.region === r && inRange(stageDatesOf(l).umowa, a, b)).length })).filter(x => x.n || x.w).sort((x, y) => y.n - x.n);
  const maxReg = Math.max(1, ...regs.map(x => x.n));
  const regionsCard = `<div class="card"><div class="cardhead"><h2>Regiony</h2><p>Leady i umowy</p></div>
    ${regs.length ? `<div class="subbars">${regs.slice(0, 10).map(x => `<div class="subbar" data-tip="${esc(x.r + ': ' + x.n + ' leadów, ' + x.w + ' umów')}"><span class="small">${esc(x.r)}</span><div class="track"><i style="width:${x.n / maxReg * 100}%"></i></div><span class="small num r">${x.n}${x.w ? ` · <b>${x.w}</b>` : ''}</span></div>`).join('')}</div>` : `<p class="muted">Uzupełnij województwa w leadach, aby zobaczyć rozkład.</p>`}</div>`;

  return head + filterBar() + kpis + `<div class="grid2">${funnel}${alerts}</div><div style="height:16px"></div>` +
    `<div class="grid2">${adsCard(a, b, plabel, gLeads, leads)}${fcCard}</div><div style="height:16px"></div>${sources}<div style="height:16px"></div><div class="grid2">${weekly}${ownersCard}</div><div style="height:16px"></div>${regionsCard}`;
}

function adsCard(a, b, plabel, gLeads, leads = []) {
  const rows = adsRows(a, b).sort((x, y) => (x.date || '').localeCompare(y.date || ''));
  if (!rows.length) {
    return `<div class="card"><div class="cardhead"><h2>Google Ads – kampania franczyza</h2><span class="pill">nie podłączono</span></div>
      <p class="ink2 small">Po podłączeniu zobaczysz tu codziennie: wydatki kampanii, kliknięcia, konwersje z Google Ads oraz rzeczywisty koszt leada i koszt pozyskania punktu (wydatki ÷ leady z Google w panelu).</p>
      <div class="row" style="margin-top:10px"><a class="btn sm" href="#ustawienia">Jak podłączyć</a></div></div>`;
  }
  const cost = sum(rows, x => x.cost), clicks = sum(rows, x => x.clicks), convs = sum(rows, x => x.conversions), impr = sum(rows, x => x.impressions);
  const won = leads.filter(l => l.source === 'google' && inRange(stageDatesOf(l).umowa, a, b)).length;
  const data = rows.slice(-30).map(x => ({ label: fdateShort(x.date), value: +x.cost || 0, tip: `${fdate(x.date)}: ${zl(x.cost)} · ${x.clicks || 0} kliknięć · ${fmt(x.conversions || 0, 1)} konwersji` }));
  return `<div class="card"><div class="cardhead"><h2>Google Ads – kampania franczyza</h2><p>${esc(plabel)}</p></div>
    <div class="grid2" style="gap:10px">
      <div><span class="eyebrow">Wydatki</span><div class="bigout">${zl(cost)}</div><span class="small ink2">${fmt(clicks)} kliknięć · CPC ${zl(clicks ? cost / clicks : null, 2)}</span></div>
      <div><span class="eyebrow">Konwersje Google</span><div class="bigout">${fmt(convs, 1)}</div><span class="small ink2">koszt konwersji ${zl(convs ? cost / convs : null)}</span></div>
    </div>
    <div class="sep"></div>
    <div class="statline"><span>Leady z Google w panelu</span><b>${gLeads}</b></div>
    <div class="statline"><span>Koszt leada (wg panelu)</span><b>${zl(gLeads ? cost / gLeads : null)}</b></div>
    <div class="statline"><span>Umowy z Google</span><b>${won}</b></div>
    <div class="statline"><span>Koszt pozyskania punktu</span><b>${zl(won ? cost / won : null)}</b></div>
    ${columnChart(data, { height: 140, valueFmt: v => zl(v) })}
    <p class="note">Wyświetlenia: ${fmt(impr)} · dane z ${fdate(rows[rows.length - 1].date)}.</p></div>`;
}

function kpi(label, value, sub, ratio = null, hl = false) {
  const meter = ratio != null && isFinite(ratio) ? `<div class="meter"><i style="width:${clamp(ratio * 100, 0, 100)}%;background:var(${ratio >= 1 ? '--good' : ratio >= 0.75 ? '--s1' : '--s2'})"></i></div>` : '';
  return `<div class="kpi ${hl ? 'hl' : ''}"><span class="label">${esc(label)}</span><span class="value">${value}</span><span class="sub">${sub}</span>${meter}</div>`;
}

/* ===== Leady: lista, kanban, formularz, widok pojedynczego leada ===== */

const LEAD_COLS = [
  { k: 'code', n: 'Kod', get: l => leadCode(l.id) },
  { k: 'name', n: 'Kandydat', get: l => (l.name || '').toLowerCase() },
  { k: 'city', n: 'Miasto / region', get: l => (l.city || '').toLowerCase() },
  { k: 'model', n: 'Model', get: l => modelOf(l) },
  { k: 'stage', n: 'Etap', get: l => stageIdx(l) },
  { k: 'status', n: 'Status', get: l => l.status },
  { k: 'mail', n: 'E-mail', nosort: true },
  { k: 'nextTaskDate', n: 'Następne zadanie', get: l => l.nextTaskDate || '9999' },
  { k: 'meetingAt', n: 'Spotkanie', get: l => l.meetingAt || '9999' },
  { k: 'last', n: 'Ostatni kontakt', get: l => lastContact(l) || '' },
  { k: 'createdAt', n: 'Dodano', get: l => l.createdTs || l.createdAt || '' }
];

function sortedLeads(arr) {
  const c = LEAD_COLS.find(x => x.k === S.sort.key) || LEAD_COLS[LEAD_COLS.length - 1];
  const dir = S.sort.dir === 'asc' ? 1 : -1;
  return arr.slice().sort((a, b) => { const x = c.get(a), y = c.get(b); return (x > y ? 1 : x < y ? -1 : 0) * dir; });
}

function viewLeads() {
  if (isLoading()) return `<div class="skeleton">Wczytywanie leadów…</div>`;
  const all = leadsArr();
  const list = sortedLeads(filterLeads(all));
  S.ui.visibleLeadIds = list.map(l => l.id);
  const head = `<div class="viewhead"><div class="grow"><span class="eyebrow">Baza kandydatów</span><h1>Leady</h1>
    <p>${fmt(list.length)} z ${fmt(all.length)} leadów${filtersActive() ? ' (filtr aktywny)' : ''} · aktywnych: ${fmt(list.filter(isOpen).length)}</p></div>
    <div class="actions">
      <div class="tabs" role="tablist"><button class="${S.leadsView === 'tabela' ? 'on' : ''}" data-act="leads-view" data-v="tabela">Tabela</button><button class="${S.leadsView === 'kanban' ? 'on' : ''}" data-act="leads-view" data-v="kanban">Lejek (kanban)</button></div>
      <button class="btn" data-act="import-open">${ICONS.up}Importuj</button>
      <button class="btn" data-act="export-csv" ${all.length ? '' : 'disabled'}>${ICONS.down}CSV</button>
      <button class="btn" data-act="export-xlsx-leads" ${all.length ? '' : 'disabled'}>${ICONS.down}XLSX</button>
      <button class="btn primary" data-act="lead-new">${ICONS.plus}Dodaj lead</button>
    </div></div>`;
  if (!all.length) return head + emptyLeadsState();
  const bulk = S.selected.size ? `<div class="filters" style="background:var(--accent-wash);border-color:var(--accent)">
    <b style="align-self:center">${S.selected.size} zaznaczonych</b>
    <label class="field"><span>Przypisz opiekuna</span><select id="bulk-owner">${ownerOpts('', false, '— wybierz —')}</select></label>
    <label class="field"><span>Zmień status</span><select id="bulk-status">${opt('', '— wybierz —', '')}${statusOpts('')}</select></label>
    <button class="btn primary" data-act="bulk-apply">Zastosuj</button>
    <button class="btn danger" data-act="bulk-delete">${ICONS.trash}Usuń</button>
    <button class="btn ghost" data-act="bulk-clear">Odznacz</button></div>` : '';
  const body = S.leadsView === 'kanban' ? kanbanHTML(list) : tableHTML(list);
  return head + filterBar({ period: false }) + bulk + body;
}

function tableHTML(list) {
  if (!list.length) return `<div class="card"><div class="empty"><h3>Brak leadów dla wybranych filtrów</h3><button class="btn" data-act="filters-clear">Wyczyść filtry</button></div></div>`;
  const allSel = list.length && list.every(l => S.selected.has(l.id));
  const th = c => c.nosort ? `<th>${c.n}</th>` : `<th class="sortable" data-act="sort" data-k="${c.k}">${c.n}${S.sort.key === c.k ? (S.sort.dir === 'asc' ? ' ↑' : ' ↓') : ''}</th>`;
  return `<div class="tablewrap"><table class="t"><thead><tr><th><input type="checkbox" id="sel-all" data-act="sel-all" ${allSel ? 'checked' : ''} aria-label="Zaznacz wszystkie"></th>${LEAD_COLS.map(th).join('')}</tr></thead><tbody>
  ${list.map(l => {
    const lc = lastContact(l);
    return `<tr class="click" data-act="open-lead" data-id="${l.id}">
      <td data-stop="1"><input type="checkbox" data-act="sel" data-id="${l.id}" ${S.selected.has(l.id) ? 'checked' : ''} aria-label="Zaznacz"></td>
      <td><span class="code">${leadCode(l.id)}</span></td>
      <td><div class="cellname"><b>${esc(l.name || '(bez nazwy)')}</b><span class="tiny muted">${esc(l.company || l.phone || l.email || '')}</span></div></td>
      <td>${esc(l.city || '—')}<div class="tiny muted">${esc(l.region || '')}</div></td>
      <td>${modelPill(l)}</td>
      <td>${stageBar(l)}<div class="tiny muted">${esc(STAGES[stageIdx(l)].short)}</div></td>
      <td>${statusPill(l.status)}</td>
      <td data-stop="1"><button class="btn sm primary" style="white-space:nowrap" data-act="mail-compose" data-id="${l.id}" title="${esc(l.email ? 'Napisz do: ' + l.email : 'Brak adresu e-mail – wpiszesz go w oknie wiadomości')}">${ICONS.email}Wyślij e-mail</button></td>
      <td style="min-width:170px"><span class="small">${esc(l.nextTask || '—')}</span><div class="tiny ${dueCls(l.nextTaskDate)}">${l.nextTaskDate ? fdate(l.nextTaskDate) + (l.nextTaskTime ? ' ' + esc(l.nextTaskTime) : '') : ''}</div></td>
      <td class="small ${dueCls(l.meetingAt)}">${l.meetingAt ? fdt(l.meetingAt) : '—'}</td>
      <td class="small">${lc ? fdateShort(lc) : '<span class="muted">brak</span>'}</td>
      <td class="small muted">${fdate(l.createdAt)}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}

function kanbanHTML(list) {
  return `<p class="note" style="margin-bottom:8px">Kolumny to etapy ustawiane automatycznie: pierwsza rozmowa, prezentacja, spotkanie, umowa. Kliknij kartę, aby otworzyć leada.</p><div class="kanban">${STAGES.map((s, i) => {
    const items = list.filter(l => stageIdx(l) === i);
    return `<div class="kcol"><h3><span>${esc(s.n)}</span><span class="muted num">${items.length}</span></h3>
      ${items.map(l => `<div class="kcard" data-act="open-lead" data-id="${l.id}" style="cursor:pointer">
        <div class="row between"><b>${esc(l.name || '(bez nazwy)')}</b><span class="code">${leadCode(l.id)}</span></div>
        <span class="tiny muted">${esc([l.city, memberName(l.ownerId)].filter(Boolean).join(' · ') || '—')}</span>
        <div class="row">${modelPill(l)}${statusPill(l.status)}</div>
        ${l.nextTaskDate ? `<span class="tiny ${dueCls(l.nextTaskDate)}">${esc(l.nextTask || 'Kontakt')} · ${fdateShort(l.nextTaskDate)}</span>` : ''}
      </div>`).join('')}</div>`;
  }).join('')}</div>`;
}

/* ---------- formularz leada ---------- */
function leadFormFields(l, prefix = 'lf') {
  return `<div class="formgrid">
    <label class="field span2"><span>Imię i nazwisko *</span><input type="text" id="${prefix}-name" value="${esc(l.name)}" required></label>

    <label class="field"><span>NIP</span><input type="text" id="${prefix}-nip" data-nip-auto="${prefix}" inputmode="numeric" value="${esc(l.nip ? nipFmt(l.nip) : '')}" placeholder="np. 634-286-76-10"><span class="hint ${l.nip && !nipValid(l.nip) ? 'overdue' : ''}" id="${prefix}-nip-st">${l.nip ? (nipValid(l.nip) ? 'NIP poprawny' + (l.companyData ? ' · dane firmy pobrane' : '') : 'Błędny NIP – sprawdź cyfry') : (prefix === 'lf' ? 'Po wpisaniu NIP-u dane firmy uzupełnią się same' : '')}</span></label>

    <label class="field"><span>Źródło</span><select id="${prefix}-source">${sourceOpts(l.source)}</select></label>
    <label class="field"><span>Opiekun</span><select id="${prefix}-owner">${ownerOpts(l.ownerId)}</select></label>
    <label class="field"><span>Model współpracy (rodzaj zapytania)</span><select id="${prefix}-model">${MODELS.map(m => opt(m.k, m.n, modelOf(l))).join('')}</select></label>
    ${prefix === 'le' ? '' : `<label class="field"><span>Pakiet (franczyza)</span><select id="${prefix}-pkg">${opt('', 'jeszcze nie wiadomo', l.pkg)}${Object.entries(PACKAGES).map(([k, n]) => opt(k, n, l.pkg)).join('')}</select></label>`}
    <label class="field"><span>Kapitał deklarowany (zł)</span><input type="number" id="${prefix}-capital" min="0" step="1000" value="${esc(l.capital)}"></label>
    <label class="field"><span>Lokal</span><select id="${prefix}-premises">${opt('', 'nie wiadomo', l.hasPremises)}${opt('ma', 'ma lokal', l.hasPremises)}${opt('szuka', 'szuka lokalu', l.hasPremises)}${opt('nie', 'nie ma i nie szuka', l.hasPremises)}</select></label>
    <label class="field"><span>Forma zwrotu w wiadomościach</span><select id="${prefix}-form">${opt('panstwo', 'Państwo (neutralnie)', l.form)}${opt('pan', 'Pan', l.form)}${opt('pani', 'Pani', l.form)}${opt('ty', 'Ty (bezpośrednio)', l.form)}</select></label>
  </div>`;

function readLeadForm(prefix = 'lf') {
  const v = id => ($('#' + prefix + '-' + id) || {}).value || '';
  const out = readLeadFormAll(prefix, v);
  Object.keys(out).forEach(k => { const id = { ownerId: 'owner', hasPremises: 'premises' }[k] || k; if (!$('#' + prefix + '-' + id)) delete out[k]; });
  return out;
}
function readLeadFormAll(prefix, v) {

function openLeadModal() {
  const l = newLead({ ownerId: S.f.owner && S.f.owner !== '_none' ? S.f.owner : (myMemberId() || ''), source: S.f.source || 'google', region: S.f.region || '', model: S.f.model || 'franczyza' });

  openModal(`<div class="mh"><h2>Nowy lead</h2><button class="iconbtn" data-act="modal-close" aria-label="Zamknij">${ICONS.x}</button></div>
    <form class="mb" id="lead-form">${leadFormFields(l)}

        <label class="field full"><span>Notatka</span><textarea id="lf-notes" rows="3" placeholder="Skąd się zgłosił, czego oczekuje, pierwsze ustalenia…"></textarea></label>
      </div>
    </form>
    <div class="mf"><button class="btn" data-act="modal-close">Anuluj</button><button class="btn" id="lf-save-more">Zapisz i dodaj kolejny</button><button class="btn primary" id="lf-save">Zapisz i otwórz</button></div>`);
  const save = (openAfter) => {
    const d = readLeadForm();
    if (!d.name) { toast('Wpisz imię i nazwisko kandydata.', 'bad'); $('#lf-name').focus(); return; }
    const dup = findDuplicate(d);
    const lead = newLead({ ...d, nextTask: $('#lf-task').value.trim(), nextTaskDate: $('#lf-taskdate').value, notes: $('#lf-notes').value.trim() });
    const pc = REG.pending.lf;
    if (pc && d.nip && nipDigits(pc.nip) === d.nip) lead.companyData = pc;
    REG.pending.lf = null;
    lead.history = [histEntry('system', 'Lead dodany ręcznie' + (d.ownerId ? ' · opiekun: ' + memberName(d.ownerId) : ''))];
    put('leads', lead.id, lead);
    toast(dup ? `Zapisano. Uwaga: podobny lead już istnieje (${dup.name}).` : 'Lead zapisany');
    if (openAfter) { closeModal(); go('lead-' + lead.id); } else { closeModal(); openLeadModal(); }
  };
  $('#lf-save').onclick = () => save(true);
  $('#lf-save-more').onclick = () => save(false);
  $('#lead-form').onsubmit = e => { e.preventDefault(); save(true); };
}
const normPhone = p => String(p || '').replace(/\D/g, '').replace(/^48(?=\d{9}$)/, '');
function findDuplicate(d, pool = leadsArr()) {
  const e = (d.email || '').toLowerCase().trim(), p = normPhone(d.phone);
  return pool.find(l => (e && (l.email || '').toLowerCase().trim() === e) || (p && p.length >= 9 && normPhone(l.phone) === p));
}

function suggestedTemplate(l) {
  const i = stageIdx(l);
  if (modelOf(l) === 'shippoint') return ['email_partner', 'email_prezentacja', 'skrypt_pierwsza'];
  if (l.status === 'wstrzymany' || l.status === 'utracony') return ['email_reaktywacja', 'skrypt_obiekcje'];
  if (l.status === 'proba') return ['sms_pierwszy', 'email_followup', 'email_ostatni'];
  return [
    ['email_pierwszy', 'skrypt_pierwsza', 'email_prezentacja'],
    ['email_prezentacja', 'email_kalkulator', 'skrypt_obiekcje'],
    ['email_zaproszenie', 'skrypt_prezentacja', 'skrypt_obiekcje'],
    ['email_podsumowanie', 'email_oferta', 'skrypt_domkniecie'],
    ['email_powitanie']
  ][i];
}

/* zapis pól leada (na change) */
function saveLeadField(el) {
  const id = S.route.id; const l = D().leads[id]; if (!l) return;
  const f = el.getAttribute('data-lead-field');
  let v = el.value;
  if (f && l[f] === v) return;
  const p = { [f]: v, updatedTs: new Date().toISOString() };
  if (f === 'status') {
    const hist = (l.history || []).slice();
    hist.push(histEntry('system', `Status: ${STATUS_MAP[l.status]?.n || '—'} → ${STATUS_MAP[v]?.n}`));
    p.history = hist;
    if (v === 'pozyskany') { setWon(l); return; }
    if (l.status === 'pozyskany' || (l.stageDates || {}).umowa) { const sd = { ...(l.stageDates || {}) }; delete sd.umowa; p.stageDates = sd; p.contractSignedAt = ''; }
  }
  if (f === 'meetingType' && v === 'online' && !l.meetingPlace && meetLinkFor(l)) p.meetingPlace = meetLinkFor(l);
  if (f === 'ownerId' && l.ownerId !== v) {
    const hist = (l.history || []).slice();
    hist.push(histEntry('system', `Opiekun: ${memberName(l.ownerId) || 'brak'} → ${memberName(v) || 'brak'}`));
    p.history = hist;
  }

function parseWhiteList(text) {
  let j;
  try { j = JSON.parse(text); } catch (e) { const m = String(text).match(/\{[\s\S]*\}/); if (!m) return null; try { j = JSON.parse(m[0]); } catch (e2) { return null; } }
  const sub = j && j.result && (j.result.subject || (j.result.subjects || [])[0]);
  if (sub) return { name: sub.name || '', address: sub.workingAddress || sub.residenceAddress || '', nip: sub.nip || '', regon: sub.regon || '', krs: sub.krs || '', statusVat: sub.statusVat || '', registrationLegalDate: sub.registrationLegalDate || '', at: todayISO(), source: 'Biała lista VAT' };
  const od = j && j.odpis;
  if (od && od.dane) {
    const d1 = od.dane.dzial1 || {}, dp = d1.danePodmiotu || {}, ad = (d1.siedzibaIAdres || {}).adres || {};
    const addr = [[ad.ulica, ad.nrDomu].filter(Boolean).join(' ') + (ad.nrLokalu ? '/' + ad.nrLokalu : ''), [ad.kodPocztowy, ad.miejscowosc].filter(Boolean).join(' ')].filter(x => x && x.trim()).join(', ');
    return { name: dp.nazwa || '', address: addr, nip: (dp.identyfikatory || {}).nip || '', regon: String((dp.identyfikatory || {}).regon || '').replace(/0{5}$/, ''), krs: (od.naglowekA || {}).numerKRS || '', form: dp.formaPrawna || '', ...krsDetails(od), at: todayISO(), source: 'KRS' };
  }
  return null;
}
async function extractCompanyWithClaude(text) {
  if (!S.sample) return null;
  const prompt = `Z poniższego tekstu skopiowanego ze strony rejestru firm (CEIDG, KRS, REGON lub Biała lista VAT) wyciągnij dane jednej firmy. Zwróć wyłącznie JSON: {"name": "nazwa firmy", "address": "adres siedziby lub stałego miejsca wykonywania działalności (ulica nr, kod miejscowość)", "nip": "10 cyfr", "regon": "", "krs": "", "form": "forma prawna, np. jednoosobowa działalność gospodarcza, spółka z o.o.", "status": "status działalności, np. aktywny, zawieszony, wykreślony", "startDate": "data rozpoczęcia działalności RRRR-MM-DD", "pkd": "przeważające PKD z opisem", "owner": "imię i nazwisko właściciela (tylko jednoosobowa działalność)", "phone": "telefon firmy, jeśli podany", "email": "e-mail firmy, jeśli podany", "www": "", "registry": "CEIDG | KRS | REGON | Biała lista"}. Puste pola zostaw jako "". Nie zgaduj danych, których nie ma w tekście.

Tekst:
${String(text).slice(0, 12000)}`;
  const r = await S.sample.json(prompt, { modelTier: 'quick' });

}
async function onNipPaste(el, text) {
  const id = el.dataset.nipPaste; const l = D().leads[id]; if (!l) return;

/* województwo i kod pocztowy – uzupełniane same po wpisaniu miejscowości / adresu / kodu */
const POSTAL_REGION = [[0, 9, 'mazowieckie'], [10, 14, 'warmińsko-mazurskie'], [15, 18, 'podlaskie'], [19, 19, 'warmińsko-mazurskie'], [20, 24, 'lubelskie'], [25, 29, 'świętokrzyskie'], [30, 34, 'małopolskie'], [35, 39, 'podkarpackie'], [40, 44, 'śląskie'], [45, 49, 'opolskie'], [50, 59, 'dolnośląskie'], [60, 64, 'wielkopolskie'], [65, 69, 'lubuskie'], [70, 78, 'zachodniopomorskie'], [80, 84, 'pomorskie'], [85, 89, 'kujawsko-pomorskie'], [90, 99, 'łódzkie']];
function regionFromPostal(pc) {
  const m = String(pc || '').match(/^(\d{2})-?\d{3}$/); if (!m) return '';
  const n = +m[1]; const r = POSTAL_REGION.find(([a, b]) => n >= a && n <= b); return r ? r[2] : '';
}
const GEO = { seq: {} };
async function autoGeo(prefix) {
  const g = id => $('#' + prefix + '-' + id);
  const city = (g('city') || {}).value || '', addr = (g('pointAddress') || {}).value || '';
  const pcEl = g('pointPostal'), regEl = g('region'); if (!regEl) return;
  let pc = (pcEl && pcEl.value || '').trim();
  if (/^\d{5}$/.test(pc)) { pc = pc.slice(0, 2) + '-' + pc.slice(2); pcEl.value = pc; }
  const say = (t, cls = '') => { const el = g('geo-st'); if (el) { el.className = 'hint ' + cls; el.textContent = t; } };
  const manual = regEl.value && (prefix === 'le' ? !!(D().leads[S.route.id] || {}).regionManual : (regEl.dataset.auto !== '1' && regEl.dataset.touched === '1'));
  if (manual || (!city.trim() && !/^\d{2}-\d{3}$/.test(pc))) return;
  const set = (reg, newPc, note) => {
    let changed = false;
    if (reg && REGIONS.includes(reg) && regEl.value !== reg) { regEl.value = reg; regEl.dataset.auto = '1'; changed = true; }
    if (newPc && pcEl && !pcEl.value.trim()) { pcEl.value = newPc; changed = true; }
    say(note, 'good');
    if (changed && prefix === 'le') saveLeadEdit();
  };
  const seq = (GEO.seq[prefix] || 0) + 1; GEO.seq[prefix] = seq;
  if (S.sample && city.trim()) {
    say('Ustalam województwo…');
    try {
      const r = await S.sample.json(`Polski adres: ${[addr.trim(), [pc, city.trim()].filter(Boolean).join(' ')].filter(Boolean).join(', ')}. Zwróć wyłącznie JSON: {"region": "województwo małymi literami, np. śląskie", "postalCode": "kod pocztowy 00-000 dla tej ulicy i numeru w tej miejscowości (najbardziej prawdopodobny, gdy nie masz pewności)", "city": "poprawna nazwa miejscowości"}. Uwzględnij podany kod pocztowy, jeśli jest.`, { modelTier: 'quick' });
      if (GEO.seq[prefix] !== seq) return;
      const reg = String((r && r.region) || '').toLowerCase().replace('województwo', '').trim();
      const rpc = (String((r && r.postalCode) || '').match(/\d{2}-\d{3}/) || [])[0] || '';
      if (REGIONS.includes(reg)) { set(reg, rpc, `Uzupełniono automatycznie: ${reg}${rpc && !pc ? ', kod ' + rpc + ' (sprawdź)' : ''}`); return; }
    } catch (e) { /* brak zgody / limit – zostaje szacunek z kodu */ }
  }
  if (GEO.seq[prefix] !== seq) return;
  const guess = regionFromPostal(pc);
  if (guess) set(guess, '', `Z kodu pocztowego: ${guess}`);
  else if (city.trim()) say('Wybierz województwo ręcznie (lub wpisz kod pocztowy).');
}

async function shrinkImage(file, max = 2000) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 2.5 * 1024 * 1024) return file;
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', 0.85));
  } catch (e) { return file; }
}
async function uploadPhotos(leadId, files) {
  if (!S.assets) { toast('Dodawanie zdjęć jest niedostępne w tym widoku.', 'bad'); return; }
  const list = [...files].filter(f => f.type.startsWith('image/'));
  if (!list.length) return;
  toast(`Wysyłam zdjęcia (${list.length})…`);
  const added = [];
  for (const f of list) {
    try {
      const blob = await shrinkImage(f);
      const r = await S.assets.upload(blob);
      added.push({ id: r.id, name: f.name, at: new Date().toISOString(), by: myMemberId() || '' });
    } catch (e) { toast('Nie udało się dodać ' + f.name + ': ' + ((e && (e.message || e.code)) || 'błąd'), 'bad'); }
  }
  const cur = D().leads[leadId]; if (!cur || !added.length) return;
  patch('leads', leadId, { photos: [...(cur.photos || []), ...added], updatedTs: new Date().toISOString() });
  toast(`Dodano zdjęcia: ${added.length}`);
}
function openPhoto(l, i) {

/* ===== Kontakty: przypomnienia o kolejnych kontaktach, rozmowy, SMS po rozmowie ===== */

const PL_MAP = { ą: 'a', ć: 'c', ę: 'e', ł: 'l', ń: 'n', ó: 'o', ś: 's', ź: 'z', ż: 'z', Ą: 'A', Ć: 'C', Ę: 'E', Ł: 'L', Ń: 'N', Ó: 'O', Ś: 'S', Ź: 'Z', Ż: 'Z' };
const stripPL = t => String(t || '').replace(/[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g, c => PL_MAP[c]).replace(/[„”]/g, '"').replace(/[–—]/g, '-');
const GSM_RE = /^[A-Za-z0-9 \r\n@£$¥èéùìòÇØøÅå_ΦΓΛΩΠΨΣΘΞÆæßÉ!"#%&'()*+,\-./:;<=>?¡ÄÖÑÜ§¿äöñüà^{}\[\]~|€\\]*$/;
function smsInfo(text) {
  const gsm = GSM_RE.test(text);
  const len = [...text].length;
  const per = gsm ? (len > 160 ? 153 : 160) : (len > 70 ? 67 : 70);
  return { gsm, len, parts: Math.max(1, Math.ceil(len / per)) };
}
function smsThanksText(l) {
  const o = offer();
  const m = l && l.ownerId ? D().team[l.ownerId] : null;
  const who = m ? firstName(m.name) : 'ShipCenter';
  const tel = (m && m.phone) || o.telefon;
  const topic = modelOf(l) === 'shippoint' ? 'o Ship Point' : 'o franczyzie ShipCenter';
  return stripPL(`Dzień dobry, dziękuję za rozmowę ${topic}. W razie pytań proszę dzwonić: ${who}, tel. ${tel}. Pozdrawiam, ${o.smsPodpis || 'ShipCenter'}`);
}
const smsGatewayOn = () => typeof mailOn === 'function' && mailOn() && MAIL.sms === true;
/* wysyłka przez mostek (SMSAPI): od razu albo planowo o sendAt */
async function deliverSms(id) {
  const x = D().sms[id]; if (!x || !smsGatewayOn()) return false;
  const future = !!(x.sendAt && x.sendAt > nowLocal());
  try {
    const r = await mailCall('sms_send', { to: x.phone, message: x.text, ...(future ? { date: new Date(x.sendAt).toISOString() } : {}) });
    patch('sms', id, { status: future ? 'zaplanowany' : 'wyslany', gateway: 'smsapi', gatewayId: (r && r.id) || '', sentTs: future ? '' : new Date().toISOString(), error: '' });
    return true;
  } catch (e) { patch('sms', id, { status: 'blad', error: mailErr(e) }); return false; }
}
async function regateway(id) {
  const x = D().sms[id]; if (!x || !smsGatewayOn()) return;
  if (x.gatewayId) { try { await mailCall('sms_cancel', { id: x.gatewayId }); } catch (e) { } patch('sms', id, { gatewayId: '' }); }
  if (x.status === 'zaplanowany') await deliverSms(id);
}
async function cancelSms(id) {
  const x = D().sms[id]; if (!x) return;
  if (x.gatewayId && x.status === 'zaplanowany' && smsGatewayOn()) { try { await mailCall('sms_cancel', { id: x.gatewayId }); } catch (e) { toast('Nie udało się anulować w SMSAPI: ' + mailErr(e), 'bad'); return; } }
  patch('sms', id, { status: 'anulowany' });
}

/* przypomnienia SMS: o spotkaniu i o szkoleniu (można ustawić kilka) */
const REMIND_TOPICS = {

  szkolenie: { n: 'szkoleniu', when: { tydzien: 'tydzień wcześniej o 10:00', dzien: 'dzień wcześniej o 18:00', rano: 'w dniu szkolenia o 7:30', wlasny: 'własny termin…' } }
};
const TRAINING_START_TIME = '09:00';
const hhmm = x => String(x.getHours()).padStart(2, '0') + ':' + String(x.getMinutes()).padStart(2, '0');
function eventAt(l, topic) { return topic === 'szkolenie' ? (l.trainingStart ? l.trainingStart + 'T' + TRAINING_START_TIME : '') : (l.meetingAt || ''); }
function reminderSendAt(at, when, custom) {
  if (when === 'wlasny') return custom || '';
  if (!at) return '';
  const d = at.split('T')[0];
  if (when === 'tydzien') return isoDate(addDays(new Date(d + 'T12:00'), -7)) + 'T10:00';
  if (when === 'dzien') return isoDate(addDays(new Date(d + 'T12:00'), -1)) + 'T18:00';
  if (when === 'rano') return d + (at.endsWith('T' + TRAINING_START_TIME) ? 'T07:30' : 'T08:00');
  const x = new Date(at); x.setHours(x.getHours() - 2);
  return isoDate(x) + 'T' + hhmm(x);
}
function smsReminderText(l, topic = 'spotkanie') {

  }
  const [d, t] = String(l.meetingAt || '').split('T');
  const where = l.meetingType === 'online' ? ' (online)' + (l.meetingPlace ? ': ' + l.meetingPlace : '')
    : l.meetingType === 'telefon' ? ' (rozmowa telefoniczna)'
    : l.meetingPlace ? ', ' + l.meetingPlace : l.meetingType === 'centrala' ? ', ' + o.adres : '';
  return stripPL(`Dzień dobry, przypominamy o spotkaniu ShipCenter ${dm(d)} o godz. ${t || ''}${where}. W razie zmian proszę o kontakt: ${who}, tel. ${tel}. ${o.smsPodpis || 'ShipCenter'}`);
}
const remindersFor = (leadId, topic) => Object.values(D().sms || {}).filter(x => x.leadId === leadId && x.kind === 'przypomnienie' && (x.topic || 'spotkanie') === topic && x.status === 'zaplanowany').sort((a, b) => (a.sendAt || '').localeCompare(b.sendAt || ''));

function openSmsReminderModal(l, topic = 'spotkanie', smsId = '') {

    if (smsGatewayOn()) { if (ex) regateway(smsId); else deliverSms(smsId); }
  };
}
/* po zmianie terminu / miejsca – przesunięcie zaplanowanych SMS-ów */
function syncReminders(leadId, topic) {
  const l = D().leads[leadId]; if (!l) return;
  const list = remindersFor(leadId, topic); if (!list.length) return;
  const at = eventAt(l, topic);
  if (!at) { list.forEach(x => cancelSms(x.id)); toast('Usunięto termin – anulowano przypomnienia SMS'); return; }
  let n = 0;
  list.forEach(x => {
    const p = { eventAt: at, phone: l.phone || x.phone };
    if (x.when !== 'wlasny') p.sendAt = reminderSendAt(at, x.when);
    if (!x.custom) p.text = smsReminderText(l, topic);
    if ((p.sendAt && p.sendAt !== x.sendAt) || (p.text && p.text !== x.text) || p.eventAt !== x.eventAt) { patch('sms', x.id, p); n++; if (x.gatewayId) regateway(x.id); }
  });
  if (n) toast(`Zaktualizowano przypomnienia SMS (${n})`);
}

    ${first ? `<div class="smsbox" id="sms-box">
      <label class="chk"><input type="checkbox" id="cl-sms" ${l.phone ? 'checked' : 'disabled'}> <b>Wyślij SMS z podziękowaniem za rozmowę</b>${l.phone ? ` na numer ${esc(l.phone)}` : ' – brak numeru telefonu'}</label>
      <textarea id="cl-smstext" rows="3">${esc(smsText)}</textarea>
      <div class="row between"><span class="note" id="cl-smsinfo"></span><button type="button" class="btn sm ghost" id="cl-smspl">Usuń polskie znaki</button></div>
      ${smsGatewayOn() ? '' : '<span class="note">Bramka SMS nie jest jeszcze podłączona – SMS trafi do kolejki i wyjdzie automatycznie po podłączeniu. Możesz też skopiować treść.</span>'}
    </div>` : ''}
    </form>
    <div class="mf"><button class="btn" data-act="modal-close">Anuluj</button><button class="btn primary" id="cl-save">Zapisz</button></div>`);
  const upd = () => { const t = $('#cl-smstext'); if (t) { const i = smsInfo(t.value); $('#cl-smsinfo').textContent = `${i.len} znaków · ${i.parts} SMS${i.gsm ? '' : ' (polskie znaki – krótsze SMS-y)'}`; } };
  upd();
  if ($('#cl-smstext')) { $('#cl-smstext').oninput = upd; $('#cl-smspl').onclick = () => { $('#cl-smstext').value = stripPL($('#cl-smstext').value); upd(); }; }
  const syncWon = () => { const won = $('#cl-status').value === 'pozyskany'; $('#cl-trainbox').hidden = !won; $('#cl-nextwrap').hidden = won; const sb = $('#sms-box'); if (sb && won) sb.hidden = true; };
  $('#cl-status').onchange = syncWon;
  $('#cl-train').onchange = () => { $('#cl-trainend').textContent = fdate(trainingEnd($('#cl-train').value)); };
  $('#cl-result').onchange = () => { const box = $('#sms-box'); if (box) box.hidden = $('#cl-result').value === 'Nie odebrał'; if ($('#cl-result').value === 'Nie odebrał') { $('#cl-status').value = 'proba'; $('#cl-next').value = 'Ponowna próba kontaktu'; $('#cl-nextdate').value = isoDate(addDays(new Date(), 1)); } };
  $$('#modal [data-days]').forEach(b => b.onclick = () => { if (b.dataset.days === 'none') { $('#cl-next').value = ''; $('#cl-nextdate').value = ''; } else $('#cl-nextdate').value = isoDate(addDays(new Date(), +b.dataset.days)); });
  $('#cl-pres').onchange = () => { if ($('#cl-pres').checked && !/prezentac/i.test($('#cl-next').value)) $('#cl-next').value = 'Telefon po prezentacji'; };
  const save = () => {
    const cur = D().leads[l.id]; if (!cur) return closeModal();
    const t = $('#cl-type').value, res = $('#cl-result').value;
    const hist = (cur.history || []).slice();
    const by = myMemberId() || cur.ownerId || '';
    const noteTxt = $('#cl-text').value.trim();
    hist.push({ id: uid('h'), at: nowLocal(), type: t, text: noteTxt, result: res, by, manual: !!noteTxt, auto: !noteTxt });
    const won = $('#cl-status').value === 'pozyskany';
    const nextTxt = won ? '' : $('#cl-next').value.trim();
    const p = { history: hist, status: $('#cl-status').value, nextTask: nextTxt, nextTaskDate: nextTxt ? $('#cl-nextdate').value : '', nextTaskTime: nextTxt ? $('#cl-nexttime').value : '', updatedTs: new Date().toISOString() };
    if (won) {
      const ts = $('#cl-train').value;
      p.stageDates = { ...(cur.stageDates || {}), umowa: (cur.stageDates || {}).umowa || todayISO() };
      if (ts) { p.trainingStart = ts; p.trainingEnd = trainingEnd(ts); p.trainingPlace = cur.trainingPlace || 'centrala ShipCenter, ul. Gliwicka 51, Katowice'; p.nextTask = 'Szkolenie wstępne w centrali (3 dni)'; p.nextTaskDate = ts; hist.push(histEntry('system', `Umowa podpisana. Szkolenie w centrali: ${fdate(ts)} – ${fdate(p.trainingEnd)}`, { by })); }
    }
    const reached = res !== 'Nie odebrał';
    if (t === 'tel' && reached && !cur.firstCallAt) p.firstCallAt = todayISO();
    if ($('#cl-pres').checked && !cur.presentationAt) { p.presentationAt = todayISO(); hist.push(histEntry('email', 'Wysłano prezentację', { by, result: 'Wysłano materiały' })); }
    if ((t === 'spotkanie' || stageTo === 'spotkanie') && reached && !(cur.stageDates || {}).spotkanie) p.stageDates = { ...(cur.stageDates || {}), spotkanie: todayISO() };
    if (t === 'spotkanie') { p.meetingAt = ''; if (p.status === 'umowione') p.status = 'w_kontakcie'; }
    patch('leads', l.id, p);
    const smsOn = !won && $('#cl-sms') && $('#cl-sms').checked && reached && cur.phone;
    if (smsOn) {
      const text = $('#cl-smstext').value.trim();
      queueSms(cur, text);
      const h2 = (D().leads[l.id].history || []).slice(); h2.push(histEntry('sms', 'SMS z podziękowaniem: ' + text, { by, result: smsGatewayOn() ? 'Wysłano materiały' : 'Inne' }));
      patch('leads', l.id, { history: h2 });
    }
    const chain = [($('#cl-mail-pres') || {}).checked ? 'email_prezentacja' : '', ($('#cl-mail-calc') || {}).checked ? 'email_kalkulator' : ''].filter(Boolean);
    closeModal();
    toast(smsOn ? (smsGatewayOn() ? 'Zapisano. SMS wysłany przez SMSAPI.' : 'Zapisano. SMS czeka w kolejce – wyślij go z „Kontaktów”.') : 'Zapisano rozmowę');
    if (chain.length) setTimeout(() => { const c2 = D().leads[l.id]; if (c2) openMailModal(c2, chain[0], { chain: chain.slice(1) }); }, 250);
  };
  $('#cl-save').onclick = save;
  $('#call-form').onsubmit = e => { e.preventDefault(); save(); };
}

function markPresentation(l) {
  const today = todayISO();
  const hist = (l.history || []).slice();
  hist.push(histEntry('email', 'Wysłano prezentację', { by: myMemberId() || l.ownerId || '', result: 'Wysłano materiały' }));
  const p = { presentationAt: today, history: hist, updatedTs: new Date().toISOString() };
  if (!l.nextTaskDate || l.nextTaskDate <= today) { p.nextTask = 'Telefon po prezentacji'; p.nextTaskDate = isoDate(addDays(new Date(), 3)); }
  patch('leads', l.id, p);
  toast('Zapisano wysłanie prezentacji' + (p.nextTaskDate ? ' · kolejny kontakt ' + fdate(p.nextTaskDate) : ''));
}

/* widok Kontakty */
function viewContacts() {
  if (isLoading()) return `<div class="skeleton">Wczytywanie kontaktów…</div>`;
  const me = myMemberId();
  if (S.ui.cOwner == null) S.ui.cOwner = me || '';
  const owner = S.ui.cOwner;
  const byOwner = l => !owner || (owner === '_none' ? !l.ownerId : l.ownerId === owner);
  const t = todayISO(), tm = isoDate(addDays(new Date(), 1)), wk = isoDate(addDays(new Date(), 7));
  const open = leadsArr().filter(isOpen).filter(byOwner);
  const withNext = open.filter(l => l.nextTaskDate).sort((a, b) => (a.nextTaskDate + (a.nextTaskTime || '99')).localeCompare(b.nextTaskDate + (b.nextTaskTime || '99')));
  const groups = [
    ['Zaległe', 'bad', withNext.filter(l => l.nextTaskDate < t)],
    ['Dziś', 'acc', withNext.filter(l => l.nextTaskDate === t)],
    ['Jutro', '', withNext.filter(l => l.nextTaskDate === tm)],

  const meetings = open.filter(l => l.meetingAt && l.meetingAt.slice(0, 10) >= t && l.meetingAt.slice(0, 10) <= wk).sort((a, b) => a.meetingAt.localeCompare(b.meetingAt));
  const nowL = nowLocal();
  const pendingSms = Object.values(D().sms || {}).filter(x => x.status === 'oczekuje' || (x.status === 'zaplanowany' && !x.gatewayId && (x.sendAt || '') <= nowL));
