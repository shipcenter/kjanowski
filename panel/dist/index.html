const PL_MAP = { ą: 'a', ć: 'c', ę: 'e', ł: 'l', ń: 'n', ó: 'o', ś: 's', ź: 'z', ż: 'z', Ą: 'A', Ć: 'C', Ę: 'E', Ł: 'L', Ń: 'N', Ó: 'O', Ś: 'S', Ź: 'Z', Ż: 'Z' };
const stripPL = t => String(t || '').replace(/[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g, c => PL_MAP[c]).replace(/[„”]/g, '"').replace(/[–—]/g, '-');
const GSM_RE = /^[A-Za-z0-9 \r\n@£$¥èéùìòÇØøÅå_ΦΓΛΩΠΨΣΘΞÆæßÉ!"#%&'()*+,\-./:;<=>?¡ÄÖÑÜ§¿äöñüà^{}\[\]~|€\\]*$/;
function smsInfo(text) {
  const gsm = GSM_RE.test(text);
  const len = [...text].length;
  const per = gsm ? (len > 160 ? 153 : 160) : (len > 70 ? 67 : 70);
  return { gsm, len, parts: Math.max(1, Math.ceil(len / per)) };
}
function smsThanksText(l) {
  const o = offer();
  const m = l && l.ownerId ? D().team[l.ownerId] : null;
  const who = m ? firstName(m.name) : 'ShipCenter';
  const tel = (m && m.phone) || o.telefon;
  const topic = modelOf(l) === 'shippoint' ? 'o Ship Point' : 'o franczyzie ShipCenter';
  return stripPL(`Dzień dobry, dziękuję za rozmowę ${topic}. W razie pytań proszę dzwonić: ${who}, tel. ${tel}. Pozdrawiam, ${o.smsPodpis || 'ShipCenter'}`);
}
const smsGatewayOn = () => !!((settings().integrations || {}).sms);

function queueSms(l, text) {
  const id = uid('sms');
  const doc = { leadId: l.id, leadName: l.name || '', phone: l.phone || '', text, ownerId: l.ownerId || '', status: 'oczekuje', kind: 'po_rozmowie', createdTs: new Date().toISOString(), createdBy: myMemberId() || '' };
  put('sms', id, doc);
  return id;
}
const SMS_STATUS = { oczekuje: ['Czeka na wysłanie', 'warn'], wyslany: ['Wysłany', 'good'], blad: ['Błąd wysyłki', 'bad'], anulowany: ['Anulowany', ''] };
function smsListFor(leadId) { return Object.values(D().sms || {}).filter(x => x.leadId === leadId).sort((a, b) => (b.createdTs || '').localeCompare(a.createdTs || '')); }

/* modal: zapis rozmowy (pierwszej lub kolejnej) */
function openCallModal(l, { type = 'tel', title = null, result = 'Rozmowa przeprowadzona', text = '', stageTo = null } = {}) {
  const first = !l.firstCallAt && type === 'tel';
  const smsText = smsThanksText(l);
  const nextDefault = isoDate(addDays(new Date(), 3));
  openModal(`<div class="mh"><h2>${esc(title || (first ? 'Pierwsza rozmowa' : 'Zapis kontaktu'))} – ${esc(l.name)}</h2><button class="iconbtn" data-act="modal-close" aria-label="Zamknij">${ICONS.x}</button></div>
    <form class="mb" id="call-form"><div class="formgrid">
      <label class="field"><span>Rodzaj</span><select id="cl-type">${CONTACT_TYPES.filter(c => c.k !== 'system').map(c => opt(c.k, c.n, type)).join('')}</select></label>
      <label class="field"><span>Wynik</span><select id="cl-result">${['Rozmowa przeprowadzona', 'Nie odebrał', 'Prośba o kontakt później', 'Wysłano materiały', 'Umówiono spotkanie', 'Spotkanie odbyte', 'Zainteresowany', 'Niezainteresowany', 'Inne'].map(x => opt(x, x, result)).join('')}</select></label>
      <label class="field"><span>Status kontaktu</span><select id="cl-status">${statusOpts(l.status === 'do_kontaktu' ? 'w_kontakcie' : l.status)}</select></label>
      <label class="field full"><span>Notatka z rozmowy</span><textarea id="cl-text" rows="3" placeholder="Co ustaliliście, czego oczekuje, obawy, kapitał, lokal…">${esc(text)}</textarea></label>
      <label class="chk full"><input type="checkbox" id="cl-pres" ${l.presentationAt ? 'disabled' : ''}> ${l.presentationAt ? 'Prezentacja wysłana ' + fdate(l.presentationAt) : 'Wysłałem prezentację (zapisz datę dzisiejszą)'}</label>
    </div>
    <div class="formgrid">
      <label class="field span2"><span>Kolejny kontakt – co zrobić</span><input type="text" id="cl-next" list="task-sugg3" value="${esc(l.presentationAt ? 'Telefon po prezentacji' : 'Telefon – kolejny krok')}"></label>
      <label class="field"><span>Data</span><input type="date" id="cl-nextdate" value="${nextDefault}"></label>
      <label class="field"><span>Godzina (opcjonalnie)</span><input type="time" id="cl-nexttime" value=""></label>
    </div>
    <div class="row">${[1, 2, 3, 7, 14].map(d => `<button type="button" class="btn sm" data-days="${d}">za ${d} ${d === 1 ? 'dzień' : 'dni'}</button>`).join('')}<button type="button" class="btn sm ghost" data-days="none">bez kolejnego kontaktu</button></div>
    <datalist id="task-sugg3">${['Telefon po prezentacji', 'Ponowna próba kontaktu', 'Umówić spotkanie', 'Zebrać dane do analizy lokalizacji', 'Wysłać ofertę i projekt umowy', 'Telefon decyzyjny', 'Zaplanować szkolenie'].map(x => `<option value="${x}">`).join('')}</datalist>
    ${first ? `<div class="smsbox" id="sms-box">
      <label class="chk"><input type="checkbox" id="cl-sms" ${l.phone ? 'checked' : 'disabled'}> <b>Wyślij SMS z podziękowaniem za rozmowę</b>${l.phone ? ` na numer ${esc(l.phone)}` : ' – brak numeru telefonu'}</label>
      <textarea id="cl-smstext" rows="3">${esc(smsText)}</textarea>
      <div class="row between"><span class="note" id="cl-smsinfo"></span><button type="button" class="btn sm ghost" id="cl-smspl">Usuń polskie znaki</button></div>
      ${smsGatewayOn() ? '' : '<span class="note">Bramka SMS nie jest jeszcze podłączona – SMS trafi do kolejki i wyjdzie automatycznie po podłączeniu. Możesz też skopiować treść.</span>'}
    </div>` : ''}
    </form>
    <div class="mf"><button class="btn" data-act="modal-close">Anuluj</button><button class="btn primary" id="cl-save">Zapisz</button></div>`);
  const upd = () => { const t = $('#cl-smstext'); if (t) { const i = smsInfo(t.value); $('#cl-smsinfo').textContent = `${i.len} znaków · ${i.parts} SMS${i.gsm ? '' : ' (polskie znaki – krótsze SMS-y)'}`; } };
  upd();
  if ($('#cl-smstext')) { $('#cl-smstext').oninput = upd; $('#cl-smspl').onclick = () => { $('#cl-smstext').value = stripPL($('#cl-smstext').value); upd(); }; }
  $('#cl-result').onchange = () => { const box = $('#sms-box'); if (box) box.hidden = $('#cl-result').value === 'Nie odebrał'; if ($('#cl-result').value === 'Nie odebrał') { $('#cl-status').value = 'proba'; $('#cl-next').value = 'Ponowna próba kontaktu'; $('#cl-nextdate').value = isoDate(addDays(new Date(), 1)); } };
  $$('#modal [data-days]').forEach(b => b.onclick = () => { if (b.dataset.days === 'none') { $('#cl-next').value = ''; $('#cl-nextdate').value = ''; } else $('#cl-nextdate').value = isoDate(addDays(new Date(), +b.dataset.days)); });
  $('#cl-pres').onchange = () => { if ($('#cl-pres').checked && !/prezentac/i.test($('#cl-next').value)) $('#cl-next').value = 'Telefon po prezentacji'; };
  const save = () => {
    const cur = D().leads[l.id]; if (!cur) return closeModal();
    const t = $('#cl-type').value, res = $('#cl-result').value;
    const hist = (cur.history || []).slice();
    const by = myMemberId() || cur.ownerId || '';
    hist.push({ id: uid('h'), at: nowLocal(), type: t, text: $('#cl-text').value.trim(), result: res, by });
    const nextTxt = $('#cl-next').value.trim();
    const p = { history: hist, status: $('#cl-status').value, nextTask: nextTxt, nextTaskDate: nextTxt ? $('#cl-nextdate').value : '', nextTaskTime: nextTxt ? $('#cl-nexttime').value : '', updatedTs: new Date().toISOString() };
    const reached = res !== 'Nie odebrał';
    if (t === 'tel' && reached && !cur.firstCallAt) p.firstCallAt = todayISO();
    if ($('#cl-pres').checked && !cur.presentationAt) { p.presentationAt = todayISO(); hist.push(histEntry('email', 'Wysłano prezentację', { by, result: 'Wysłano materiały' })); }
    if ((t === 'spotkanie' || stageTo === 'spotkanie') && reached && !(cur.stageDates || {}).spotkanie) p.stageDates = { ...(cur.stageDates || {}), spotkanie: todayISO() };
    if (t === 'spotkanie') { p.meetingAt = ''; if (p.status === 'umowione') p.status = 'w_kontakcie'; }
    patch('leads', l.id, p);
    const smsOn = $('#cl-sms') && $('#cl-sms').checked && reached && cur.phone;
    if (smsOn) {
      const text = $('#cl-smstext').value.trim();
      queueSms(cur, text);
      const h2 = (D().leads[l.id].history || []).slice(); h2.push(histEntry('sms', 'SMS z podziękowaniem: ' + text, { by, result: smsGatewayOn() ? 'Wysłano materiały' : 'Inne' }));
      patch('leads', l.id, { history: h2 });
    }
    closeModal();
    toast(smsOn ? (smsGatewayOn() ? 'Zapisano. SMS zostanie wysłany w ciągu minuty.' : 'Zapisano. SMS czeka w kolejce na podłączenie bramki.') : 'Zapisano rozmowę');
  };
  $('#cl-save').onclick = save;
  $('#call-form').onsubmit = e => { e.preventDefault(); save(); };
}

function markPresentation(l) {
  const today = todayISO();
  const hist = (l.history || []).slice();
  hist.push(histEntry('email', 'Wysłano prezentację', { by: myMemberId() || l.ownerId || '', result: 'Wysłano materiały' }));
  const p = { presentationAt: today, history: hist, updatedTs: new Date().toISOString() };
  if (!l.nextTaskDate || l.nextTaskDate <= today) { p.nextTask = 'Telefon po prezentacji'; p.nextTaskDate = isoDate(addDays(new Date(), 3)); }
  patch('leads', l.id, p);
  toast('Zapisano wysłanie prezentacji' + (p.nextTaskDate ? ' · kolejny kontakt ' + fdate(p.nextTaskDate) : ''));
}

/* widok Kontakty */
function viewContacts() {
  if (isLoading()) return `<div class="skeleton">Wczytywanie kontaktów…</div>`;
  const me = myMemberId();
  if (S.ui.cOwner == null) S.ui.cOwner = me || '';
  const owner = S.ui.cOwner;
  const byOwner = l => !owner || (owner === '_none' ? !l.ownerId : l.ownerId === owner);
  const t = todayISO(), tm = isoDate(addDays(new Date(), 1)), wk = isoDate(addDays(new Date(), 7));
  const open = leadsArr().filter(isOpen).filter(byOwner);
  const withNext = open.filter(l => l.nextTaskDate).sort((a, b) => (a.nextTaskDate + (a.nextTaskTime || '99')).localeCompare(b.nextTaskDate + (b.nextTaskTime || '99')));
  const groups = [
    ['Zaległe', 'bad', withNext.filter(l => l.nextTaskDate < t)],
    ['Dziś', 'acc', withNext.filter(l => l.nextTaskDate === t)],
    ['Jutro', '', withNext.filter(l => l.nextTaskDate === tm)],
    ['Najbliższe 7 dni', '', withNext.filter(l => l.nextTaskDate > tm && l.nextTaskDate <= wk)]
  ];
  const newOnes = open.filter(l => !l.firstCallAt && l.status === 'do_kontaktu').sort((a, b) => (a.createdTs || '').localeCompare(b.createdTs || ''));
  const noNext = open.filter(l => !l.nextTaskDate && l.firstCallAt);
  const meetings = open.filter(l => l.meetingAt && l.meetingAt.slice(0, 10) >= t && l.meetingAt.slice(0, 10) <= wk).sort((a, b) => a.meetingAt.localeCompare(b.meetingAt));
  const pendingSms = Object.values(D().sms || {}).filter(x => x.status === 'oczekuje');
  const ownerLabel = owner ? (owner === '_none' ? 'leady bez opiekuna' : memberName(owner)) : 'cały zespół';
  const head = `<div class="viewhead"><div class="grow"><span class="eyebrow">Przypomnienia</span><h1>Kontakty</h1>
    <p>Kogo i kiedy trzeba złapać – ${esc(ownerLabel)}. Na dziś i zaległe: <b>${groups[0][2].length + groups[1][2].length}</b>.</p></div>
    <div class="actions"><label class="field" style="width:210px"><span>Osoba</span><select id="c-owner" data-act-change="c-owner">${opt('', 'Cały zespół', owner)}${opt('_none', 'Bez opiekuna', owner)}${team().map(m => opt(m.id, m.name + (m.id === me ? ' (Ty)' : ''), owner)).join('')}</select></label>
    <button class="btn primary" data-act="lead-new">${ICONS.plus}Dodaj lead</button></div></div>
    ${!me && team().length ? `<div class="callout" style="margin-bottom:16px">Wskaż, którą osobą z zespołu jesteś (zakładka „Zespół i ustawienia” → „To ja”), a ten widok i licznik w menu pokażą tylko Twoje kontakty.</div>` : ''}`;
  const row = l => {
    const time = l.nextTaskTime ? l.nextTaskTime : (l.nextTaskDate === t ? 'dziś' : fdateShort(l.nextTaskDate));
    return `<div class="contact-row"><span class="when ${dueCls(l.nextTaskDate)}">${esc(time)}</span>
      <div style="min-width:0"><a href="#lead-${l.id}"><b>${esc(l.name || '(bez nazwy)')}</b></a> ${modelPill(l)}<div class="small ink2">${esc(l.nextTask || 'Kontakt')}${l.nextTaskDate < t ? ` · <span class="overdue">od ${fdate(l.nextTaskDate)}</span>` : ''}</div>
      <div class="tiny muted">${esc([l.phone, l.city, STAGES[stageIdx(l)].short, owner ? '' : memberName(l.ownerId)].filter(Boolean).join(' · '))}${l.presentationAt ? ' · prezentacja ' + fdateShort(l.presentationAt) : ''}</div></div>
      <div class="ctl">${l.phone ? `<button class="btn sm ghost" data-act="copy" data-text="${esc(l.phone)}">${ICONS.copy}Telefon</button>` : ''}<button class="btn sm" data-act="snooze" data-id="${l.id}" data-d="1">+1 dzień</button><button class="btn sm primary" data-act="call-log" data-id="${l.id}">Zapisz kontakt</button></div></div>`;
  };
  S.ui.cExpand = S.ui.cExpand || {};
  const groupsHtml = groups.map(([n, tone, list], gi) => { if (!list.length) return ''; const lim = gi < 2 || S.ui.cExpand[gi] ? list.length : 6; return `<div class="card daygroup"><h3>${n} <span class="pill ${tone}">${list.length}</span></h3>${list.slice(0, lim).map(row).join('')}${list.length > lim ? `<button class="btn sm ghost" data-act="c-expand" data-i="${gi}">Pokaż wszystkie (${list.length})</button>` : ''}</div>`; }).join('');
  const newCard = `<div class="card"><div class="cardhead"><h2>Do pierwszego kontaktu</h2><p>${newOnes.length} nowych</p></div>
    ${newOnes.length ? newOnes.map(l => `<div class="contact-row"><span class="when ${l.createdTs && Date.now() - new Date(l.createdTs) > 864e5 ? 'overdue' : 'today'}">${fdateShort(l.createdAt)}</span><div style="min-width:0"><a href="#lead-${l.id}"><b>${esc(l.name)}</b></a> ${modelPill(l)}<div class="tiny muted">${esc([l.phone, l.email, l.city, SOURCE_MAP[l.source]?.n].filter(Boolean).join(' · '))}</div></div>
      <div class="ctl">${l.phone ? `<button class="btn sm ghost" data-act="copy" data-text="${esc(l.phone)}">${ICONS.copy}Telefon</button>` : ''}<button class="btn sm primary" data-act="call-log" data-id="${l.id}">Pierwsza rozmowa</button></div></div>`).join('') : '<p class="muted small">Wszyscy nowi kandydaci mają już za sobą pierwszą rozmowę.</p>'}</div>`;
  const meetCard = `<div class="card"><div class="cardhead"><h2>Spotkania – 7 dni</h2><p>${meetings.length}</p></div>${meetings.length ? meetings.map(l => `<div class="contact-row"><span class="when ${dueCls(l.meetingAt)}">${fdateShort(l.meetingAt)}</span><div style="min-width:0"><a href="#lead-${l.id}"><b>${esc(l.name)}</b></a><div class="tiny muted">${fdt(l.meetingAt)} · ${esc(l.meetingType || '')} ${esc(l.meetingPlace || '')}</div></div><div></div></div>`).join('') : '<p class="muted small">Brak zaplanowanych spotkań.</p>'}</div>`;
  const noNextCard = noNext.length ? `<div class="card"><div class="cardhead"><h2>Bez zaplanowanego kontaktu</h2><p>${noNext.length}</p></div><p class="note" style="margin-bottom:6px">Aktywni kandydaci po pierwszej rozmowie, którym nikt nie ustawił kolejnego kontaktu.</p>${noNext.slice(0, 15).map(l => `<div class="contact-row"><span class="when muted">—</span><div style="min-width:0"><a href="#lead-${l.id}"><b>${esc(l.name)}</b></a> ${modelPill(l)}<div class="tiny muted">ostatni kontakt ${fdateShort(lastContact(l) || l.createdAt)}</div></div><div class="ctl"><button class="btn sm" data-act="snooze" data-id="${l.id}" data-d="1">Na jutro</button></div></div>`).join('')}</div>` : '';
  const smsCard = pendingSms.length ? `<div class="card"><div class="cardhead"><h2>SMS w kolejce</h2><p>${pendingSms.length}</p></div>${smsGatewayOn() ? '' : '<p class="note" style="margin-bottom:6px">Bramka SMS nie jest podłączona. Skopiuj treść i wyślij ręcznie albo poczekaj na podłączenie.</p>'}${pendingSms.map(x => `<div class="contact-row"><span class="when">${fdateShort(x.createdTs)}</span><div style="min-width:0"><a href="#lead-${x.leadId}"><b>${esc(x.leadName)}</b></a> <span class="mono small">${esc(x.phone)}</span><div class="tiny muted">${esc(x.text)}</div></div><div class="ctl"><button class="btn sm ghost" data-act="copy" data-text="${esc(x.text)}">${ICONS.copy}Treść</button><button class="btn sm" data-act="sms-done" data-id="${x.id}">Wysłany ręcznie</button><button class="iconbtn" data-act="sms-cancel" data-id="${x.id}" aria-label="Anuluj">${ICONS.x}</button></div></div>`).join('')}</div>` : '';
  const empty = !groups.some(g => g[2].length) ? `<div class="card"><div class="empty"><h3>Brak zaplanowanych kontaktów na najbliższy tydzień</h3><p>Kolejny kontakt ustawisz przy zapisie rozmowy albo w karcie leada.</p></div></div>` : '';
  return head + `<div class="split"><div class="stack">${groupsHtml}${empty}</div><div class="stack">${newCard}${smsCard}${meetCard}${noNextCard}</div></div>`;
}

/* mail z prezentacją / kalkulatorem: gotowa wiadomość + zapis wysłania */
function openMailModal(l, tplKey) {
  const t = TEMPLATES[tplKey]; if (!t) return;
  const out = t.f(msgContext(l, l.form));
  const isPres = tplKey === 'email_prezentacja';
  const again = isPres ? !!l.presentationAt : !!l.calcSentAt;
  const mailto = () => `mailto:${encodeURIComponent(l.email || '')}?subject=${encodeURIComponent($('#ml-subj').value)}&body=${encodeURIComponent($('#ml-body').value)}`;
  openModal(`<div class="mh"><h2>${esc(again ? 'Wyślij ponownie: ' + t.n.toLowerCase() : t.n)} – ${esc(l.name)}</h2><button class="iconbtn" data-act="modal-close" aria-label="Zamknij">${ICONS.x}</button></div>
    <div class="mb">
      ${again ? `<p class="callout">${isPres ? 'Prezentacja' : 'Kalkulator'} był już wysłany ${fdate(isPres ? l.presentationAt : l.calcSentAt)}.</p>` : ''}
      <div class="formgrid">
        <label class="field span2"><span>Do</span><input type="email" id="ml-to" value="${esc(l.email || '')}" placeholder="brak adresu e-mail w karcie leada"></label>
        <div class="field" style="justify-content:flex-end"><button type="button" class="btn sm" id="ml-copy-to">${ICONS.copy}Kopiuj adres</button></div>
        <label class="field full"><span>Temat</span><input type="text" id="ml-subj" value="${esc(out.subject || '')}"></label>
        <label class="field full"><span>Treść</span><textarea id="ml-body" rows="14">${esc(out.body)}</textarea></label>
      </div>
      <div class="row"><button type="button" class="btn sm" id="ml-copy-subj">${ICONS.copy}Kopiuj temat</button><button type="button" class="btn sm" id="ml-copy-body">${ICONS.copy}Kopiuj treść</button><a class="btn sm" id="ml-open" href="#" target="_blank" rel="noopener">${ICONS.email}Otwórz w programie pocztowym</a></div>
      <p class="note">Panel nie wysyła maili sam – wyślij wiadomość ze skrzynki ${esc(offer().email)} (np. Thunderbird), dołącz prezentację, jeśli nie ma linku, i kliknij „Zapisz jako wysłany”.${(isPres && !offer().linkPrezentacja) ? ' Link do prezentacji możesz ustawić w „Zespół i ustawienia”.' : ''}</p>
    </div>
    <div class="mf"><button class="btn" data-act="modal-close">Anuluj</button><button class="btn primary" id="ml-save">Zapisz jako wysłany</button></div>`, { wide: true });
  const refreshLink = () => { const a = $('#ml-open'); if (a) a.href = mailto().replace(encodeURIComponent(l.email || ''), encodeURIComponent($('#ml-to').value)); };
  refreshLink();
  ['ml-to', 'ml-subj', 'ml-body'].forEach(id => { $('#' + id).oninput = refreshLink; });
  $('#ml-copy-to').onclick = () => copyText($('#ml-to').value);
  $('#ml-copy-subj').onclick = () => copyText($('#ml-subj').value);
  $('#ml-copy-body').onclick = () => copyText($('#ml-body').value);
  $('#ml-save').onclick = () => {
    const cur = D().leads[l.id]; if (!cur) return closeModal();
    const by = myMemberId() || cur.ownerId || '';
    const hist = (cur.history || []).slice();
    hist.push(histEntry('email', `${again ? 'Ponownie wysłano' : 'Wysłano'}: ${t.n.toLowerCase()} – „${$('#ml-subj').value}”`, { by, result: 'Wysłano materiały' }));
    const p = { history: hist, updatedTs: new Date().toISOString() };
    const to = $('#ml-to').value.trim();
    if (to && to !== cur.email) p.email = to;
    if (isPres) { if (!cur.presentationAt) p.presentationAt = todayISO(); p.presentationSends = (cur.presentationSends || (cur.presentationAt ? 1 : 0)) + 1; p.presentationLastAt = todayISO(); }
    else { if (!cur.calcSentAt) p.calcSentAt = todayISO(); p.calcLastAt = todayISO(); }
    if (!cur.nextTaskDate || cur.nextTaskDate <= todayISO()) { p.nextTask = isPres ? 'Telefon po prezentacji' : 'Telefon – omówić konfigurację z kalkulatora'; p.nextTaskDate = isoDate(addDays(new Date(), 3)); }
    if (cur.status === 'do_kontaktu') p.status = 'w_kontakcie';
    patch('leads', l.id, p);
    closeModal();
    toast('Zapisano wysłanie maila' + (p.nextTaskDate ? ' · kolejny kontakt ' + fdate(p.nextTaskDate) : ''));
  };
}

/* ===== Generator wiadomości i skryptów rozmów (PL) ===== */

const FORMS = { panstwo: 'forma „Państwo”', pan: 'forma „Pan”', pani: 'forma „Pani”', ty: 'forma „Ty”' };
const formLabel = f => FORMS[f] || FORMS.panstwo;
const regionLoc = r => r ? 'województwie ' + r.replace(/ie$/, 'im') : '';
const fdtLong = s => { const d = parseD(s); if (!d) return ''; const base = d.toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' }); return String(s).includes('T') ? base + ' o ' + d.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' }) : base; };
const PH = t => `[uzupełnij: ${t}]`;

function msgContext(l, form) {
  const o = offer();
  const m = (myMemberId() && D().team[myMemberId()]) || (l && l.ownerId ? D().team[l.ownerId] : null);
  form = form || (l && l.form) || 'panstwo';
  const g = (pan, pani, panstwo, ty) => ({ pan, pani, panstwo, ty })[form] ?? panstwo;
  const first = l && l.name ? l.name.trim().split(/\s+/)[0] : '';
  const loc = l && l.locId ? D().locations[l.locId] : (l ? Object.values(D().locations).find(x => x.leadId === l.id) : null);
  return {
    l: l || {}, o, g, form,
    imie: first || PH('imię'), pelne: (l && l.name) || PH('imię i nazwisko'),
    miasto: (l && l.city) || PH('miasto'), maMiasto: !!(l && l.city),
    region: l && l.region ? regionLoc(l.region) : '',
    opiekun: m ? m.name : PH('Twoje imię i nazwisko'),
    opiekunImie: m ? firstName(m.name) : PH('Twoje imię'),
    opiekunTel: (m && m.phone) || o.telefon, opiekunEmail: (m && m.email) || o.email,
    rola: m && m.role ? m.role.replace('Centrala – ', '') : 'Rozwój sieci franczyzowej',
    spotkanie: l && l.meetingAt ? fdtLong(l.meetingAt) : PH('termin spotkania'),

function renderMsgBody(text) {
  return esc(text).replace(/\[uzupełnij: [^\]]*\]/g, m => `<span class="ph">${m}</span>`);
}

function viewMessages() {
  const m = S.msg;
  const leads = leadsArr().sort((a, b) => (a.name || '').localeCompare(b.name || '', 'pl'));
  const l = m.leadId ? D().leads[m.leadId] : null;
  if (!TEMPLATES[m.tpl]) m.tpl = 'email_pierwszy';
  const t = TEMPLATES[m.tpl];
  const c = msgContext(l, m.form);
  const out = t.f(c);
  S.ui.msgOut = out;
  const groups = [...new Set(Object.values(TEMPLATES).map(x => x.grp))];
  const custom = S.ui.aiText;
  const head = `<div class="viewhead"><div class="grow"><span class="eyebrow">Komunikacja z kandydatami</span><h1>Wiadomości i skrypty</h1>
    <p>Gotowe e-maile, SMS-y i skrypty rozmów po polsku, wypełnione danymi leada i parametrami oferty ShipCenter. Pola <span class="pill warn">[uzupełnij]</span> wymagają ręcznej edycji.</p></div></div>`;
  const left = `<div class="card" style="padding:8px"><div class="tplist">${groups.map(gname => `<div class="grp">${esc(gname)}</div>${Object.entries(TEMPLATES).filter(([k, x]) => x.grp === gname).map(([k, x]) => `<button class="${k === m.tpl ? 'on' : ''}" data-act="tpl" data-k="${k}"><span class="pill outline tiny">${esc(x.kind)}</span>${esc(x.n)}</button>`).join('')}`).join('')}</div></div>`;
  const controls = `<div class="formgrid">
      <label class="field span2"><span>Kandydat</span><select id="msg-lead" data-msg="leadId">${opt('', '— bez leada (szablon ogólny) —', m.leadId)}${leads.map(x => opt(x.id, `${x.name}${x.city ? ' – ' + x.city : ''} (${STAGES[stageIdx(x)].short})`, m.leadId)).join('')}</select></label>
      <label class="field"><span>Forma zwrotu</span><select id="msg-form" data-msg="form">${Object.entries(FORMS).map(([k, n]) => opt(k, n.replace('forma ', ''), m.form)).join('')}</select></label>
    </div>`;
  const ai = S.sample ? `<div class="sep"></div><div class="formgrid"><label class="field full"><span>Poproś Claude o wersję lub nową wiadomość</span><input type="text" id="ai-instr" placeholder="np. krótsza i cieplejsza wersja · dodaj wątek PaczkoPunktu InPost · odpowiedź na pytanie o zyski"></label></div>
    <div class="row" style="margin-top:8px"><button class="btn" data-act="ai-rewrite">${ICONS.spark}Dopracuj z Claude</button><span class="note">Claude dostaje szablon, dane leada i warunki oferty. Nie dopisze obietnic finansowych.</span></div>` : '';
  const main = `<div class="card"><div class="cardhead"><h2>${esc(t.n)}</h2><span class="pill">${esc(t.kind)}</span></div>
    ${controls}
    <div class="sep"></div>
    ${out.subject ? `<div class="row between" style="margin-bottom:6px"><span class="small"><span class="muted">Temat:</span> <b>${esc(out.subject)}</b></span><button class="btn sm ghost" data-act="copy-subject">${ICONS.copy}Kopiuj temat</button></div>` : ''}
    <div class="msgout" id="msg-out">${renderMsgBody(out.body)}</div>
    <div class="row" style="margin-top:10px"><button class="btn primary" data-act="copy-msg">${ICONS.copy}Kopiuj ${out.subject ? 'treść' : ''}</button>
    ${t.kind === 'SMS' ? `<span class="note">${out.body.length} znaków · ${Math.ceil(out.body.length / 160)} SMS</span>` : ''}
    ${l ? `<button class="btn" data-act="msg-log" data-id="${l.id}">Zapisz wysłanie w historii leada</button><a class="btn ghost" href="#lead-${l.id}">Otwórz leada</a>` : ''}</div>
    ${ai}
    ${custom ? `<div class="sep"></div><div class="row between"><h3>Wersja od Claude</h3><div class="row"><button class="btn sm" data-act="copy-ai">${ICONS.copy}Kopiuj</button><button class="btn sm ghost" data-act="ai-clear">Usuń</button></div></div><div class="msgout" style="margin-top:8px" id="ai-out">${renderMsgBody(custom)}</div>` : ''}
  </div>`;
  return head + `<div class="split-side">${left}<div class="stack">${main}</div></div>`;
}

  const l = S.msg.leadId ? D().leads[S.msg.leadId] : null;
  const o = offer();
  const prompt = `Jesteś doświadczonym specjalistą od rekrutacji franczyzobiorców sieci ShipCenter (punkty nadawcze paczek, wielu przewoźników). Pisz wyłącznie po polsku, poprawną polszczyzną, w formie zwrotu: ${formLabel(S.msg.form)}.
Zasady: nie wymyślaj nowych liczb ani obietnic zarobków (franczyzodawca nie gwarantuje wyników); używaj tylko faktów z danych poniżej; zostaw pola w nawiasach [uzupełnij: …], jeśli brakuje danych; zwróć sam tekst wiadomości (jeśli to e-mail – pierwsza linia „Temat: …”), bez komentarzy.

Warunki oferty: licencja ${o.licencja} zł netto, opłata miesięczna ${o.oplataMies} zł netto (0 zł w miesiącu po min. ${o.progRabatu} paczkach), ${o.prowizjaP24}% od płatności online, szkolenie ${o.szkolenie}, uruchomienie ${o.uruchomienie}, ochrona ${o.ochrona} km, godziny ${o.godziny}, min. ${o.minPaczek} paczek/mies., przewoźnicy: ${o.przewoznicy}. Franczyza bez punktu: ${o.licencjaBezPunktu} zł. Partner: ${o.partnerWstepna} zł + ${o.partnerMies} zł/mies.
Kandydat: ${l ? JSON.stringify({ imie_nazwisko: l.name, miasto: l.city, region: l.region, etap: STAGES[stageIdx(l)].n, status: STATUS_MAP[l.status]?.n, kapital: l.capital, lokal: l.hasPremises, model: l.model, notatki: (l.notes || '').slice(0, 800) }) : 'brak – szablon ogólny'}

Szablon (${TEMPLATES[S.msg.tpl].n}):
${out.subject ? 'Temat: ' + out.subject + '\n' : ''}${out.body}

Polecenie użytkownika: ${instr}`;
  btn.disabled = true; const label = btn.innerHTML; btn.innerHTML = 'Claude pisze…';
  S.ui.aiText = 'Claude pisze…'; scheduleRender();
  try {
    const res = await S.sample(prompt, { modelTier: 'default', onText: ({ text }) => { S.ui.aiText = text; const el = $('#ai-out'); if (el) el.innerHTML = renderMsgBody(text); } });
    S.ui.aiText = res.text;
  } catch (e) {
    S.ui.aiText = '';
    if (e && e.code === 'not_granted') { S.sample = null; toast('Dostęp do Claude nie został przyznany dla tej strony.', 'bad'); }
    else if (e && e.code === 'rate_limited') toast('Za dużo zapytań do Claude – spróbuj za chwilę.', 'bad');
    else toast('Claude nie odpowiedział: ' + (e && e.message || 'błąd'), 'bad');
  }
  btn.disabled = false; btn.innerHTML = label;
  scheduleRender();
}

/* ===== Analiza lokalizacji: popyt, przepustowość, konkurencja, rachunek, raport ===== */

const LOC_TYPES = {
  ulica: { n: 'Ulica handlowa / centrum', ind: 1.15, biz: 1.0 },
  osiedle: { n: 'Osiedle mieszkaniowe', ind: 1.0, biz: 0.8 },
  galeria: { n: 'Galeria / centrum handlowe', ind: 1.2, biz: 0.85 },
  park: { n: 'Park handlowy / przy markecie', ind: 1.1, biz: 1.05 },
  biznes: { n: 'Strefa biznesowa / przemysłowa', ind: 0.75, biz: 1.45 },
  wezel: { n: 'Dworzec / węzeł komunikacyjny', ind: 1.1, biz: 0.9 }
};
const COMP_TYPES = {
  multi: { n: 'Punkt nadań wielu przewoźników', w: 1.0 },
  sc: { n: 'Inny punkt Ship Center', w: 1.2 },
  poczta: { n: 'Placówka Poczty Polskiej', w: 0.5 },
  kurier: { n: 'Oddział / terminal kuriera', w: 0.4 },
  pudo: { n: 'Punkt odbioru w sklepie (Żabka, Orlen…)', w: 0.3 },
  paczkopunkt: { n: 'PaczkoPunkt InPost', w: 0.3 },
  automat: { n: 'Paczkomat / automat', w: 0.15 }
};
const LOC_DEFAULTS = {
  name: '', leadId: '', address: '', city: '', region: '', cityPop: 60000, catchment: 12000, type: 'ulica', traffic: 2000, visibility: 3, parking: 'ograniczony',
  firms: 40, area: 30, storage: 8, rent: 2500, media: 450, stations: 1, staff: 0, ownerWorks: true, staffCost: 0, hours: 9, days: 5,
  inpost: false, inpostParcels: 600, competitors: [],
  a: { indivRate: 0.25, capture: 0.06, bizShare: 0.15, bizAvg: 60, margin: 9, avgValue: 22, inpostFee: 0.7, minPerParcel: 4, storagePerM2: 20, fitout: 15000, signage: 4000, depositMonths: 2, other: 400 }
};
const decay = d => d <= 300 ? 1 : d <= 800 ? 0.7 : d <= 1500 ? 0.45 : d <= 3000 ? 0.2 : 0;

function analyzeLocation(x) {
  const L = { ...LOC_DEFAULTS, ...x, a: { ...LOC_DEFAULTS.a, ...(x.a || {}) } };
  const a = L.a;
  const o = offer();
  const lt = LOC_TYPES[L.type] || LOC_TYPES.ulica;
  const pop = +L.catchment > 0 ? +L.catchment : (+L.cityPop || 0) * 0.15;
  const trafficF = 0.75 + 0.25 * Math.min(2, (+L.traffic || 0) / 2000);
  const visF = 0.85 + 0.075 * ((+L.visibility || 3) - 1);
  const parkF = ({ brak: 0.9, ograniczony: 1.0, dobry: 1.1 })[L.parking] || 1;
  const comps = (L.competitors || []).filter(c => c && (+c.dist >= 0));
  let ci = 0, scConflict = null;
  const compRows = comps.map(c => {
    const t = COMP_TYPES[c.type] || COMP_TYPES.multi;
    const contrib = t.w * decay(+c.dist || 0) * ((+c.strength || 3) / 3);
    ci += contrib;
    if (c.type === 'sc' && +c.dist < o.ochrona * 1000) scConflict = c;
    return { ...c, tn: t.n, contrib };
  });
  const compF = 1 / (1 + 0.4 * ci);
  const indiv = pop * a.indivRate * a.capture * lt.ind * trafficF * visF * compF;
  const biz = (+L.firms || 0) * a.bizShare * a.bizAvg * lt.biz * parkF * Math.sqrt(compF);
  const base = indiv + biz;
  const demand = { indiv, biz, base, low: base * 0.7, high: base * 1.3, peak: base * 1.35 };
  // przepustowość
  const daysM = (+L.days || 5) * 4.33;
  const people = Math.max(1, Math.min(+L.stations || 1, (+L.staff || 0) + (L.ownerWorks ? 1 : 0) || 1));
  const perHour = 60 / Math.max(1, a.minPerParcel) * 0.7;
  const serviceCap = people * (+L.hours || 8) * daysM * perHour;
  const storageCap = (+L.storage || 0) * a.storagePerM2 * daysM;
  const capacity = Math.max(1, storageCap > 0 ? Math.min(serviceCap, storageCap) : serviceCap);
  const inpostLoad = L.inpost ? (+L.inpostParcels || 0) * 0.4 : 0;
  const util = (base + inpostLoad) / capacity;
  const utilPeak = (demand.peak + inpostLoad) / capacity;
  const bottleneck = storageCap > 0 && storageCap < serviceCap ? 'zaplecze (miejsce na paczki)' : 'obsługa przy ladzie';
  // rachunek
  const scen = mult => {
    const parcels = base * mult;
    const revenue = parcels * a.margin + (L.inpost ? (+L.inpostParcels || 0) * Math.max(0, a.inpostFee - 0.1) : 0);
    const fee = parcels >= o.progRabatu ? 0 : o.oplataMies;
    const p24 = parcels * a.avgValue * o.prowizjaP24 / 100;
    const staff = (+L.staff || 0) * (+L.staffCost || 0);
    const costs = (+L.rent || 0) + (+L.media || 0) + staff + fee + p24 + a.other;
    return { parcels, revenue, fee, p24, staff, costs, profit: revenue - costs };
  };
  const fin = { low: scen(0.7), base: scen(1), high: scen(1.3) };
  const startup = o.licencja + a.fitout + a.signage + (+L.rent || 0) * a.depositMonths;
  const payback = fin.base.profit > 0 ? startup / fin.base.profit : null;
  const fixed = (+L.rent || 0) + (+L.media || 0) + (+L.staff || 0) * (+L.staffCost || 0) + a.other + o.oplataMies;
  const unit = a.margin - a.avgValue * o.prowizjaP24 / 100;
  const breakEven = unit > 0 ? fixed / unit : null;
  // ocena
  const sDemand = clamp(base / 800 * 100, 0, 100);
  const sComp = clamp(compF * 100, 0, 100);
  const siteProd = (lt.ind * 0.6 + lt.biz * 0.4) * trafficF * visF * parkF;
  const sSite = clamp((siteProd - 0.7) / 0.7 * 100, 0, 100);
  const sEcon = clamp(50 + fin.base.profit / (fin.base.profit >= 0 ? 50 : 40), 0, 100);
  const sCap = util <= 0.85 && util >= 0.35 ? 100 : util > 0.85 ? clamp(100 - (util - 0.85) * 200, 0, 100) : clamp(40 + util / 0.35 * 60, 0, 100);
  let score = Math.round(0.3 * sDemand + 0.2 * sComp + 0.2 * sSite + 0.2 * sEcon + 0.1 * sCap);
  const flags = [];
  if (scConflict) { flags.push({ k: 'bad', t: `Inny punkt Ship Center w odległości ${fmt(+scConflict.dist)} m – narusza ochronę ${o.ochrona} km (OWU § 6 ust. 4).` }); score = Math.min(score, 35); }
  if (base < o.minPaczek) flags.push({ k: 'bad', t: `Szacowany popyt (${fmt(base)} paczek) jest poniżej minimum ${o.minPaczek} paczek miesięcznie z umowy.` });
  if (base >= o.progRabatu) flags.push({ k: 'good', t: `Popyt powyżej ${o.progRabatu} paczek – w scenariuszu bazowym opłata miesięczna ${o.oplataMies} zł spada do 0 zł.` });
  if (utilPeak > 1) flags.push({ k: 'warn', t: `W szczycie sezonu (listopad–grudzień) obciążenie sięga ${pct(utilPeak)} przepustowości – wąskie gardło: ${bottleneck}. Zaplanuj dodatkową osobę lub większe zaplecze.` });
  else if (util < 0.35) flags.push({ k: 'warn', t: `Wykorzystanie przepustowości tylko ${pct(util)} – lokal lub obsada może być przewymiarowana względem popytu.` });
  if (fin.base.profit < 0) flags.push({ k: 'warn', t: `W scenariuszu bazowym koszty przewyższają przychód o ${zl(-fin.base.profit)} miesięcznie. Próg rentowności: ok. ${fmt(breakEven)} paczek.` });
  if (ci > 2) flags.push({ k: 'warn', t: `Wysoka presja konkurencji (indeks ${fmt(ci, 2)}) – kluczowe będzie pozyskanie klientów biznesowych.` });
  const grade = score >= 75 ? 'A' : score >= 60 ? 'B' : score >= 45 ? 'C' : 'D';
  const gradeText = { A: 'Rekomendowana', B: 'Dobra – warunkowo', C: 'Do weryfikacji', D: 'Nie rekomendowana' }[grade];
  return { L, pop, trafficF, visF, parkF, lt, ci, compF, compRows, compCount: compRows.filter(c => +c.dist <= 3000).length, demand, capacity, serviceCap, storageCap, util, utilPeak, bottleneck, people, fin, startup, payback, breakEven, subs: { sDemand, sComp, sSite, sEcon, sCap }, score, grade, gradeText, flags, scConflict };
}

function viewLocations() {
  if (isLoading()) return `<div class="skeleton">Wczytywanie analiz…</div>`;
  const locs = Object.values(D().locations).sort((a, b) => (b.updatedTs || '').localeCompare(a.updatedTs || ''));
  const head = `<div class="viewhead"><div class="grow"><span class="eyebrow">Ocena potencjału punktów</span><h1>Analiza lokalizacji</h1>
    <p>Szacuje popyt na nadania, przepustowość punktu, presję konkurencji w promieniu 3 km i rachunek miesięczny. Z każdej analizy wygenerujesz raport dla kandydata na franczyzobiorcę.</p></div>
    <div class="actions"><button class="btn primary" data-act="loc-new">${ICONS.pin}Nowa analiza</button></div></div>`;
  if (!locs.length) return head + `<div class="card"><div class="empty"><h3>Nie ma jeszcze żadnej analizy</h3><p>Wprowadź dane lokalu i okolicy: liczbę mieszkańców, ruch pieszy, firmy wysyłające paczki, czynsz, obsadę i punkty konkurencji. Ocena i raport policzą się od razu.</p><button class="btn primary" data-act="loc-new">${ICONS.pin}Nowa analiza</button></div></div>`;
  return head + `<div class="grid3">${locs.map(x => {
    const r = analyzeLocation(x); const l = x.leadId ? D().leads[x.leadId] : null;
    return `<a class="card loccard" href="#lok-${x.id}" style="text-decoration:none;color:inherit">
      <span class="scorebadge grade-${r.grade}"><b>${r.score}</b><span>/ 100</span></span>
      <span style="min-width:0"><b>${esc(x.name || x.address || x.city || 'Lokalizacja')}</b><br>
      <span class="small ink2">${esc([x.city, x.region].filter(Boolean).join(' · '))}</span><br>
      <span class="small"><span class="pill ${r.grade === 'A' ? 'good' : r.grade === 'D' ? 'bad' : r.grade === 'C' ? 'warn' : ''}">${r.gradeText}</span></span><br>
      <span class="tiny muted">${fmt(r.demand.base)} paczek/mies. · wynik ${zl(r.fin.base.profit)}${l ? ' · ' + esc(l.name) : ''}</span></span></a>`;
  }).join('')}</div>`;
}

function newLocation(leadId = '') {
  const l = leadId ? D().leads[leadId] : null;
  const x = clone(LOC_DEFAULTS);
  Object.assign(x, { id: uid('loc'), leadId, name: l ? `${l.city || 'Lokalizacja'} – ${l.name}` : 'Nowa lokalizacja', city: l ? l.city : '', region: l ? l.region : '', createdAt: todayISO(), updatedTs: new Date().toISOString() });
  put('locations', x.id, x);
  go('lok-' + x.id);
}

  const sub = (n, v) => `<div class="subbar"><span class="small">${n}</span><div class="track"><i style="width:${v}%;background:var(${v >= 70 ? '--good' : v >= 45 ? '--s1' : '--s2'})"></i></div><span class="small num">${Math.round(v)}</span></div>`;

  return head + `<div class="split">${form}${results}</div>`;

function capacityBars(r) {
  const max = Math.max(r.capacity, r.demand.high, r.demand.peak) * 1.05;
  const row = (n, v, col, tip) => `<div class="subbar" data-tip="${esc(tip)}"><span class="small">${n}</span><div class="track" style="height:12px"><i style="width:${clamp(v / max * 100, 0, 100)}%;background:var(${col})"></i></div><span class="small num">${fmt(v)}</span></div>`;
  return `<div class="subbars" style="margin-bottom:10px">${row('Popyt – zakres', r.demand.high, '--s1', `Zakres popytu ${fmt(r.demand.low)}–${fmt(r.demand.high)}`)}${row('Popyt – bazowy', r.demand.base, '--s1', 'Scenariusz bazowy')}${row('Szczyt sezonu', r.demand.peak, '--s2', 'Listopad–grudzień: +35%')}${row('Przepustowość', r.capacity, '--s3', 'Maksymalna liczba nadań przy obecnej obsadzie i zapleczu')}</div>`;
}

function compRadar(r, forReport = false) {
  const size = 300, c = size / 2, R = c - 18;
  const rings = [300, 800, 1500, 3000];
  const rad = d => Math.sqrt(Math.min(d, 3000) / 3000) * R;
  const col = forReport ? { s1: '#2a78d6', ink: '#0f1b2d', muted: '#6f7c91', grid: '#dce2eb', acc: '#e2691a', bad: '#d03b3b' } : null;
  const v = k => forReport ? col[k] : `var(--${k === 'ink' ? 'ink' : k === 'muted' ? 'muted' : k === 'grid' ? 'line' : k === 'acc' ? 'accent' : k === 'bad' ? 'bad' : 's1'})`;
  const typeColor = { multi: forReport ? '#eb6834' : 'var(--s2)', sc: v('bad'), poczta: forReport ? '#6250d6' : 'var(--s7)', kurier: forReport ? '#1baf7a' : 'var(--s3)', pudo: forReport ? '#e87ba4' : 'var(--s5)', paczkopunkt: forReport ? '#eda100' : 'var(--s4)', automat: forReport ? '#2a78d6' : 'var(--s1)' };
  let s = `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="Mapa odległości konkurencji" style="max-width:340px;margin:0 auto;display:block">`;
  rings.forEach(d => { const q = rad(d) * 0.7071; s += `<circle cx="${c}" cy="${c}" r="${rad(d)}" fill="none" stroke="${v('grid')}" stroke-width="1"/><text x="${c + q + 2}" y="${c + q + 9}" style="fill:${v('muted')};font-size:9px;font-family:monospace">${d >= 1000 ? fmt(d / 1000, 1) + ' km' : d + ' m'}</text>`; });
  r.compRows.forEach((cp, i) => {
    const ang = i * 2.39996 - Math.PI / 2;
    const rr = rad(+cp.dist || 0);
    const x = c + Math.cos(ang) * rr, y = c + Math.sin(ang) * rr;
    s += `<circle cx="${x}" cy="${y}" r="${4 + (+cp.strength || 3)}" fill="${typeColor[cp.type] || v('s1')}" stroke="${forReport ? '#fff' : 'var(--surface)'}" stroke-width="2" ${forReport ? '' : `data-tip="${esc((cp.name || cp.tn) + ' · ' + cp.tn + ' · ' + fmt(+cp.dist) + ' m · siła ' + (cp.strength || 3))}"`}/>`;
  });
  s += `<rect x="${c - 8}" y="${c - 8}" width="16" height="16" rx="3" fill="${v('acc')}" stroke="${forReport ? '#fff' : 'var(--surface)'}" stroke-width="2"/></svg>`;
  const used = [...new Set(r.compRows.map(x => x.type))];
  const legend = `<div class="legend" style="justify-content:center"><span><i style="background:${v('acc')}"></i>Lokal</span>${used.map(t => `<span><i style="background:${typeColor[t]};border-radius:50%"></i>${esc(COMP_TYPES[t]?.n || t)}</span>`).join('')}</div>`;
  if (forReport) return { svg: s, legend: `<p style="font-size:11px;color:#44526a;text-align:center;margin:6px 0 0">■ lokal · ${used.map(t => `<span style="color:${typeColor[t]}">●</span> ${esc(COMP_TYPES[t]?.n || t)}`).join(' · ')}</p>` };
  return r.compRows.length ? s + legend : `<p class="muted small">Dodaj punkty konkurencji, aby zobaczyć mapę odległości.</p>`;
}

/* zapis pól analizy */
function onLocInput(el) {
  const id = S.route.id; const x = D().locations[id]; if (!x) return;
  const nx = clone(x);
  if (el.dataset.loc) {
    const k = el.dataset.loc; let v = el.value;
    if (el.type === 'number') v = el.value === '' ? '' : +el.value;
    if (v === 'true') v = true; else if (v === 'false') v = false;
    nx[k] = v;
  } else if (el.dataset.locA) { nx.a = { ...(nx.a || {}), [el.dataset.locA]: +el.value || 0 }; }
  else if (el.dataset.comp != null) {
    const i = +el.dataset.comp; const comps = (nx.competitors || []).slice();
    comps[i] = { ...comps[i], [el.dataset.k]: el.type === 'number' || el.dataset.k === 'strength' ? +el.value : el.value }; nx.competitors = comps;
  }
  nx.updatedTs = new Date().toISOString();
  D().locations[id] = nx;
  debounce('loc-render', () => scheduleRender(), 300);
  debounce('loc-save-' + id, () => { const cur = D().locations[id]; if (cur) put('locations', id, cur); }, 900);
}

const PDF_LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];
let pdfLibsPromise = null;
function loadPdfLibs() {
  if (window.html2canvas && window.jspdf) return Promise.resolve();
  if (!pdfLibsPromise) pdfLibsPromise = PDF_LIBS.reduce((p, src) => p.then(() => new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = () => rej(new Error('Nie udało się wczytać biblioteki PDF')); document.head.appendChild(sc); })), Promise.resolve()).catch(e => { pdfLibsPromise = null; throw e; });
  return pdfLibsPromise;
}
async function reportPdfBytes(x) {
  await loadPdfLibs();
  const r = analyzeLocation(x);
  const { css, body } = reportHTML(x, r, false);
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-10000px;top:0;width:820px;background:#fff;z-index:-1';
  host.innerHTML = `<style>${css} .rpt .pg{padding:28px 30px}</style>${body}`;
  document.body.appendChild(host);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const root = host.querySelector('.rpt');
    const scale = 2;
    const canvas = await window.html2canvas(root, { scale, backgroundColor: '#ffffff', logging: false });
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: true });
    const pageW = 210, pageH = 297, margin = 10;
    const pxPerMm = canvas.width / (pageW - 2 * margin);
    const pagePx = Math.floor((pageH - 2 * margin) * pxPerMm);
    const top0 = root.getBoundingClientRect().top;
    const breaks = [...root.querySelectorAll('h2, tr, .flag, .kpis, .two, ol, .foot, .comment, p')].map(el => Math.round((el.getBoundingClientRect().top - top0) * scale)).filter(v => v > 0).sort((a, b) => a - b);
    const heads = [...root.querySelectorAll('h2')].map(el => Math.round((el.getBoundingClientRect().top - top0) * scale) - 6);
    let y = 0, first = true;
    while (y < canvas.height - 4) {
      let end = Math.min(y + pagePx, canvas.height);
      if (end < canvas.height) {
        const cand = breaks.filter(b => b > y + pagePx * 0.5 && b <= end); if (cand.length) end = cand[cand.length - 1];
        const orphan = heads.filter(h => h > y + pagePx * 0.4 && h < end && end - h < 70 * scale); if (orphan.length) end = orphan[0];
      }
      const slice = document.createElement('canvas');
      slice.width = canvas.width; slice.height = end - y;
      const ctx = slice.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, slice.width, slice.height);
      ctx.drawImage(canvas, 0, y, canvas.width, end - y, 0, 0, canvas.width, end - y);
      if (!first) pdf.addPage();
      pdf.addImage(slice.toDataURL('image/jpeg', 0.9), 'JPEG', margin, margin, pageW - 2 * margin, (end - y) / pxPerMm);
      first = false; y = end;
    }
    const n = pdf.getNumberOfPages();
    for (let i = 1; i <= n; i++) { pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(140); pdf.text(`${i} / ${n}`, pageW - margin, pageH - 4, { align: 'right' }); }
    return pdf.output('arraybuffer');
  } finally { host.remove(); }
}

];
const normKey = s => String(s || '').toLowerCase().trim().replace(/\s+/g, ' ');
function guessField(header) {
  const h = normKey(header);
  let best = '';
  for (const f of LEAD_FIELDS) if (f.keys.includes(h)) { best = f.k; break; }
  if (!best) for (const f of LEAD_FIELDS) if (f.keys.some(k => k.length > 3 && h.includes(k))) { best = f.k; break; }
  return best;
}
function matchSource(v) {
  const s = normKey(v);
  if (!s) return '';
  if (/(fb|facebook|instagram|meta|ig)/.test(s)) return 'meta';
  if (/(google|adwords|gads)/.test(s)) return 'google';
  if (/(portal|franczyz|franchis)/.test(s)) return 'portale';
  if (/linkedin/.test(s)) return 'linkedin';
  if (/(polec|referr)/.test(s)) return 'polecenia';
  if (/(targi|event|expo)/.test(s)) return 'targi';
  if (/(www|strona|seo|organic|site)/.test(s)) return 'www';
  if (/webinar/.test(s)) return 'webinar';
  if (/(outbound|cold|telefon)/.test(s)) return 'outbound';
  const exact = SOURCES.find(x => normKey(x.n) === s || x.k === s);
  return exact ? exact.k : 'inne';
}
function matchRegion(v) {
  const s = normKey(v).replace(/^woj\.?\s*/, '').replace('województwo ', '');
  return REGIONS.find(r => r === s) || REGIONS.find(r => r.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace('ł', 'l') === s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace('ł', 'l')) || '';
}
function parseDateLoose(v) {
  if (v == null || v === '') return '';
  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return isoDate(d); }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/); if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  const d = new Date(s); return isNaN(d) ? '' : isoDate(d);
}
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const firstLine = text.split(/\r?\n/)[0] || '';
  const delim = [';', '\t', ','].map(d => [d, firstLine.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

function readImportFile(file) {
  const name = file.name || 'plik';
  const isX = /\.xlsx?$/i.test(name);
  const reader = new FileReader();
  reader.onerror = () => toast('Nie udało się odczytać pliku.', 'bad');
  reader.onload = () => {
    try {
      if (isX) {
        if (!window.XLSX) { toast('Biblioteka XLSX nie wczytała się – zapisz plik jako CSV.', 'bad'); return; }
        const wb = XLSX.read(new Uint8Array(reader.result), { type: 'array', cellDates: false });
        const ws = wb.Sheets[wb.SheetNames[0]];
        setImportTable(XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' }), name);
      } else {
        let text = reader.result;
        if (text.includes('\uFFFD')) { const r2 = new FileReader(); r2.onload = () => setImportTable(parseCSV(r2.result), name); r2.readAsText(file, 'windows-1250'); return; }
        setImportTable(parseCSV(text), name);
      }
    } catch (e) { toast('Błąd odczytu pliku: ' + e.message, 'bad'); }
  };
  if (isX) reader.readAsArrayBuffer(file); else reader.readAsText(file, 'utf-8');
}
function buildImportRows() {
  const src = ($('#imp-src') || {}).value || IMP.defSource || 'meta';
  const owner = ($('#imp-owner') || {}).value ?? IMP.defOwner ?? '';
  const region = ($('#imp-region') || {}).value ?? IMP.defRegion ?? '';
  return IMP.rows.map(r => {
    const o = {};
    Object.entries(IMP.map).forEach(([i, k]) => { if (k) { const v = r[i]; if (v !== '' && v != null) o[k] = o[k] ? o[k] + ' ' + v : v; } });
    const name = [o.name, o.lastName].filter(Boolean).join(' ').trim();
    const ownerId = o.owner ? (team().find(m => normKey(m.name) === normKey(o.owner) || normKey(m.name).startsWith(normKey(o.owner)))?.id || owner) : owner;
    const status = o.status ? (STATUSES.find(s => normKey(s.n) === normKey(o.status) || s.k === normKey(o.status))?.k || 'do_kontaktu') : 'do_kontaktu';
    return {
      name, company: String(o.company || '').trim(), phone: String(o.phone || '').replace(/^p:/, '').trim(), email: String(o.email || '').trim(),
      city: String(o.city || '').trim(), region: matchRegion(o.region) || region, source: matchSource(o.source) || src, ownerId,
      model: /ship\s*-?\s*point|partner|point/i.test(String(o.model || '')) ? 'shippoint' : 'franczyza',
      capital: String(o.capital || '').replace(/[^\d]/g, ''), notes: String(o.notes || '').trim(), createdAt: parseDateLoose(o.createdAt) || todayISO(), status
    };
  }).filter(r => r.name || r.phone || r.email);
}
async function runImport(btn) {
  const rows = buildImportRows();
  const skip = (($('#imp-dups') || {}).value || 'skip') === 'skip';
  const pool = leadsArr();
  const batchSeen = [];
  const items = [];
  rows.forEach(r => {
    if (skip && (findDuplicate(r, pool) || findDuplicate(r, batchSeen))) return;
    batchSeen.push(r);
    const lead = newLead({ ...r, name: r.name || r.email || r.phone, nextTaskDate: todayISO() });
    lead.stageDates = r.status === 'pozyskany' ? { umowa: r.createdAt } : {};
    lead.history = [histEntry('system', 'Import z pliku: ' + (IMP.fileName || 'wklejone dane'))];
    items.push(lead);
  });
  if (!items.length) { toast('Brak nowych leadów do zaimportowania.', 'bad'); return; }
  btn.disabled = true;
  const prog = $('#imp-progress');
  const res = await putMany('leads', items, (d, n) => { if (prog) prog.textContent = `Zapisywanie: ${d} / ${n}`; });
  closeModal();
  toast(`Zaimportowano ${res.done - res.failed} leadów${res.failed ? ', błędy: ' + res.failed : ''}`);
  go('leady');
}

function toCSV(rows) {
  if (!rows.length) return '';
  const cols = Object.keys(rows[0]);
  const cell = v => { const s = String(v ?? ''); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return '\uFEFF' + [cols.map(cell).join(';'), ...rows.map(r => cols.map(c => cell(r[c])).join(';'))].join('\r\n');
}

function autoAssign() {
  const members = team();
  const loads = Object.fromEntries(members.map(m => [m.id, leadsArr().filter(l => l.ownerId === m.id && isOpen(l)).length]));
  let n = 0;
  leadsArr().filter(l => !l.ownerId && isOpen(l)).forEach(l => {
    const cands = members.filter(m => (m.regions || []).includes(l.region));
    if (!cands.length) return;
    const m = cands.sort((a, b) => loads[a.id] - loads[b.id])[0];
    loads[m.id]++; n++;
    const hist = (l.history || []).slice(); hist.push(histEntry('system', 'Automatyczne przypisanie wg regionu: ' + m.name));
    patch('leads', l.id, { ownerId: m.id, history: hist });
  });
  toast(n ? `Przypisano ${n} leadów` : 'Brak leadów do przypisania (sprawdź regiony osób i leadów).', n ? '' : 'bad');
}

function buildDemo() {
  const d = emptyData();
  const rnd = (() => { let x = 7; return () => (x = (x * 16807) % 2147483647) / 2147483647; })();
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const people = [['Przykład: Marta Zielińska', 'Centrala – dyrektor rozwoju', ['śląskie', 'opolskie', 'małopolskie']], ['Przykład: Paweł Nowicki', 'Opiekun regionalny', ['mazowieckie', 'łódzkie', 'podlaskie', 'lubelskie']], ['Przykład: Tomasz Wrona', 'Opiekun regionalny', ['wielkopolskie', 'dolnośląskie', 'pomorskie', 'kujawsko-pomorskie', 'podkarpackie', 'świętokrzyskie']]];

  const first = ['Anna', 'Piotr', 'Katarzyna', 'Michał', 'Agnieszka', 'Krzysztof', 'Magdalena', 'Łukasz', 'Joanna', 'Marcin', 'Natalia', 'Adam', 'Karolina', 'Jakub', 'Monika', 'Grzegorz'];
  const last = ['Kowalczyk', 'Wiśniewski', 'Lewandowska', 'Dąbrowski', 'Mazur', 'Kaczmarek', 'Zając', 'Pawlak', 'Michalska', 'Sikora', 'Baran', 'Wróbel', 'Górska', 'Jabłoński'];
  const srcW = ['google', 'google', 'google', 'google', 'www', 'www', 'meta', 'portale', 'polecenia', 'inne'];
  const conv = [0.78, 0.65, 0.4, 0.4];
  const t = todayISO();
  for (let i = 0; i < 120; i++) {
    const age = Math.floor(Math.pow(rnd(), 0.9) * 75);
    const created = addDays(new Date(), -age);
    let st = 0; while (st < NS - 1 && rnd() < conv[st] && age > st * 9) st++;
    const [city, region] = pick(cities);

    const lost = st < NS - 1 && age > 20 && rnd() < 0.35;
    const sd = {}; if (st >= 3) sd.spotkanie = isoDate(addDays(created, Math.min(age, 8 + Math.round(rnd() * 10)))); if (st >= 4) sd.umowa = isoDate(addDays(created, Math.min(age, 20 + Math.round(rnd() * 20))));
    const fn = pick(first), ln = pick(last);
    const model = rnd() < 0.72 ? 'franczyza' : 'shippoint';

    const firstCallAt = st >= 1 ? isoDate(addDays(created, Math.min(age, rnd() < 0.75 ? 0 : 2))) : '';
    const presentationAt = st >= 2 ? isoDate(addDays(parseD(firstCallAt || isoDate(created)), Math.min(age, 1))) : '';
    const hist = [histEntry('system', 'Zapytanie z formularza: ' + (model === 'shippoint' ? 'Ship Point' : 'franczyza') + ' (dane przykładowe)')];

    if (sd.umowa) hist.push({ id: uid('h'), at: sd.umowa + 'T12:00', type: 'notatka', text: 'Umowa podpisana.', result: 'Inne', by: owner });
    const id = 'demo-l' + pad(i);

    const nt = open && (st > 0 || rnd() < 0.5) && rnd() < 0.9 ? isoDate(addDays(new Date(), Math.floor(rnd() * 11) - 3)) : '';
    d.leads[id] = { id, name: `${fn} ${ln}`, company: model === 'shippoint' ? `${ln} – sklep` : '', phone: '+48 5' + String(10000000 + Math.floor(rnd() * 89999999)), email: `${fn}.${ln}`.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ł/g, 'l') + '@example.com', city, region, source: pick(srcW), ownerId: owner, status, capital: String(20000 + Math.floor(rnd() * 8) * 10000), model, pkg: model === 'franczyza' && st >= 2 ? pick(['smart', 'flex', '']) : '', hasPremises: pick(['ma', 'szuka', '']), form: 'panstwo',
      nextTask: nt ? (presentationAt ? 'Telefon po prezentacji' : firstCallAt ? 'Umówić spotkanie' : 'Pierwsza rozmowa telefoniczna') : '', nextTaskDate: nt, nextTaskTime: nt && rnd() < 0.4 ? pick(['09:30', '11:00', '13:00', '15:30']) : '', firstCallAt, presentationAt,

    if (firstCallAt && rnd() < 0.6 && age < 30) { const sid = uid('sms'); d.sms[sid] = { leadId: id, leadName: `${fn} ${ln}`, phone: d.leads[id].phone, text: smsThanksText(d.leads[id]), ownerId: owner, status: age < 1 ? 'oczekuje' : 'wyslany', createdTs: firstCallAt + 'T10:35:00.000Z', id: sid }; }
  }
  for (let k = 0; k < 75; k++) { const dt = isoDate(addDays(new Date(), -k)); const cost = Math.round(380 + rnd() * 260); const clicks = Math.round(cost / (3.5 + rnd() * 2)); d.ads['demo-' + dt] = { id: 'demo-' + dt, date: dt, campaign: 'Franczyza – Search (przykład)', cost, clicks, impressions: clicks * Math.round(14 + rnd() * 10), conversions: Math.round(rnd() * 3 * 10) / 10 }; }
  const l0 = Object.values(d.leads).find(l => stageIdx(l) === 3) || Object.values(d.leads)[0];
  const loc = { ...clone(LOC_DEFAULTS), id: 'demo-loc1', name: `${l0.city} – ul. Przykładowa 12`, leadId: l0.id, address: 'ul. Przykładowa 12', city: l0.city, region: l0.region, cityPop: 135000, catchment: 15000, traffic: 2600, visibility: 4, parking: 'ograniczony', firms: 55, rent: 2600, createdAt: t,
    competitors: [{ name: 'Paczkomat przy markecie', type: 'automat', dist: 150, strength: 3 }, { name: 'Paczkomat – parking', type: 'automat', dist: 420, strength: 3 }, { name: 'Żabka', type: 'pudo', dist: 260, strength: 2 }, { name: 'Poczta Polska UP 3', type: 'poczta', dist: 900, strength: 3 }, { name: 'Punkt nadań „Paczka Expres”', type: 'multi', dist: 1700, strength: 4 }, { name: 'Orlen – stacja', type: 'pudo', dist: 1100, strength: 2 }] };
  d.locations[loc.id] = loc;
  return d;

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (el.tagName === 'A' && el.getAttribute('href')) return;
  if (el.tagName === 'BUTTON' || act === 'modal-bg') { if (el.type === 'submit') e.preventDefault(); }
  handleAction(act, el, e);
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f === 'q') { S.f.q = el.value; debounce('q', () => scheduleRender(), 250); return; }
  if (el.dataset.loc != null || el.dataset.locA || el.dataset.comp != null) { if (el.tagName !== 'SELECT') onLocInput(el); return; }
  if (el.dataset.locComment) { const id = el.dataset.locComment; const v = el.value; debounce('loc-comment', () => patch('locations', id, { aiComment: v }), 900); return; }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.f && el.dataset.f !== 'q') { S.f[el.dataset.f] = el.value; S.selected.clear(); scheduleRender(); return; }
  if (el.dataset.leadField) { saveLeadField(el); return; }
  if (el.closest && el.closest('#lead-edit')) { saveLeadEdit(); return; }
  if (el.dataset.msg) {
    S.msg[el.dataset.msg] = el.value;
    if (el.dataset.msg === 'leadId') { const l = D().leads[el.value]; S.msg.form = l ? (l.form || 'panstwo') : S.msg.form; }
    S.ui.aiText = ''; scheduleRender(); return;
  }
  if (el.dataset.loc != null || el.dataset.locA || el.dataset.comp != null) { onLocInput(el); return; }
  if (el.dataset.offer) {
    const o = { ...(settings().offer || {}) };
    o[el.dataset.offer] = el.type === 'number' ? +el.value : el.value;
    saveSettings({ offer: o }); return;
  }
  if (el.dataset.impMap != null) { IMP.map[el.dataset.impMap] = el.value; keepImpDefaults(); renderImport(); return; }
  if (['imp-src', 'imp-owner', 'imp-region', 'imp-dups'].includes(el.id)) { keepImpDefaults(); renderImport(); return; }
  if (el.id === 'c-owner') { S.ui.cOwner = el.value; scheduleRender(); return; }
  if (el.dataset.setting) { const v = el.type === 'number' ? +el.value : el.value; saveSettings({ [el.dataset.setting]: v }); return; }
